<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carnet de Fromages 🧀</title>
  
  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel pour lire le JSX dans le navigateur -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { margin: 0; padding: 0; background: #FAF6EC; }
    .fr-display { font-family: 'Fraunces', serif; }
    .note-chip { transition: transform .12s ease; }
    .note-chip:hover { transform: translateY(-1px); }
    .cheese-row:hover .row-actions { opacity: 1; }
    .row-actions { opacity: 0; transition: opacity .15s ease; }
    button { cursor: pointer; }
    input:focus { outline: 2px solid #B4791A55; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Note: type="text/babel" est crucial pour que Babel compile le React -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { createClient } = supabase;

    // ---------- Icônes (Remplacement de lucide-react) ----------
    const Plus = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const X = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const Pencil = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
    const Check = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const Trash2 = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const ChevronDown = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
    const ChevronRight = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;

    // ---------- Configuration Supabase ----------
    const SUPABASE_URL = 'https://kpjflntnotftpzffjbud.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwamZsbnRub3RmdHB6ZmZqYnVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODg0MjMsImV4cCI6MjEwMTg2NDQyM30.mTjm86Thn6VUOAAJRWCsGMcR0Ip-qEP08fJdwUvKKEo';

    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { 
      db: { schema: 'Fromage' } 
    });

    // ---------- Config & Seed ----------
    const MAIN_CATS = {
      vache: { label: "Fromage de vache", emoji: "🐮", accent: "#B4791A", tint: "#FBF3E3" },
      chevre: { label: "Fromages de Chèvre", emoji: "🐐", accent: "#5F7A3D", tint: "#F1F5E9" },
      brebis: { label: "Fromages de Brebis", emoji: "🐑", accent: "#9C4A3C", tint: "#FBEBE7" },
    };

    const SUBCATS = [
      "Pâtes Persillées (Les Bleus)",
      "Pâtes Molles à Croûte Fleurie",
      "Pâtes Molles à Croûte Lavée",
      "Pâtes Molles à Croûte Naturelle",
      "Pâtes Pressées Non Cuites",
      "Pâtes Pressées Cuites",
      "Fromages Frais & Spécialités",
      "Pâtes Filées",
    ];

    const RAW_SEED = [
      ["Gorgonzola", "vache", SUBCATS[0], [10]],
      ["Bleu de Gex AOP", "vache", SUBCATS[0], [10]],
      ["Pavé d'Affinois Brin", "vache", SUBCATS[1], [10]],
      ["Saint Albray", "vache", SUBCATS[2], [10]],
      ["Tomme suisse poivre et citron", "vache", SUBCATS[4], [10]],
      ["Emmental français", "vache", SUBCATS[5], [8]],
      ["Stracciatella", "vache", SUBCATS[6], [3]],
      ["Mozzarella", "vache", SUBCATS[7], [1]],
      ["Bûche de chèvre", "chevre", null, [10]],
      ["Ardi Gasna (Brebis des Pyrénées)", "brebis", null, [9]]
    ];

    function buildSeed() {
      return RAW_SEED.map(([name, main, sub, notes], i) => ({
        id: `seed-${i}-${Math.random().toString(36).slice(2, 6)}`,
        name,
        main,
        sub,
        notes: notes.map((v, j) => ({ id: `seed-${i}-${j}`, value: v })),
      }));
    }

    function avg(notes) {
      if (!notes || notes.length === 0) return null;
      return notes.reduce((a, n) => a + n.value, 0) / notes.length;
    }

    function fmt(n) {
      if (n === null) return "—";
      return Number.isInteger(n) ? `${n}` : n.toFixed(1).replace(/\.0$/, "");
    }

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    async function callClaude(systemPrompt, userPrompt) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: "user", content: userPrompt }],
        }),
      });
      const data = await res.json();
      const text = (data.content || [])
        .map((b) => (b.type === "text" ? b.text : ""))
        .join("")
        .trim();
      const clean = text.replace(/```json/gi, "").replace(/```/g, "").trim();
      return JSON.parse(clean);
    }

    async function classifyCheese(name) {
      const system =
        "Tu es un expert fromager français. Tu classes des fromages dans une classification précise. " +
        "Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans markdown.";
      const prompt = `Classe ce fromage : "${name}".
      Réponds avec exactement ce format JSON :
      {"main": "vache" | "chevre" | "brebis", "sub": <une valeur EXACTE de cette liste si main="vache", sinon null> ${JSON.stringify(SUBCATS)}}`;
      
      // Ici en vrai il te faudrait la clé API Anthropic pour que ça marche
      // Attention à ne pas exposer tes clés API secrètes dans le HTML front-end !
      try {
        const parsed = await callClaude(system, prompt);
        if (!["vache", "chevre", "brebis"].includes(parsed.main)) throw new Error("main invalide");
        if (parsed.main === "vache" && !SUBCATS.includes(parsed.sub)) throw new Error("sub invalide");
        return { main: parsed.main, sub: parsed.main === "vache" ? parsed.sub : null };
      } catch (e) {
        throw new Error("Erreur IA");
      }
    }

    // ---------- Component Principal ----------
    function FromageTracker() {
      const [cheeses, setCheeses] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [collapsed, setCollapsed] = useState({});
      const [editingId, setEditingId] = useState(null);
      const [editingName, setEditingName] = useState("");
      const [noteDraftFor, setNoteDraftFor] = useState(null);
      const [noteDraftValue, setNoteDraftValue] = useState("");
      const [modal, setModal] = useState(null);
      const [error, setError] = useState("");

      const editInputRef = useRef(null);

      useEffect(() => {
        (async () => {
          try {
            const { data, error } = await supabaseClient.from('notes').select('*');
            if (error) throw error;

            if (data && data.length > 0) {
              setCheeses(data);
            } else {
              const seed = buildSeed();
              const { error: insertError } = await supabaseClient.from('notes').insert(seed);
              if (insertError) throw insertError;
              setCheeses(seed);
            }
          } catch (e) {
            console.error(e);
            setError("Erreur de connexion à la base de données.");
          } finally {
            setLoaded(true);
          }
        })();
      }, []);

      function toggleCollapse(key) {
        setCollapsed((c) => ({ ...c, [key]: !c[key] }));
      }

      function startAdd() { setModal({ step: "name", name: "", note: "", main: null, sub: null }); }
      function cancelModal() { setModal(null); }
      function submitName(e) { e.preventDefault(); if (!modal.name.trim()) return; setModal({ ...modal, step: "note" }); }
      
      async function submitNote(e) {
        e.preventDefault();
        setModal((m) => ({ ...m, step: "classifying" }));
        try {
          const { main, sub } = await classifyCheese(modal.name.trim());
          setModal((m) => ({ ...m, main, sub, step: "confirm" }));
        } catch (err) {
          setModal((m) => ({ ...m, step: "main", aiFailed: true }));
        }
      }
      
      function chooseMain(main) {
        if (main === "vache") setModal({ ...modal, main, step: "sub" });
        else finalizeAdd(main, null);
      }
      function chooseSub(sub) { finalizeAdd(modal.main, sub); }

      async function finalizeAdd(main, sub) {
        const noteVal = parseFloat((modal.note || "").replace(",", "."));
        const notesArr = !isNaN(noteVal) ? [{ id: uid(), value: noteVal }] : [];
        const newCheese = { id: uid(), name: modal.name.trim(), main, sub, notes: notesArr };
        
        setCheeses((prev) => [...prev, newCheese]);
        setModal(null);

        const { error } = await supabaseClient.from('notes').insert([newCheese]);
        if (error) setError("Échec de la sauvegarde.");
      }

      function startEditName(c) {
        setEditingId(c.id);
        setEditingName(c.name);
        setTimeout(() => editInputRef.current && editInputRef.current.focus(), 0);
      }
      
      async function saveEditName(id) {
        if (!editingName.trim()) { setEditingId(null); return; }
        const newName = editingName.trim();
        setCheeses((prev) => prev.map((c) => (c.id === id ? { ...c, name: newName } : c)));
        setEditingId(null);

        await supabaseClient.from('notes').update({ name: newName }).eq('id', id);
      }

      function startAddNote(id) { setNoteDraftFor(id); setNoteDraftValue(""); }
      
      async function saveAddNote(id) {
        const v = parseFloat((noteDraftValue || "").replace(",", "."));
        if (isNaN(v)) { setNoteDraftFor(null); return; }
        
        const cheeseToUpdate = cheeses.find((c) => c.id === id);
        const updatedNotes = [...cheeseToUpdate.notes, { id: uid(), value: v }];

        setCheeses((prev) => prev.map((c) => c.id === id ? { ...c, notes: updatedNotes } : c));
        setNoteDraftFor(null);

        await supabaseClient.from('notes').update({ notes: updatedNotes }).eq('id', id);
      }

      async function removeNote(cheeseId, noteId) {
        const cheeseToUpdate = cheeses.find((c) => c.id === cheeseId);
        const updatedNotes = cheeseToUpdate.notes.filter((n) => n.id !== noteId);
        setCheeses((prev) => prev.map((c) => c.id === cheeseId ? { ...c, notes: updatedNotes } : c));
        await supabaseClient.from('notes').update({ notes: updatedNotes }).eq('id', cheeseId);
      }

      async function deleteCheese(id) {
        setCheeses((prev) => prev.filter((c) => c.id !== id));
        await supabaseClient.from('notes').delete().eq('id', id);
      }

      if (!loaded) {
        return (
          <div style={{ padding: 40, textAlign: "center", color: "#7a6a55", fontFamily: "Inter, sans-serif" }}>
            Chargement du carnet...
          </div>
        );
      }

      return (
        <div style={{ minHeight: "100vh", fontFamily: "Inter, sans-serif", color: "#2B2118" }}>
          {/* Header */}
          <div style={{ padding: "28px 20px 18px", maxWidth: 720, margin: "0 auto" }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <div>
                <h1 className="fr-display" style={{ fontSize: 30, fontWeight: 700, margin: 0, letterSpacing: -0.5 }}>
                  🧀 Carnet de Fromages
                </h1>
                <p style={{ margin: "4px 0 0", color: "#8a7a63", fontSize: 14 }}>
                  {cheeses.length} fromages goûtés · notés
                </p>
              </div>
              <button
                onClick={startAdd}
                style={{
                  display: "flex", alignItems: "center", gap: 6, background: "#2B2118",
                  color: "#FAF6EC", border: "none", borderRadius: 999, padding: "10px 16px",
                  fontSize: 14, fontWeight: 600,
                }}
              >
                <Plus size={16} /> Ajouter un fromage
              </button>
            </div>
            {error && <div style={{ marginTop: 10, fontSize: 13, color: "#9C4A3C" }}>{error}</div>}
          </div>

          {/* Sections */}
          <div style={{ maxWidth: 720, margin: "0 auto", padding: "0 20px 60px" }}>
            {Object.entries(MAIN_CATS).map(([mainKey, meta]) => {
              const inCat = cheeses.filter((c) => c.main === mainKey);
              if (inCat.length === 0) return null;
              return (
                <div key={mainKey} style={{ marginTop: 26 }}>
                  <h2
                    className="fr-display"
                    style={{
                      fontSize: 21, fontWeight: 600, color: meta.accent,
                      borderBottom: `2px solid ${meta.accent}33`, paddingBottom: 8, marginBottom: 10,
                    }}
                  >
                    {meta.emoji} {meta.label}
                  </h2>

                  {mainKey === "vache" ? (
                    SUBCATS.map((sub) => {
                      const items = inCat
                        .filter((c) => c.sub === sub)
                        .sort((a, b) => (avg(b.notes) ?? -1) - (avg(a.notes) ?? -1));
                      if (items.length === 0) return null;
                      const key = `${mainKey}-${sub}`;
                      const isCollapsed = collapsed[key];
                      return (
                        <div key={sub} style={{ marginBottom: 14 }}>
                          <button
                            onClick={() => toggleCollapse(key)}
                            style={{
                              display: "flex", alignItems: "center", gap: 6, background: "none",
                              border: "none", padding: "4px 0", fontSize: 14, fontWeight: 600, color: "#5a4d3c",
                            }}
                          >
                            {isCollapsed ? <ChevronRight size={14} /> : <ChevronDown size={14} />}
                            {sub} <span style={{ color: "#b0a48c", fontWeight: 400 }}>({items.length})</span>
                          </button>
                          {!isCollapsed && (
                            <div style={{ marginTop: 4 }}>
                              {items.map((c) => (
                                <CheeseRow key={c.id} cheese={c} accent={meta.accent} 
                                  editingId={editingId} editingName={editingName} setEditingName={setEditingName}
                                  editInputRef={editInputRef} startEditName={startEditName} saveEditName={saveEditName}
                                  noteDraftFor={noteDraftFor} noteDraftValue={noteDraftValue} setNoteDraftValue={setNoteDraftValue}
                                  startAddNote={startAddNote} saveAddNote={saveAddNote} setNoteDraftFor={setNoteDraftFor}
                                  removeNote={removeNote} deleteCheese={deleteCheese} />
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })
                  ) : (
                    <div>
                      {inCat
                        .sort((a, b) => (avg(b.notes) ?? -1) - (avg(a.notes) ?? -1))
                        .map((c) => (
                          <CheeseRow key={c.id} cheese={c} accent={meta.accent} 
                            editingId={editingId} editingName={editingName} setEditingName={setEditingName}
                            editInputRef={editInputRef} startEditName={startEditName} saveEditName={saveEditName}
                            noteDraftFor={noteDraftFor} noteDraftValue={noteDraftValue} setNoteDraftValue={setNoteDraftValue}
                            startAddNote={startAddNote} saveAddNote={saveAddNote} setNoteDraftFor={setNoteDraftFor}
                            removeNote={removeNote} deleteCheese={deleteCheese} />
                        ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Add modal */}
          {modal && (
            <div
              style={{
                position: "fixed", inset: 0, background: "#2B2118aa", display: "flex",
                alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50,
              }}
              onClick={(e) => e.target === e.currentTarget && cancelModal()}
            >
              <div style={{ background: "#FFFDF8", borderRadius: 16, padding: 24, width: "100%", maxWidth: 380, boxShadow: "0 20px 60px #00000033" }}>
                {modal.step === "name" && (
                  <form onSubmit={submitName}>
                    <p className="fr-display" style={{ fontSize: 18, fontWeight: 600, margin: "0 0 12px" }}>Quel est le nom du fromage ?</p>
                    <input autoFocus value={modal.name} onChange={(e) => setModal({ ...modal, name: e.target.value })} placeholder="Ex : Comté 18 mois" style={inputStyle} />
                    <ModalActions onCancel={cancelModal} submitLabel="Suivant" />
                  </form>
                )}
                {modal.step === "note" && (
                  <form onSubmit={submitNote}>
                    <p className="fr-display" style={{ fontSize: 18, fontWeight: 600, margin: "0 0 4px" }}>Quelle note pour « {modal.name} » ?</p>
                    <p style={{ fontSize: 13, color: "#8a7a63", margin: "0 0 12px" }}>Sur 10 (laisse vide si pas encore goûté)</p>
                    <input autoFocus value={modal.note} onChange={(e) => setModal({ ...modal, note: e.target.value })} placeholder="Ex : 8.5" style={inputStyle} />
                    <ModalActions onCancel={cancelModal} submitLabel="Suivant" />
                  </form>
                )}
                {modal.step === "classifying" && (
                  <div style={{ textAlign: "center", padding: "20px 0" }}>
                    <p className="fr-display" style={{ fontSize: 18, fontWeight: 600, margin: "0 0 6px" }}>L'IA classe « {modal.name} »…</p>
                    <p style={{ fontSize: 13, color: "#8a7a63", margin: 0 }}>Un instant, elle consulte sa cave à fromages.</p>
                  </div>
                )}
                {modal.step === "confirm" && (
                  <div>
                    <p className="fr-display" style={{ fontSize: 18, fontWeight: 600, margin: "0 0 4px" }}>L'IA propose :</p>
                    <div style={{ background: MAIN_CATS[modal.main].tint, border: `1px solid ${MAIN_CATS[modal.main].accent}55`, borderRadius: 10, padding: "10px 12px", margin: "10px 0 4px", fontSize: 14 }}>
                      {MAIN_CATS[modal.main].emoji} {MAIN_CATS[modal.main].label}
                      {modal.sub ? <><br /><span style={{ color: "#8a7a63" }}>{modal.sub}</span></> : null}
                    </div>
                    <button type="button" onClick={() => setModal({ ...modal, step: "main" })} style={{ background: "none", border: "none", color: "#8a7a63", fontSize: 13, padding: "4px 0", textDecoration: "underline" }}>Pas d'accord ? Choisir manuellement</button>
                    <ModalActions onCancel={cancelModal} submitLabel="Ajouter" onSubmit={() => finalizeAdd(modal.main, modal.sub)} />
                  </div>
                )}
                {modal.step === "main" && (
                  <div>
                    <p className="fr-display" style={{ fontSize: 18, fontWeight: 600, margin: "0 0 4px" }}>Où se place « {modal.name} » ?</p>
                    {modal.aiFailed && <p style={{ fontSize: 12.5, color: "#9C4A3C", margin: "0 0 10px" }}>L'IA n'a pas pu classer ce fromage — choisis toi-même.</p>}
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: modal.aiFailed ? 0 : 12 }}>
                      {Object.entries(MAIN_CATS).map(([key, meta]) => (
                        <button key={key} onClick={() => chooseMain(key)} style={{ ...choiceButtonStyle, borderColor: meta.accent + "55", background: meta.tint }}>{meta.emoji} {meta.label}</button>
                      ))}
                    </div>
                    <ModalActions onCancel={cancelModal} hideSubmit />
                  </div>
                )}
                {modal.step === "sub" && (
                  <div>
                    <p className="fr-display" style={{ fontSize: 18, fontWeight: 600, margin: "0 0 12px" }}>Quelle pâte, pour « {modal.name} » ?</p>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 320, overflowY: "auto" }}>
                      {SUBCATS.map((sub) => (
                        <button key={sub} onClick={() => chooseSub(sub)} style={{ ...choiceButtonStyle, borderColor: "#B4791A55", background: "#FBF3E3" }}>{sub}</button>
                      ))}
                    </div>
                    <ModalActions onCancel={cancelModal} hideSubmit />
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function ModalActions({ onCancel, submitLabel, hideSubmit, onSubmit }) {
      return (
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
          <button type="button" onClick={onCancel} style={{ background: "none", border: "none", color: "#8a7a63", fontSize: 14, padding: "8px 10px" }}>Annuler</button>
          {!hideSubmit && (
            <button type={onSubmit ? "button" : "submit"} onClick={onSubmit} style={{ background: "#2B2118", color: "#FAF6EC", border: "none", borderRadius: 999, padding: "8px 16px", fontSize: 14, fontWeight: 600 }}>{submitLabel}</button>
          )}
        </div>
      );
    }

    const inputStyle = { width: "100%", boxSizing: "border-box", border: "1px solid #d8cdb6", borderRadius: 10, padding: "10px 12px", fontSize: 15, fontFamily: "Inter, sans-serif", background: "#fff" };
    const choiceButtonStyle = { textAlign: "left", border: "1px solid", borderRadius: 10, padding: "10px 12px", fontSize: 14, fontWeight: 500, color: "#2B2118" };

    function CheeseRow({ cheese, accent, editingId, editingName, setEditingName, editInputRef, startEditName, saveEditName, noteDraftFor, noteDraftValue, setNoteDraftValue, startAddNote, saveAddNote, setNoteDraftFor, removeNote, deleteCheese }) {
      const a = avg(cheese.notes);
      const isEditing = editingId === cheese.id;
      const isDraftingNote = noteDraftFor === cheese.id;

      return (
        <div className="cheese-row" style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, padding: "9px 4px", borderBottom: "1px solid #ece4d1" }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {isEditing ? (
                <input ref={editInputRef} value={editingName} onChange={(e) => setEditingName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveEditName(cheese.id)} onBlur={() => saveEditName(cheese.id)} style={{ ...inputStyle, padding: "4px 8px", fontSize: 14, width: 220 }} />
              ) : (
                <span style={{ fontSize: 15, fontWeight: 500 }}>{cheese.name}</span>
              )}
              {!isEditing && (
                <button className="row-actions" onClick={() => startEditName(cheese)} style={{ background: "none", border: "none", padding: 2, color: "#b0a48c" }} title="Modifier le nom"><Pencil size={13} /></button>
              )}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 5 }}>
              {cheese.notes.map((n) => (
                <span key={n.id} className="note-chip" style={{ display: "inline-flex", alignItems: "center", gap: 4, background: accent + "1A", color: accent, borderRadius: 999, padding: "2px 4px 2px 9px", fontSize: 12.5, fontWeight: 600 }}>
                  {fmt(n.value)}/10
                  <button onClick={() => removeNote(cheese.id, n.id)} style={{ background: "none", border: "none", padding: 2, color: accent, display: "flex" }} title="Enlever cette note"><X size={11} /></button>
                </span>
              ))}
              {isDraftingNote ? (
                <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                  <input autoFocus value={noteDraftValue} onChange={(e) => setNoteDraftValue(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveAddNote(cheese.id)} placeholder="/10" style={{ ...inputStyle, width: 50, padding: "2px 6px", fontSize: 12.5 }} />
                  <button onClick={() => saveAddNote(cheese.id)} style={{ background: "none", border: "none", color: accent, padding: 2 }}><Check size={14} /></button>
                  <button onClick={() => setNoteDraftFor(null)} style={{ background: "none", border: "none", color: "#b0a48c", padding: 2 }}><X size={14} /></button>
                </span>
              ) : (
                <button onClick={() => startAddNote(cheese.id)} style={{ display: "inline-flex", alignItems: "center", gap: 2, background: "none", border: "1px dashed #d8cdb6", borderRadius: 999, padding: "2px 8px", fontSize: 12, color: "#8a7a63" }}><Plus size={11} /> note</button>
              )}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
            <span className="fr-display" style={{ fontSize: 17, fontWeight: 600, color: accent, minWidth: 30, textAlign: "right" }}>{fmt(a)}</span>
            <button className="row-actions" onClick={() => deleteCheese(cheese.id)} style={{ background: "none", border: "none", padding: 2, color: "#c9b8a0" }} title="Supprimer ce fromage"><Trash2 size={13} /></button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FromageTracker />);
  </script>
</body>
</html>
