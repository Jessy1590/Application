<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau des Vaccins - France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Arial:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-color: #ffffff;
    --text-color: #333333;
    --header-bg: #5a5c5f;
    --cell-light-bg: #e6f0f9;
    --commercial-name-color: #009688; /* Teal / Cyan for vaccine names */
  }
  
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font-family: 'Roboto', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); }
  
  .container { max-width: 1400px; margin: 0 auto; }
  
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
  header h1 { font-size: 28px; color: #333; margin: 0 0 5px 0; font-weight: 700; }
  .update-date { font-size: 13px; color: #666; font-style: italic; }
  
  .header-actions { display: flex; gap: 10px; }
  .btn {
    padding: 8px 16px; border-radius: 4px; border: none; background: #5a5c5f; color: white;
    font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.2s ease;
  }
  .btn:hover { background: #333; }
  .btn.admin-btn { background: #e67e22; }
  
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .search-box input { width: 350px; padding: 10px 15px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; outline: none; }
  
  /* TABLE DESIGN (Like the image) */
  .table-wrapper { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 3px; text-align: left; }
  
  th { background: var(--header-bg); color: white; padding: 12px 15px; font-weight: 700; font-size: 14px; }
  
  tbody tr { cursor: pointer; transition: transform 0.1s; }
  tbody tr:hover { transform: scale(1.005); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  
  td { padding: 12px 15px; font-size: 14px; vertical-align: middle; }
  
  /* Colonne 1: Valences / Pathologies */
  .col-patho {
    font-weight: 700; color: white; width: 28%;
    border-top-left-radius: 4px; border-bottom-left-radius: 4px;
  }
  
  /* Colonne 2: Noms commerciaux */
  .col-vaccin { 
    background: var(--cell-light-bg); width: 30%; font-weight: 700; 
    color: var(--commercial-name-color);
  }
  
  /* Colonne 3: Calendrier (Optionnelle sur l'image, mais demandée) */
  .col-cal { 
    background: var(--cell-light-bg); width: 42%; color: #444; line-height: 1.4;
    border-top-right-radius: 4px; border-bottom-right-radius: 4px;
  }

  /* Modale */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.2s ease;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal-content {
    background: #fff; width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto; border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 30px; position: relative;
  }
  .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer; color: #777; }
  
  .modal-header h2 { margin: 0 0 5px 0; color: var(--commercial-name-color); font-size: 24px; }
  .modal-header .patho-tag { display: inline-block; padding: 4px 10px; color: white; font-weight: bold; border-radius: 4px; font-size: 12px; margin-bottom: 20px; }
  
  .modal-section { margin-bottom: 20px; }
  .modal-section h3 { font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 5px; color: #333; margin-bottom: 10px; }
  .modal-section p { font-size: 14px; line-height: 1.6; color: #444; margin: 0; }
  
  .admin-panel { display: none; background: #fdf5e6; border: 1px solid #f39c12; border-radius: 8px; padding: 20px; margin-top: 30px; }
  .admin-panel.active { display: block; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field input, .field textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
  
  .hidden { display: none !important; }
  
  @media print {
    body { background: white !important; }
    .no-print { display: none !important; }
    table { border-spacing: 0; border-collapse: collapse; }
    td, th { border: 1px solid #ddd; padding: 8px; }
    .col-patho { color: black !important; background: #f0f0f0 !important; }
    @page { margin: 1cm; size: A4 landscape; }
  }
</style>
<style> body { display: none; } </style>

<script>
  const CONFIG_SITE_ID = "REMPLACEZ_PAR_L_ID_DU_SITE_BANQUE"; // L'ID UUID Supabase du site
  const CONFIG_PORTAIL_URL = "../index.html"; // Renvoie vers le portail à la racine

<!-- 3. Charger Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 4. Charger le script central situé à la racine du GitHub -->
<script src="../protect.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Tableau des Vaccins & Valences</h1>
        <div class="update-date" id="lastUpdated">Recherche des données...</div>
      </div>
      <div class="header-actions no-print">
        <button class="btn admin-btn hidden" id="toggleAdminBtn">Administration</button>
        <button class="btn" onclick="window.print()">Imprimer PDF</button>
      </div>
    </header>

    <div class="toolbar no-print">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher par pathologie ou nom commercial..." onkeyup="filterTable()">
      </div>
    </div>

    <div class="table-wrapper">
      <table id="vaccineTable">
        <thead>
          <tr>
            <th>Valences vaccinales / Pathologies</th>
            <th>Noms commerciaux des vaccins</th>
            <th>Calendrier standard & Cibles</th>
          </tr>
        </thead>
        <tbody id="vaccineTbody">
          <tr><td colspan="3" style="text-align:center; padding: 40px; color:#888;">Chargement de la base de données...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel no-print" id="adminPanel">
      <h3 style="margin-top:0; color:#d35400;">Gérer les vaccins</h3>
      <form id="addForm">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="field"><label>Pathologies</label><input type="text" id="f_pathologie" required></div>
          <div class="field"><label>Noms commerciaux</label><input type="text" id="f_vaccins" required></div>
        </div>
        <div class="field" style="margin-bottom: 15px;"><label>Calendrier (Affiché dans tableau)</label><input type="text" id="f_calendrier"></div>
        <div class="field" style="margin-bottom: 15px;"><label>Détails Complets</label><textarea id="f_details" rows="3"></textarea></div>
        <div class="field" style="margin-bottom: 15px;"><label>Rattrapage / Cas particuliers</label><textarea id="f_rattrapage" rows="3"></textarea></div>
        <button type="submit" class="btn admin-btn" id="saveBtn">Enregistrer</button>
        <button type="button" class="btn hidden" id="cancelEditBtn" onclick="resetForm()">Annuler</button>
      </form>
      <div style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 15px;">
        <label class="btn" style="cursor: pointer; display: inline-block;">
          Importer JSON <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
        </label>
        <button class="btn" id="exportBtn">Exporter JSON</button>
        <span id="adminMsg" style="margin-left: 15px; font-weight: bold;"></span>
      </div>
    </div>
  </div>

  <!-- Modal Détails -->
  <div class="modal-overlay" id="vaccinModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-header">
        <h2 id="modalNom">Noms commerciaux</h2>
        <span class="patho-tag" id="modalPathologieTag">Pathologie</span>
      </div>
      <div class="modal-section">
        <h3>Calendrier & Utilisation</h3>
        <div id="modalDetails"></div>
      </div>
      <div class="modal-section">
        <h3>Rattrapage & Cas particuliers</h3>
        <div id="modalRattrapage"></div>
      </div>
    </div>
  </div>

<script>
  // Configuration Supabase
  const SUPABASE_URL = 'https://kpjflntnotftpzffjbud.supabase.co/';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwamZsbnRub3RmdHB6ZmZqYnVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODg0MjMsImV4cCI6MjEwMTg2NDQyM30.mTjm86Thn6VUOAAJRWCsGMcR0Ip-qEP08fJdwUvKKEo';

  const sbAuth = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'portail' } });
  const sbVaccin = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'autres' } });
  const TABLE_NAME = 'vaccins';
  
  let currentData = [];
  let isAdmin = false;

  const el = id => document.getElementById(id);

  // Fonction pour attribuer les couleurs selon le nom du vaccin/pathologie (comme sur l'image)
  function getColorForPathology(patho) {
    const p = patho.toLowerCase();
    if (p.includes('bcg') || p.includes('tuberculose')) return '#8E44AD'; // Violet
    if (p.includes('diphtérie') || p.includes('tétanos') || p.includes('coqueluche') || p.includes('haemophilus') || p.includes('poliomyélite')) return '#16A085'; // Vert eau (Teal)
    if (p.includes('hépatite')) return '#F39C12'; // Jaune orangé
    if (p.includes('méningocoque') || p.includes('rougeole') || p.includes('pneumocoque')) return '#E83A5D'; // Rose vif / Magenta
    if (p.includes('papillomavirus') || p.includes('hpv')) return '#E67E22'; // Orange
    if (p.includes('grippe') || p.includes('leptospirose')) return '#3498DB'; // Bleu clair
    if (p.includes('rage')) return '#F1C40F'; // Jaune vif
    if (p.includes('varicelle') || p.includes('zona')) return '#A0522D'; // Marron clair / Vert kaki
    if (p.includes('choléra') || p.includes('typhoïde') || p.includes('tique') || p.includes('fièvre jaune') || p.includes('dengue')) return '#2980B9'; // Bleu foncé
    if (p.includes('rotavirus') || p.includes('vrs') || p.includes('covid') || p.includes('mpox')) return '#607D8B'; // Gris-bleu (nouveaux vaccins)
    return '#7F8C8D'; // Gris par défaut
  }

  async function init() {
    const { data: { session } } = await sbAuth.auth.getSession();
    if (session) {
      const { data: profile } = await sbAuth.from('profiles').select('role').eq('id', session.user.id).single();
      if (profile && profile.role === 'admin') {
        isAdmin = true;
        el('toggleAdminBtn').classList.remove('hidden');
      }
    }
    await loadData();
  }

  async function loadData() {
    const { data, error } = await sbVaccin.from(TABLE_NAME).select('*').order('pathologie');
    if (error) {
      el('vaccineTbody').innerHTML = '<tr><td colspan="3" style="text-align:center;">Erreur: ' + error.message + '</td></tr>';
      return;
    }
    currentData = data || [];
    renderTable(currentData);
    
    // MAJ de la date
    if(currentData.length > 0) {
      const dates = currentData.map(v => new Date(v.created_at || Date.now()));
      const maxDate = new Date(Math.max.apply(null, dates));
      el('lastUpdated').textContent = "Dernière mise à jour : " + maxDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    } else {
      el('lastUpdated').textContent = "Aucune donnée";
    }
  }

  function renderTable(dataArray) {
    const tbody = el('vaccineTbody');
    if (dataArray.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Aucun vaccin trouvé.</td></tr>';
      return;
    }

    tbody.innerHTML = dataArray.map(v => {
      const color = getColorForPathology(v.pathologie);
      return `<tr onclick="openModal('${v.id}')">
        <td class="col-patho" style="background-color: ${color};">${escapeHtml(v.pathologie)}</td>
        <td class="col-vaccin">${escapeHtml(v.vaccins)}</td>
        <td class="col-cal">
          ${escapeHtml(v.calendrier || '')}
          ${isAdmin ? `<br><button class="btn admin-btn no-print" style="padding:2px 6px; font-size:10px; margin-top:5px;" onclick="editEntry('${v.id}'); event.stopPropagation();">Éditer</button>` : ''}
        </td>
      </tr>`;
    }).join('');
  }
  
  function filterTable() {
    const query = el('searchInput').value.toLowerCase();
    const filtered = currentData.filter(v => 
      (v.pathologie && v.pathologie.toLowerCase().includes(query)) ||
      (v.vaccins && v.vaccins.toLowerCase().includes(query)) ||
      (v.calendrier && v.calendrier.toLowerCase().includes(query))
    );
    renderTable(filtered);
  }

  function escapeHtml(unsafe) {
    if(!unsafe) return '';
    return unsafe.toString().split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;').split("'").join('&#039;');
  }
  
  function formatTextToHtml(text) {
    if(!text) return '';
    let newlineChar = String.fromCharCode(10);
    return '<p>' + escapeHtml(text).split(newlineChar).join('<br>') + '</p>';
  }

  function openModal(id) {
    const v = currentData.find(item => item.id == id);
    if (!v) return;
    
    const color = getColorForPathology(v.pathologie);
    
    el('modalPathologieTag').textContent = v.pathologie;
    el('modalPathologieTag').style.backgroundColor = color;
    el('modalNom').textContent = v.vaccins;
    
    el('modalDetails').innerHTML = formatTextToHtml(v.details || 'Aucune information.');
    el('modalRattrapage').innerHTML = formatTextToHtml(v.rattrapage || 'Non spécifié.');
    
    el('vaccinModal').classList.add('active');
  }

  function closeModal() { el('vaccinModal').classList.remove('active'); }

  el('toggleAdminBtn').addEventListener('click', () => { el('adminPanel').classList.toggle('active'); });

  el('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = el('editId').value;
    const payload = {
      pathologie: el('f_pathologie').value,
      vaccins: el('f_vaccins').value,
      calendrier: el('f_calendrier').value,
      details: el('f_details').value,
      rattrapage: el('f_rattrapage').value
    };

    el('saveBtn').textContent = '...';
    const res = id ? await sbVaccin.from(TABLE_NAME).update(payload).eq('id', id) : await sbVaccin.from(TABLE_NAME).insert([payload]);
    el('saveBtn').textContent = 'Enregistrer';

    if (res.error) showMessage(res.error.message, true);
    else { showMessage('Enregistré !'); resetForm(); await loadData(); }
  });

  function editEntry(id) {
    const v = currentData.find(item => item.id == id);
    if (!v) return;
    el('adminPanel').classList.add('active');
    el('editId').value = v.id;
    el('f_pathologie').value = v.pathologie || '';
    el('f_vaccins').value = v.vaccins || '';
    el('f_calendrier').value = v.calendrier || '';
    el('f_details').value = v.details || '';
    el('f_rattrapage').value = v.rattrapage || '';
    el('cancelEditBtn').classList.remove('hidden');
    el('adminPanel').scrollIntoView({behavior: "smooth"});
  }

  function resetForm() { el('addForm').reset(); el('editId').value = ''; el('cancelEditBtn').classList.add('hidden'); }

  el('exportBtn').addEventListener('click', () => {
    if (currentData.length === 0) return;
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
    const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "vaccins.json"); dl.click();
  });

  async function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        const { error } = await sbVaccin.from(TABLE_NAME).insert(imported);
        if (error) throw error;
        showMessage("Importé !"); event.target.value = ''; await loadData();
      } catch (err) { showMessage("Erreur: " + err.message, true); }
    };
    reader.readAsText(file);
  }

  function showMessage(msg, isError = false) {
    const m = el('adminMsg'); m.textContent = msg; m.style.color = isError ? 'red' : 'green';
    setTimeout(() => m.textContent = '', 4000);
  }

  init();
</script>
</body>
</html>
