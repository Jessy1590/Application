   DESIGN — sobre, dense, pensé pour un usage pro
   ============================================================ */
:root{

*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;}
h1,h2,h3,h4{font-family: Georgia, "Times New Roman", serif; font-weight:600; margin:0 0 .5em;}
h1{font-size:22px;} h2{font-size:18px;} h3{font-size:15px; color:var(--accent-dark);} h4{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
a{color:var(--accent-dark);}
button{font:inherit; cursor:pointer;}
input,select{font:inherit;}
.hidden{display:none !important;}

/* --- layout --- */
#topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background:var(--ink); color:#fff;}
#topbar .brand{font-family:Georgia,serif; font-size:17px; letter-spacing:.02em;}
#topbar .brand small{opacity:.6; font-family:inherit; font-size:11px; margin-left:8px;}
#topbar .who{font-size:12px; opacity:.85; display:flex; gap:12px; align-items:center;}
#topbar button{background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; padding:5px 10px; border-radius:var(--radius); font-size:12px;}
#topbar button:hover{background:rgba(255,255,255,.12);}

#shell{max-width:1180px; margin:0 auto; padding:20px;}

.card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; margin-bottom:16px;}
.card + .card{margin-top:16px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.grow{flex:1; min-width:200px;}

/* --- auth --- */
#auth-view{max-width:380px; margin:80px auto;}
#auth-view .card{padding:28px;}
#auth-view input{width:100%; padding:9px 10px; margin-bottom:10px; border:1px solid var(--line); border-radius:var(--radius);}
#auth-view button.primary{width:100%;}
#auth-error{color:var(--danger); font-size:12.5px; margin-bottom:8px; min-height:1em;}
.switch-mode{font-size:12.5px; text-align:center; margin-top:10px; color:var(--muted);}
.switch-mode a{cursor:pointer;}

button.primary{background:var(--accent); border:1px solid var(--accent-dark); color:#fff; padding:9px 16px; border-radius:var(--radius); font-weight:600;}
button.primary:hover{background:var(--accent-dark);}
button.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); padding:8px 14px; border-radius:var(--radius);}
button.ghost:hover{border-color:var(--accent);}
button.small{padding:4px 9px; font-size:12px; border-radius:4px;}
button.danger{color:var(--danger); border-color:var(--danger);}

/* --- project list --- */
.proj-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.proj-tile{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:14px; cursor:pointer; transition:.15s;}
.proj-tile:hover{border-color:var(--accent); box-shadow:0 2px 10px rgba(0,0,0,.05);}
.proj-tile h3{margin:0 0 4px;}
.proj-tile .meta{font-size:12px; color:var(--muted);}
.new-tile{border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:24px; min-height:80px;}
.new-tile:hover{border-color:var(--accent); color:var(--accent);}

/* --- tabs --- */
#proj-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
#proj-header a.back{font-size:12.5px; color:var(--muted); text-decoration:none;}
#tabs{display:flex; gap:2px; border-bottom:2px solid var(--line); margin-bottom:18px; flex-wrap:wrap;}
#tabs button{background:none; border:none; padding:9px 16px; font-size:13.5px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-2px;}
#tabs button.active{color:var(--accent-dark); border-bottom-color:var(--accent-dark); font-weight:600;}
#tabs button:hover{color:var(--accent-dark);}

/* --- form fields --- */
.legend{display:flex; gap:18px; font-size:11.5px; color:var(--muted); margin-bottom:14px; flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:11px; height:11px; border-radius:2px; display:inline-block; border:1px solid rgba(0,0,0,.15);}
.leg-input i{background:var(--warn-bg);}
.leg-edit i{background:var(--edit-bg);}
.leg-lock i{background:var(--lock-bg);}

.field-grid{display:grid; grid-template-columns:1fr 130px; gap:8px 12px; align-items:center;}
.field-grid.wide{grid-template-columns:1fr 130px 90px;}
.field-label{font-size:13px;}
.f-input, .f-edit, .f-lock{padding:6px 8px; border-radius:4px; border:1px solid var(--line); width:100%; text-align:right;}
.f-input{background:var(--warn-bg); border-color:var(--warn-line);}
.f-edit{background:var(--edit-bg); border-color:var(--edit-line);}
.f-lock{background:var(--lock-bg); color:var(--muted); border-color:var(--line); text-align:right;}
.na-toggle{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:3px; white-space:nowrap;}
.section-title{margin-top:22px; margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid var(--line);}
.section-title:first-child{margin-top:0;}

table.calc{width:100%; border-collapse:collapse; font-size:13px;}
table.calc th{text-align:right; font-weight:600; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:6px 8px; border-bottom:1px solid var(--line);}
table.calc th:first-child{text-align:left;}
table.calc td{padding:5px 8px; border-bottom:1px solid #f0efe9; text-align:right; white-space:nowrap;}
table.calc td:first-child{text-align:left; white-space:normal;}
table.calc tr.total td{font-weight:700; border-top:1px solid var(--ink); border-bottom:2px solid var(--ink);}
table.calc tr.sub td{color:var(--muted);}
table.calc td.pos{color:var(--accent-dark);}
table.calc td.neg{color:var(--danger);}
.scrollx{overflow-x:auto;}

.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
.kpi{border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:#fcfbf8; position:relative;}
.kpi .v{font-size:20px; font-weight:700; font-family:Georgia,serif;}
.kpi .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; display:flex; justify-content:space-between; align-items:center;}
.kpi.good .v{color:var(--accent-dark);} .kpi.bad .v{color:var(--danger);}
.info-icon{cursor:help; background:#e2ded4; color:#726f66; width:16px; height:16px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; font-family:sans-serif;}

.bench-bar{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12.5px;}
.bench-bar .lbl{width:190px; flex-shrink:0;}
.bench-bar .track{flex:1; height:14px; background:#eee; border-radius:3px; position:relative;}
.bench-bar .fillme{height:100%; background:var(--accent); border-radius:3px;}
.bench-bar .marker{position:absolute; top:-3px; width:2px; height:20px; background:var(--ink);}
.bench-bar .val{width:100px; text-align:right; flex-shrink:0; color:var(--muted);}

/* --- modal --- */
.modal-bg{position:fixed; inset:0; background:rgba(20,20,15,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50;}
.modal{background:#fff; border-radius:10px; max-width:760px; width:100%; padding:24px; position:relative;}
.modal h2{margin-bottom:4px;}
.modal .step{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;}
textarea.promptbox{width:100%; min-height:160px; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; border:1px solid var(--line); border-radius:6px; padding:10px; background:#faf9f5;}
textarea.jsonbox{width:100%; min-height:120px; font-family:ui-monospace,Menlo,monospace; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:10px;}

.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
.close-x{position:absolute; top:16px; right:20px; background:none; border:none; font-size:20px; color:var(--muted);}

.toast{position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:6px; font-size:13px; z-index:100; opacity:0; transition:.25s;}
.toast.show{opacity:1;}

.note{font-size:12px; color:var(--muted); background:#f3f2ec; border-left:3px solid var(--line); padding:8px 10px; border-radius:4px; margin:10px 0;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media(max-width:800px){.two-col{grid-template-columns:1fr;}}

label.chk{display:flex; align-items:center; gap:6px; font-size:12.5px;}
select.f-edit{text-align:left;}
input[type=text].f-input, input[type=text].f-edit{text-align:left;}
</style>

function toast(msg){

}
function fmtEUR(n){ if(n===undefined||n===null||isNaN(n)) return "—"; return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}); }
function fmtPct(n,d=1){ if(n===undefined||n===null||isNaN(n)) return "—"; return n.toLocaleString('fr-FR',{maximumFractionDigits:d})+" %"; }
function fmtNum(n,d=1){ if(n===undefined||n===null||isNaN(n)) return "—"; return n.toLocaleString('fr-FR',{maximumFractionDigits:d}); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

// Fonction pour copier dans le presse-papier sans utiliser navigator.clipboard (pour la sécurité iFrame)
function copyToClipboard(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.left = "-999999px";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try { 
    document.execCommand('copy'); 
    toast("Liste copiée dans le presse-papier !"); 
  } catch (err) { 
    toast("Erreur lors de la copie."); 
  }
  document.body.removeChild(textArea);
}

});

function renderAuthMode(){
  document.getElementById('auth-title').textContent = authMode === "login" ? "Connexion" : "Créer un compte";

document.getElementById('auth-submit').addEventListener('click', async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errBox = document.getElementById('auth-error');
  errBox.textContent = "";
  if(!email || !password){ errBox.textContent = "Renseignez email et mot de passe."; return; }
  let res;
  if(authMode === "login"){ res = await sb.auth.signInWithPassword({ email, password }); } 
  else { res = await sb.auth.signUp({ email, password }); }
  if(res.error){ errBox.textContent = res.error.message; return; }
  if(authMode === "signup" && !res.data.session){
    errBox.textContent = "Compte créé. Vérifiez votre email pour confirmer, puis connectez-vous.";
    return;
  }
  await onAuthed(res.data.session);
});

  STATE = { session:null, user:null, projects:[], current:null, activeTab:"infos", importMappings:{} };

async function onAuthed(session){
  STATE.session = session; STATE.user = session.user;
  document.getElementById('who-box').classList.remove('hidden');
  document.getElementById('who-email').textContent = session.user.email;
  await loadMappings();

  showView('projects');
}

function showView(name){
  document.getElementById('auth-view').classList.toggle('hidden', name!=='auth');
  document.getElementById('projects-view').classList.toggle('hidden', name!=='projects');
  document.getElementById('workspace-view').classList.toggle('hidden', name!=='workspace');

async function loadProjects(){
  const { data, error } = await sb.from('projects').select('*').order('created_at', { ascending:false });
  if(error){ toast("Erreur chargement projets: "+error.message); return; }
  STATE.projects = data || [];
  renderProjectList();
}

function renderProjectList(){
  const el = document.getElementById('proj-list');
  el.innerHTML = "";
  STATE.projects.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'proj-tile';
    d.innerHTML = `<h3>${escapeHtml(p.nom)}</h3><div class="meta">${escapeHtml((p.infos&&p.infos.ville)||'')}</div><div class="meta">Créé le ${new Date(p.created_at).toLocaleDateString('fr-FR')}</div>`;
    d.addEventListener('click', ()=>openProject(p.id));
    el.appendChild(d);
  });
  const add = document.createElement('div');
  add.className = 'proj-tile new-tile';
  add.textContent = '+ Nouveau dossier';
  add.addEventListener('click', createProject);
  el.appendChild(add);
}

async function createProject(){
  const nom = prompt("Nom du dossier (ex: Pharmacie du Centre — Sotteville) :");
  if(!nom) return;
  const { data, error } = await sb.from('projects').insert({ owner: STATE.user.id, nom }).select().single();
  if(error){ toast("Erreur: "+error.message); return; }
  // Insertion avec des paramètres complètement vierges
  const { error:pe } = await sb.from('parametres').insert({ project_id: data.id, params: EMPTY_PARAMS });
  if(pe){ toast("Erreur paramètres: "+pe.message); }
  await loadProjects();
  openProject(data.id);
}

document.getElementById('btn-back-list').addEventListener('click', async ()=>{ await loadProjects(); showView('projects'); });

document.getElementById('btn-del-project').addEventListener('click', async ()=>{
  if(!STATE.current) return;
  if(!confirm(`Supprimer définitivement le dossier "${STATE.current.project.nom}" et toutes ses données ?`)) return;
  const { error } = await sb.from('projects').delete().eq('id', STATE.current.project.id);
  if(error){ toast("Erreur: "+error.message); return; }
  await loadProjects(); showView('projects');
});

async function openProject(id){
  const project = STATE.projects.find(p=>p.id===id) || (await sb.from('projects').select('*').eq('id',id).single()).data;
  const { data: paramRow } = await sb.from('parametres').select('*').eq('project_id', id).single();
  const { data: bilanRows } = await sb.from('bilans').select('*').eq('project_id', id);

  const bilans = {0:{},[-1]:{},[-2]:{}};
  const unavailableBilan = {0:[],[-1]:[],[-2]:[]};
  (bilanRows||[]).forEach(r=>{ bilans[r.annee_offset] = r.data||{}; unavailableBilan[r.annee_offset] = r.unavailable||[]; });

  STATE.current = {
    project,
    params: (paramRow && paramRow.params) || {...EMPTY_PARAMS},
    bilans, unavailableBilan,
  };
  STATE.activeTab = "infos";
  document.getElementById('ws-title').textContent = project.nom;
  showView('workspace');
  renderTabs();
}

function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===STATE.activeTab));
  const c = document.getElementById('tab-content');
  if(STATE.activeTab==='infos') return renderInfosTab(c);
  if(STATE.activeTab==='parametres') return renderParametresTab(c);
  if(STATE.activeTab==='bilans') return renderBilansTab(c);
  if(STATE.activeTab==='evaluation') return renderEvaluationTab(c);
  if(STATE.activeTab==='valorisation') return renderValorisationTab(c);
  if(STATE.activeTab==='previsionnel') return renderPrevisionnelTab(c);
}

function escapeHtml(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderInfosTab(root){
  const infos = STATE.current.project.infos || {};
  const unavail = new Set(STATE.current.project.unavailable || []);
  root.innerHTML = `
    <div class="card">
      <h2>Informations générales du projet</h2>
      <p class="note">Renseignez ce que vous savez. Cochez "non disponible" pour les informations que vous n'avez pas encore.</p>
      <div class="field-grid wide" id="infos-grid"></div>
      <div class="modal-actions"><button class="primary" id="save-infos">Enregistrer</button></div>
    </div>`;
  const grid = document.getElementById('infos-grid');
  INFO_FIELDS.forEach(([key,label])=>{
    const isNA = unavail.has(key);
    const row = document.createElement('div'); row.style.display='contents';
    row.innerHTML = `
      <div class="field-label">${label}</div>
      <input type="text" class="f-input" data-key="${key}" ${isNA?'disabled':''} value="${escapeHtml(infos[key]||'')}">
      <label class="na-toggle"><input type="checkbox" data-na="${key}" ${isNA?'checked':''}> non disponible</label>`;
    grid.appendChild(row);
  });
  grid.addEventListener('change', (e)=>{
    if(e.target.dataset.na){
      const input = grid.querySelector(`input[data-key="${e.target.dataset.na}"]`);
      input.disabled = e.target.checked;
      if(e.target.checked) input.value = "";
    }
  });
  document.getElementById('save-infos').addEventListener('click', async ()=>{
    const newInfos = {}; const newUnavail = [];
    INFO_FIELDS.forEach(([key])=>{
      const na = grid.querySelector(`input[data-na="${key}"]`).checked;
      if(na) newUnavail.push(key);
      else newInfos[key] = grid.querySelector(`input[data-key="${key}"]`).value;
    });
    const { error } = await sb.from('projects').update({ infos:newInfos, unavailable:newUnavail }).eq('id', STATE.current.project.id);
    if(error) return toast("Erreur: "+error.message);
    STATE.current.project.infos = newInfos; STATE.current.project.unavailable = newUnavail;
    toast("Informations enregistrées.");
  });
}

      } else if(key==="besoin_bfr_select"){
        row.innerHTML = `<div class="field-label">${label}</div><select class="f-edit" data-pkey="besoin_bfr"><option value="true" ${p.besoin_bfr?'selected':''}>Oui</option><option value="false" ${!p.besoin_bfr?'selected':''}>Non</option></select>`;
      } else if(key==="financement_travaux_mode_select"){
        const opts = ["Apports","Prêt"];
        row.innerHTML = `<div class="field-label">${label}</div><select class="f-edit" data-pkey="financement_travaux_mode">${opts.map(o=>`<option ${p.financement_travaux_mode===o?'selected':''}>${o}</option>`).join('')}</select>`;
      } else {
        row.innerHTML = `<div class="field-label">${label}</div><input type="number" step="any" class="f-edit" data-pkey="${key}" value="${val}">`;
      }
      grid.appendChild(row);
    });
  });

  document.getElementById('save-params').addEventListener('click', async ()=>{
    const newParams = {...p};
    groupsEl.querySelectorAll('[data-pkey]').forEach(inp=>{
      const k = inp.dataset.pkey; let v = inp.value;
      if(inp.tagName==='SELECT' && (v==='true'||v==='false')) v = v==='true';
      else if(inp.tagName==='INPUT') v = v === '' ? null : parseFloat(v);
      newParams[k] = v;
    });
    const { error } = await sb.from('parametres').update({ params:newParams }).eq('project_id', STATE.current.project.id);
    if(error) return toast("Erreur: "+error.message);
    STATE.current.params = newParams;
    toast("Paramètres enregistrés.");
  });

  document.getElementById('btn-import-ia').addEventListener('click', openImportModal);

  // Filtre
  const filterChk = document.getElementById('filter-empty-params');
  const applyParamsFilter = () => {
    const isChecked = filterChk.checked;
    groupsEl.querySelectorAll('.section-title').forEach(title => {
      const grid = title.nextElementSibling;
      let hasVisible = false;
      Array.from(grid.children).forEach(row => {
        const inp = row.querySelector('[data-pkey]');
        if(!inp) return;
        const isEmpty = (inp.value === "" || inp.value === null);
        if (isChecked && !isEmpty) {
          row.style.display = 'none';
        } else {
          row.style.display = 'contents';
          hasVisible = true;
        }
      });
      title.style.display = (isChecked && !hasVisible) ? 'none' : 'block';
      grid.style.display = (isChecked && !hasVisible) ? 'none' : 'grid';
    });
  };
  filterChk.addEventListener('change', applyParamsFilter);

  // Copie
  document.getElementById('btn-copy-missing-params').addEventListener('click', () => {
    let missing = [];
    groupsEl.querySelectorAll('.section-title').forEach(title => {
      const grid = title.nextElementSibling;
      Array.from(grid.children).forEach(row => {
        const inp = row.querySelector('[data-pkey]');
        if(inp && (inp.value === "" || inp.value === null)) {
          let label = row.querySelector('.field-label').textContent.trim();
          missing.push("- " + label);
        }
      });
    });
    if(missing.length === 0) {
      toast("Tous les paramètres sont renseignés !"); return;
    }
    const text = "Voici les paramètres manquants pour l'évaluation :\n" + missing.join("\n");
    copyToClipboard(text);
  });
}

  });

  document.getElementById('filter-empty-bilans').addEventListener('change', (e)=>{
      showOnlyEmptyBilans = e.target.checked;
      applyBilansFilter();
  });

  document.getElementById('btn-copy-missing-bilans').addEventListener('click', ()=>{
      let missing = [];
      const form = document.getElementById('bilan-form');
      form.querySelectorAll('.section-title').forEach(title => {
          const grid = title.nextElementSibling;
          Array.from(grid.children).forEach(row => {
              const inp = row.querySelector('input[data-key]');
              const naCb = row.querySelector('input[data-na]');
              if(inp) {
                  const isEmpty = (inp.value === "" || inp.value === null);
                  const isNa = naCb ? naCb.checked : false;
                  // Si c'est vide et pas coché N/A, on ajoute à la liste
                  if(isEmpty && !isNa) {
                      const labelNode = row.querySelector('.field-label');
                      const label = labelNode.childNodes[0].textContent.trim();
                      missing.push("- " + label);
                  }
              }
          });
      });

         toast("Tout est rempli pour cette année !"); return;

      const text = `Voici les données bilans manquantes pour l'${yearLabel(bilansActiveYear).toLowerCase()} :\n` + missing.join('\n');

  renderBilanYear();

    root.querySelectorAll('.yr-btn').forEach(b=>b.classList.toggle('primary', parseInt(b.dataset.y)===bilansActiveYear));

          row.innerHTML = `

            <input type="number" step="any" class="${f.editable?'f-edit':'f-input'}" data-key="${f.key}" ${na?'disabled':''} value="${data[f.key]??''}">
            <label class="na-toggle"><input type="checkbox" data-na="${f.key}" ${na?'checked':''}> N/A</label>`;
        }
        grid.appendChild(row);
      });
    });
    form.addEventListener('change', (e)=>{
      if(e.target.dataset.na){
        const input = form.querySelector(`input[data-key="${e.target.dataset.na}"]`);
        input.disabled = e.target.checked;
      }
    });
    applyBilansFilter(); // Appliquer le filtre si actif
  }

  document.getElementById('save-bilan').addEventListener('click', async ()=>{
    const form = document.getElementById('bilan-form');
    const data = {}; const unavail = [];
    form.querySelectorAll('input[data-key]').forEach(inp=>{
      if(inp.disabled) return;
      const v = inp.value; if(v!=='') data[inp.dataset.key] = parseFloat(v);
    });
    form.querySelectorAll('input[data-na]').forEach(inp=>{ if(inp.checked) unavail.push(inp.dataset.na); });
    const { error } = await sb.from('bilans').upsert({
      project_id: STATE.current.project.id, annee_offset: bilansActiveYear,
      data, unavailable: unavail, annee_label: yearLabel(bilansActiveYear),
    }, { onConflict: 'project_id,annee_offset' });
    if(error) return toast("Erreur: "+error.message);
    STATE.current.bilans[bilansActiveYear] = data;
    STATE.current.unavailableBilan[bilansActiveYear] = unavail;
    toast(`Bilan ${yearLabel(bilansActiveYear)} enregistré.`);
  });
}

function applyBilansFilter() {
    const form = document.getElementById('bilan-form');
    form.querySelectorAll('.section-title').forEach(title => {
        const grid = title.nextElementSibling;
        let hasVisible = false;
        Array.from(grid.children).forEach(row => {
            const inp = row.querySelector('input[data-key]');
            const naCb = row.querySelector('input[data-na]');
            if(!inp) return;
            const isEmpty = (inp.value === "" || inp.value === null);
            const isNa = naCb ? naCb.checked : false;
            const isMissing = isEmpty && !isNa;

            if (showOnlyEmptyBilans && !isMissing) {
                row.style.display = 'none';
            } else {
                row.style.display = 'contents';
                hasVisible = true;
            }
        });
        title.style.display = (showOnlyEmptyBilans && !hasVisible) ? 'none' : 'block';
        grid.style.display = (showOnlyEmptyBilans && !hasVisible) ? 'none' : 'grid';
    });
}

function yearLabel(y){ return y===0 ? "Année N" : y===-1 ? "Année N-1" : "Année N-2"; }

function sumGroupHT(data, keys){
  let ht=0, tva=0;
  keys.forEach(k=>{
    const v = num(data[k]);
    const rate = data[k+'_tva'] !== undefined ? num(data[k+'_tva']) : (allFieldDefs().find(f=>f.key===k)||{}).tva || 0;
    ht += v; tva += v*rate;
  });
  return { ht, tva, ttc: ht+tva };
}

function computeBilanAggregate(data){
  const ventes = sumGroupHT(data, VENTES_KEYS);
  const presta = sumGroupHT(data, PRESTA_KEYS);
  const achats = sumGroupHT(data, ACHATS_KEYS);
  const caTotalHT = ventes.ht + presta.ht;
  const caTotalTTC = ventes.ttc + presta.ttc;
  const remisesTotal = num(data.remise_commerciale)+num(data.rfa)+num(data.escompte);
  const achatsTotalRemise = achats.ht - remisesTotal;
  const variationStock = num(data.stock_initial) - num(data.stock_final);
  const achatsConsoHT = achatsTotalRemise + variationStock;
  const chargesExternes = CHARGES_EXT_KEYS.reduce((s,k)=>s+num(data[k]),0);
  return { ventes, presta, achats, caTotalHT, caTotalTTC, achatsTotalRemise, variationStock, achatsConsoHT, chargesExternes };
}

function computeEvaluation(dataN, dataN1){
  const N = computeBilanAggregate(dataN);
  const N1 = computeBilanAggregate(dataN1);

  // Formules STRICTEMENT conformes au fichier Excel de l'utilisateur
  const ratioClients = N.caTotalTTC ? (num(dataN.creances_clients_ttc)*360)/N.caTotalTTC : null;
  const ratioFournisseurs = N.achats.ht ? (num(dataN.dettes_fournisseurs)*360)/N.achats.ht : null; 
  const ratioTresorerie = N.achats.ht ? ((num(dataN.compte_grossiste)+num(dataN.disponibilite))*360)/N.achats.ht : null;
  const ratioStock = N.achatsConsoHT ? (num(dataN.stock_final)*360)/N.achatsConsoHT : null;

  const evolutionCA = N1.caTotalHT ? (N.caTotalHT - N1.caTotalHT)/N1.caTotalHT*100 : null;
  const ratioChargesExterne = N.caTotalHT ? (N.chargesExternes*100)/N.caTotalHT : null;
  const margeBruteSans0 = (N.caTotalHT - num(dataN.ventes_0)) - (N.achatsConsoHT - num(dataN.achats_0));
  
  // Correction de la formule : division par le CA Total HT (cellule B37) pour les charges de personnel et la marge
  const margeBruteCommerciale = N.caTotalHT - N.achatsConsoHT; // B36
  const tauxMarge = N.caTotalHT ? margeBruteCommerciale*100/N.caTotalHT : null; // B38 = B36 * 100 / B37
  const ratioChargesPersonnel = N.caTotalHT ? (num(dataN.salaires_personnel)+num(dataN.charges_personnel))*100/N.caTotalHT : null; // E33 sur la base du CA
  const productionTheoriqueRatio = STATE.current.params.production_theorique ? N.ventes.ttc/STATE.current.params.production_theorique : null;

  // EBE
  const remunerationDirigeant = num(dataN.remuneration_gerance)+num(dataN.charges_gerance);
  const EBE = N.ventes.ht + N.presta.ht - N.achatsConsoHT - N.chargesExternes - num(dataN.impots_taxes_hors_is)
            - (num(dataN.salaires_personnel)+num(dataN.charges_personnel)+num(dataN.remuneration_gerance)+num(dataN.charges_gerance));
  const EBE_retraite = EBE + remunerationDirigeant + num(dataN.activite_exceptionnelle);
  const tauxEBE_CA = N.caTotalHT ? EBE_retraite*100/N.caTotalHT : null;
  const tauxEBE_Marge = margeBruteCommerciale ? EBE_retraite*100/margeBruteCommerciale : null;

  return { N, N1, ratioClients, ratioFournisseurs, ratioTresorerie, ratioStock, evolutionCA, ratioChargesExterne,
    margeBruteSans0, ratioChargesPersonnel, margeBruteCommerciale, tauxMarge, productionTheoriqueRatio,
    EBE, EBE_retraite, tauxEBE_CA, tauxEBE_Marge, remunerationDirigeant };
}

function computeValorisation(dataRef, params){
  const seuil = num(params.marge_valorisation_seuil_k)*1000;
  const margeGlobale = num(dataRef.marge_brute_globale_bilan);
  const auDessus = margeGlobale >= seuil;

  const coefCA = auDessus ? params.coef_ca_sup : params.coef_ca_inf;
  const coefEBE = auDessus ? params.coef_ebe_sup : params.coef_ebe_inf;
  const coefMarge = auDessus ? params.coef_marge_sup : params.coef_marge_inf;

  const trancheChere = num(dataRef.tranche_150_1930)+num(dataRef.tranche_sup_1930);
  const differenceProduitsChers = trancheChere > num(params.produits_150_1930)
    ? (trancheChere - num(params.produits_150_1930)) * num(dataRef.ca_ht_bilan) : 0;

  const valorisationCA = (num(dataRef.ca_ht_bilan) + num(dataRef.retrocessions) + num(dataRef.honoraires_coop)
    - num(dataRef.maison_retraite) - differenceProduitsChers) * coefCA;
  const valorisationEBE = (num(dataRef.ebe_bilan) + num(dataRef.csg_deductible) + num(dataRef.autres_retraitements)
    + num(dataRef.tiers_payant) + num(dataRef.fonds_incorporels) + num(dataRef.fonds_corporels)) * coefEBE;
  const valorisationMarge = (margeGlobale + num(dataRef.vaccination)) * coefMarge;

  const valorisationTheorique = (valorisationCA + valorisationEBE + valorisationMarge)/3;

  const honoraireTransaction = num(params.honoraire_transaction_pct) * valorisationTheorique * 1.2;
  const honoraireComptable = num(params.honoraire_comptable);
  const honoraireJuridique = num(params.honoraire_juridique);
  const fraisAcquisition = num(params.frais_acquisition_pct) * valorisationTheorique;
  const travaux = num(params.travaux);

  const agg = computeBilanAggregate(dataRef);
  const bfrStock = num(params.ratio_stock) * agg.achats.ht / 360;
  const bfrCreances = num(params.ratio_clients) * agg.ventes.ttc / 360;
  const bfrFournisseur = num(params.ratio_fournisseurs) * agg.achats.ttc / 360;
  const bfrTotal = bfrStock + bfrCreances - bfrFournisseur;
  const bfrRetenu = params.besoin_bfr ? bfrTotal : 0;

  const stockFinalLigne = num(dataRef.stock_final);
  const totalBesoinsFinanciers = stockFinalLigne + honoraireTransaction + honoraireComptable + honoraireJuridique
    + fraisAcquisition + travaux + valorisationTheorique + bfrRetenu;

  const aFinancerMinApportsFidele = honoraireTransaction+honoraireComptable+honoraireJuridique+fraisAcquisition+bfrRetenu+num(dataRef.retrocessions);

  const emprunt = num(params.emprunt_banque_montant);
  const aFinancerMinEmpruntsFidele = valorisationTheorique + (params.financement_travaux_mode==="Prêt" ? valorisationEBE : 0);

  const apportsTotal = num(params.apports_capital_personnel)+num(params.apports_cc_personnel)
    +num(params.apports_associe_exec)+num(params.apports_associe_investisseur)+num(params.apports_booster);

  const aFinancerStock = params.stock_financement==="Prêt vendeur 12 fois" ? 0 : params.stock_financement==="Apports directe" ? 0 : stockFinalLigne;
  const aFinancerTravaux = valorisationEBE;

  const resteAFinancer = totalBesoinsFinanciers + aFinancerMinEmpruntsFidele + aFinancerStock
    + (params.financement_travaux_mode==="Apports" ? aFinancerTravaux : 0) - apportsTotal - emprunt;

  const dureeAns = Math.round(num(params.duree_pret_ans));
  const tauxAn = num(params.taux_bancaire);
  const pmt = pmtAnnuite(tauxAn, dureeAns, emprunt);
  const tableauPret = [];
  let reste = emprunt;
  for(let a=1; a<=dureeAns; a++){
    const interets = tauxAn * reste;
    const capital = pmt - interets;
    reste = reste - capital;
    tableauPret.push({ annee:a, annuite:pmt, interets, capital, reste: Math.max(reste,0) });
  }

  const boosterMontant = num(params.apports_booster);
  const boosterTaux = num(params.taux_booster);
  const boosterInteretsAn = boosterMontant * boosterTaux;

  return {
    seuil, auDessus, coefCA, coefEBE, coefMarge, differenceProduitsChers,
    valorisationCA, valorisationEBE, valorisationMarge, valorisationTheorique,
    honoraireTransaction, honoraireComptable, honoraireJuridique, fraisAcquisition, travaux,
    bfrStock, bfrCreances, bfrFournisseur, bfrTotal, bfrRetenu, stockFinalLigne,
    totalBesoinsFinanciers, aFinancerMinApports: aFinancerMinApportsFidele, aFinancerMinEmprunts: aFinancerMinEmpruntsFidele,
    apportsTotal, aFinancerStock, aFinancerTravaux, resteAFinancer,
    emprunt, dureeAns, tauxAn, pmt, tableauPret, boosterMontant, boosterTaux, boosterInteretsAn,
  };
}

function pmtAnnuite(taux, nper, pv){
  if(taux===0) return pv/nper;
  return pv*taux/(1-Math.pow(1+taux,-nper));
}

function calcIS(resultatAnnee, resultatAnneePrecedente, params){
  const base = Math.max(0, resultatAnnee + Math.min(0, resultatAnneePrecedente||0));
  const seuil = num(params.is_seuil_bas);
  const t1 = num(params.is_taux_p1), t2 = num(params.is_taux_p2);
  if(base<=0) return 0;
  if(base<=seuil) return base*t1;
  return seuil*t1 + (base-seuil)*t2;
}

function computePrevisionnel(dataRef, params, valo, chargesExtOverrides, salariesOverrides){
  let totalChargesExtInit = 0;
  CHARGES_EXT_KEYS.forEach(k=>{
    const ov = chargesExtOverrides[k];
    const garde = ov ? ov.garde : true;
    const autreMontant = ov ? ov.autreMontant : undefined;
    let val;
    if(autreMontant !== undefined && autreMontant !== null && autreMontant !== '') val = num(autreMontant);
    else if(garde) val = num(dataRef[k]);
    else val = 0;
    totalChargesExtInit += val;
  });

  const totalSalairesInit = salariesOverrides.reduce((s,row)=> s + (row.garde ? num(row.montant) : 0), 0);

  const agg = computeBilanAggregate(dataRef);
  const caN0 = agg.ventes.ht + agg.presta.ht; 
  const tauxMargeBrute = agg.caTotalHT ? (num(dataRef.marge_brute_globale_bilan)/agg.caTotalHT)*100 : 0; 

  const evolCA = num(params.evolution_ca_estime)/100;
  const evolCharges = num(params.evolution_charges_estime)/100;
  const evolSalaires = num(params.evolution_salaires_estime)/100;

  const dureeAmortTravaux = num(params.duree_amortissement_travaux)||1;
  const dotationAmort = num(params.travaux)/dureeAmortTravaux;
  const droitsFraisInstall = num(params.honoraire_juridique)*0.8 + num(params.honoraire_comptable)
    + num(params.honoraire_transaction_pct)*valo.valorisationTheorique;
  const creditVendeurStock = params.stock_financement==="Prêt vendeur 12 fois" ? num(dataRef.stock_final) : 0; 

  const years = [];
  let CA = caN0, chargesExt = totalChargesExtInit, salaires = totalSalairesInit;
  let remuneration = num(params.remuneration_exploitant_souhaitee);

  let prevResultatCourant = 0;
  for(let a=0; a<=12; a++){
    if(a>0){ CA = CA*(1+evolCA); chargesExt = chargesExt*(1+evolCharges); salaires = salaires*(1+evolSalaires); }
    const margeCommerciale = CA*tauxMargeBrute/100;
    const impotsTaxes = num(dataRef.impots_taxes_hors_is) ? (num(dataRef.impots_taxes_hors_is)) : 0; 
    let ebeRetraite=null, remunerationAn=null, cotisSociales=null, ebeComptable=null, resultatExploit=null,
        chargesFiBooster=null, chargesFiBanque=null, resultatCourant=null, IS=null, resultatNet=null,
        paiementCapital=null, resultatAvantRedistrib=null;
    if(a>=1){
      ebeRetraite = margeCommerciale - chargesExt - impotsTaxes - salaires;
      remunerationAn = remuneration;
      cotisSociales = remunerationAn*num(params.charges_sociales_exploitant)/100;
      ebeComptable = ebeRetraite - remunerationAn - cotisSociales;
      const amort = a===1 ? dotationAmort : dotationAmort;
      const install = a===1 ? droitsFraisInstall : 0;
      const creditVdr = a===1 ? creditVendeurStock : 0;
      resultatExploit = ebeComptable - amort - install - creditVdr;
      chargesFiBooster = valo.boosterInteretsAn;
      const ligne = valo.tableauPret[a-1];
      chargesFiBanque = ligne ? ligne.interets : 0;
      resultatCourant = resultatExploit - chargesFiBooster - chargesFiBanque;
      IS = calcIS(resultatCourant, prevResultatCourant, params);
      resultatNet = resultatCourant - IS;
      paiementCapital = ligne ? ligne.capital : 0;
      resultatAvantRedistrib = resultatNet - paiementCapital;
      prevResultatCourant = resultatCourant;
    }
    years.push({ annee:a, CA, tauxMargeBrute, margeCommerciale, chargesExt, impotsTaxes, salaires,
      ebeRetraite, remunerationAn, cotisSociales, ebeComptable, dotationAmort: a===1?dotationAmort:(a>=1?dotationAmort:null),
      droitsFraisInstall: a===1?droitsFraisInstall:(a>=1?0:null), creditVendeurStock: a===1?creditVendeurStock:(a>=1?0:null),
      resultatExploit, chargesFiBooster, chargesFiBanque, resultatCourant, IS, resultatNet, paiementCapital, resultatAvantRedistrib });
  }
  return { years, totalChargesExtInit, totalSalairesInit, caN0, tauxMargeBrute, dotationAmort, droitsFraisInstall, creditVendeurStock };
}

function benchBar(label, value, ref, min, max){
  const clamp = v => Math.max(min, Math.min(max, v ?? min));
  const pctPos = v => ((clamp(v)-min)/(max-min))*100;
  return `<div class="bench-bar">
    <div class="lbl">${label}</div>
    <div class="track"><div class="fillme" style="width:${pctPos(value)}%"></div><div class="marker" style="left:${pctPos(ref)}%"></div></div>
    <div class="val">${fmtNum(value)} <span style="opacity:.5">/ ${fmtNum(ref)} nat.</span></div>
  </div>`;
}

      ${v.differenceProduitsChers>0 ? `Abattement produits chers appliqué : -${fmtEUR(v.differenceProduitsChers)} sur la base CA.`:''}</p>

    <div class="card">

          <tr><td>À financer minimum (emprunts)</td><td>${fmtEUR(v.aFinancerMinEmprunts)}</td></tr>
          <tr><td>À financer — stock</td><td>${fmtEUR(v.aFinancerStock)}</td></tr>
          <tr><td>À financer — travaux (${params.financement_travaux_mode})</td><td>${fmtEUR(params.financement_travaux_mode==='Apports'?v.aFinancerTravaux:0)}</td></tr>
          <tr class="total ${Math.abs(v.resteAFinancer)<1000?'':''}"><td>Reste à financer</td><td class="${Math.abs(v.resteAFinancer)>1000?'neg':'pos'}">${fmtEUR(v.resteAFinancer)}</td></tr>

    <div class="card">
      <h2>Amortissement du prêt bancaire</h2>
      <p class="note">${fmtEUR(v.emprunt)} sur ${v.dureeAns} ans à ${fmtPct(v.tauxAn*100)} — annuité constante ${fmtEUR(v.pmt)}/an.</p>
      <div class="scrollx"><table class="calc">
        <tr><th>Année</th><th>Annuité</th><th>Intérêts</th><th>Capital remboursé</th><th>Reste dû</th></tr>
        ${v.tableauPret.map(l=>`<tr><td>${l.annee}</td><td>${fmtEUR(l.annuite)}</td><td>${fmtEUR(l.interets)}</td><td>${fmtEUR(l.capital)}</td><td>${fmtEUR(l.reste)}</td></tr>`).join('')}
      </table></div>
    </div>

    <div class="card">
      <h2>Apport booster</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="v">${fmtEUR(v.boosterMontant)}</div><div class="l">Montant</div></div>
        <div class="kpi"><div class="v">${fmtPct(v.boosterTaux*100)}</div><div class="l">Taux</div></div>
        <div class="kpi"><div class="v">${fmtEUR(v.boosterInteretsAn)}</div><div class="l">Intérêts / an (in fine)</div></div>

}

let previsionnelState = { chargesExt:{}, salaries:null };
function renderPrevisionnelTab(root){
  const dataRef = STATE.current.bilans[0]||{};
  const params = STATE.current.params;
  if(Object.keys(dataRef).length===0){
    root.innerHTML = `<div class="card"><p class="note">Complétez d'abord le bilan de l'année N.</p></div>`;
    return;
  }
  const v = computeValorisation(dataRef, params);

  if(!previsionnelState.salaries){
    previsionnelState.salaries = [
      { key:'sal1', label:'Salarié 1 (repris du bilan)', garde:true, montant: num(dataRef.salaires_personnel)+num(dataRef.charges_personnel) },
    ];
  }

  root.innerHTML = `
    <div class="card">
      <h2>Charges externes prévisionnelles</h2>
      <p class="note">Cochez les postes à conserver, et indiquez un "autre montant" pour remplacer la valeur du bilan si besoin.</p>
      <div class="field-grid wide" id="charges-prev-grid"></div>
      <div style="margin-top:10px; font-weight:600;">Total retenu : <span id="charges-prev-total"></span></div>
    </div>
    <div class="card">
      <h2>Masse salariale prévisionnelle</h2>
      <div class="field-grid wide" id="salaries-prev-grid"></div>
      <button class="ghost small" id="add-salary" style="margin-top:8px;">+ Ajouter un salarié / poste</button>
      <div style="margin-top:10px; font-weight:600;">Total retenu : <span id="salaries-prev-total"></span></div>
    </div>
    <div class="card" id="previ-table-card">
      <h2>Prévisionnel sur 12 ans</h2>
      <div class="scrollx" id="previ-table"></div>
    </div>`;

  const chargesGrid = document.getElementById('charges-prev-grid');
  CHARGES_EXT_KEYS.forEach(k=>{
    const def = BILAN_SECTIONS.find(s=>s.title==="Charges externes détaillées").fields.find(f=>f.key===k);
    const bilanVal = num(dataRef[k]);
    const ov = previsionnelState.chargesExt[k] || { garde:true, autreMontant:'' };
    previsionnelState.chargesExt[k] = ov;
    const row = document.createElement('div'); row.style.display='contents';
    row.innerHTML = `
      <div class="field-label">${def.label} <span style="color:var(--muted)">(bilan: ${fmtEUR(bilanVal)})</span></div>
      <label class="na-toggle"><input type="checkbox" data-ck="${k}" ${ov.garde?'checked':''}> gardé</label>
      <input type="number" step="any" class="f-edit" data-cm="${k}" placeholder="autre montant" value="${ov.autreMontant}">`;
    chargesGrid.appendChild(row);
  });
  chargesGrid.addEventListener('input', recomputePrevi);
  chargesGrid.addEventListener('change', recomputePrevi);

  const salGrid = document.getElementById('salaries-prev-grid');
  function renderSalRows(){
    salGrid.innerHTML = '';
    previsionnelState.salaries.forEach((row,i)=>{
      const r = document.createElement('div'); r.style.display='contents';
      r.innerHTML = `
        <input type="text" class="f-input" data-sl="${i}" value="${escapeHtml(row.label)}">
        <label class="na-toggle"><input type="checkbox" data-sg="${i}" ${row.garde?'checked':''}> gardé</label>
        <input type="number" step="any" class="f-edit" data-sm="${i}" value="${row.montant}">`;
      salGrid.appendChild(r);
    });
  }
  renderSalRows();
  salGrid.addEventListener('input', (e)=>{
    if(e.target.dataset.sl!==undefined) previsionnelState.salaries[e.target.dataset.sl].label = e.target.value;
    if(e.target.dataset.sm!==undefined) previsionnelState.salaries[e.target.dataset.sm].montant = num(e.target.value);
    recomputePrevi();
  });
  salGrid.addEventListener('change', (e)=>{
    if(e.target.dataset.sg!==undefined) previsionnelState.salaries[e.target.dataset.sg].garde = e.target.checked;
    recomputePrevi();
  });
  document.getElementById('add-salary').addEventListener('click', ()=>{
    previsionnelState.salaries.push({ label:'Nouveau poste', garde:true, montant:0 });
    renderSalRows(); recomputePrevi();
  });

  function recomputePrevi(){
    chargesGrid.querySelectorAll('[data-ck]').forEach(cb=>{ previsionnelState.chargesExt[cb.dataset.ck].garde = cb.checked; });
    chargesGrid.querySelectorAll('[data-cm]').forEach(inp=>{ previsionnelState.chargesExt[inp.dataset.cm].autreMontant = inp.value; });

    const p = computePrevisionnel(dataRef, params, v, previsionnelState.chargesExt, previsionnelState.salaries);
    document.getElementById('charges-prev-total').textContent = fmtEUR(p.totalChargesExtInit);
    document.getElementById('salaries-prev-total').textContent = fmtEUR(p.totalSalairesInit);

    const cols = p.years;
    const rows = [
      ['CA HT', y=>fmtEUR(y.CA)],
      ['Taux marge brute', y=>fmtPct(y.tauxMargeBrute)],
      ['Marge commerciale', y=>fmtEUR(y.margeCommerciale)],
      ['Charges externes', y=>fmtEUR(y.chargesExt)],
      ['Impôts et taxes', y=>fmtEUR(y.impotsTaxes)],
      ['Salaires et charges', y=>fmtEUR(y.salaires)],
      ['EBE retraité', y=>y.ebeRetraite==null?'—':fmtEUR(y.ebeRetraite)],
      ['Rémunération exploitants', y=>y.remunerationAn==null?'—':fmtEUR(y.remunerationAn)],
      ['Cotisations sociales exploitants', y=>y.cotisSociales==null?'—':fmtEUR(y.cotisSociales)],
      ['EBE comptable', y=>y.ebeComptable==null?'—':fmtEUR(y.ebeComptable)],
      ['Dotation amortissement', y=>y.dotationAmort==null?'—':fmtEUR(y.dotationAmort)],
      ["Frais d'installation", y=>y.droitsFraisInstall==null?'—':fmtEUR(y.droitsFraisInstall)],
      ['Crédit vendeur stock', y=>y.creditVendeurStock==null?'—':fmtEUR(y.creditVendeurStock)],
      ["Résultat d'exploitation après gérance", y=>y.resultatExploit==null?'—':fmtEUR(y.resultatExploit)],
      ['Charges fin. (booster)', y=>y.chargesFiBooster==null?'—':fmtEUR(y.chargesFiBooster)],
      ['Charges fin. (emprunt banque)', y=>y.chargesFiBanque==null?'—':fmtEUR(y.chargesFiBanque)],
      ['Résultat courant après gérance', y=>y.resultatCourant==null?'—':fmtEUR(y.resultatCourant)],
      ['Impôt société (IS)', y=>y.IS==null?'—':fmtEUR(y.IS)],
      ['Résultat net après IS', y=>y.resultatNet==null?'—':fmtEUR(y.resultatNet)],
      ['Paiement capital', y=>y.paiementCapital==null?'—':fmtEUR(y.paiementCapital)],
      ['Résultat avant redistribution', y=>y.resultatAvantRedistrib==null?'—':fmtEUR(y.resultatAvantRedistrib)],
    ];
    const table = document.getElementById('previ-table');
    table.innerHTML = `<table class="calc">
      <tr><th>Poste</th>${cols.map(c=>`<th>An ${c.annee}</th>`).join('')}</tr>
      ${rows.map(([label,fn])=>`<tr><td>${label}</td>${cols.map(c=>`<td>${fn(c)}</td>`).join('')}</tr>`).join('')}
    </table>`;
  }
  recomputePrevi();
}

async function loadMappings(){
  const { data } = await sb.from('import_mappings').select('*').eq('user_id', STATE.user.id);
  STATE.importMappings = {};
  (data||[]).forEach(r=> STATE.importMappings[r.source_label.toLowerCase().trim()] = r.target_field);
}

function buildImportPrompt(){
  const fields = allFieldDefs();
  const lines = fields.map(f=>{
    if(f.kind==='ht') return `- "${f.key}" (${f.label}) : montant HT en euros. Optionnel: "${f.key}_tva" = taux de TVA en décimal (ex 0.021 pour 2,1%) si différent du taux standard.`;
    if(f.kind==='pct') return `- "${f.key}" (${f.label}) : pourcentage en décimal (ex 0.15 pour 15%).`;
    return `- "${f.key}" (${f.label}) : montant en euros.`;
  }).join('\n');

  return `Tu es un assistant comptable. Je te fournis en pièce jointe le(s) bilan(s) comptable(s) d'une officine de pharmacie (liasse fiscale, compte de résultat, SIG...).

Extrait toutes les informations suivantes pour CHAQUE année disponible dans les documents (le plus souvent 3 exercices : N, N-1, N-2), et réponds UNIQUEMENT avec un JSON valide, sans texte autour, au format suivant :

{
  "annee_N":   { "clé_du_champ": valeur, ... },
  "annee_N-1": { "clé_du_champ": valeur, ... },
  "annee_N-2": { "clé_du_champ": valeur, ... }
}

Voici la liste exacte des champs attendus (utilise ces clés précises, en anglais/snake_case tel quel) :

${lines}

Règles importantes :
- Si une information est introuvable dans le document, omets simplement la clé (ne mets pas 0 par défaut).
- Si tu trouves une ligne du bilan qui ne correspond à AUCUN des champs ci-dessus mais qui semble pertinente (ex: une charge non listée, un compte particulier), ajoute-la quand même dans un objet séparé "non_classes" avec le libellé EXACT tel qu'il apparaît sur le bilan comme clé, et le montant comme valeur — par exemple : "non_classes": { "Achats exonérés": 50 }. Je ferai le tri moi-même ensuite.
- Les montants sont en euros, nombres simples sans espace ni symbole (ex: 12345.67, pas "12 345,67 €").
- Les taux de TVA et pourcentages sont en décimal (2,1% = 0.021, pas 2.1).

Réponds uniquement avec le JSON, rien d'autre.`;
}

function openImportModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-bg">
      <div class="modal">
        <button class="close-x" id="close-import">×</button>
        <h2>Import de bilan assisté par IA</h2>
        <div class="step">Étape 1 — Copiez ce prompt dans votre IA (avec les bilans en pièce jointe)</div>
        <textarea class="promptbox" id="import-prompt" readonly>${buildImportPrompt()}</textarea>
        <div class="modal-actions"><button class="ghost" id="copy-prompt">Copier le prompt</button></div>

        <div class="step" style="margin-top:20px;">Étape 2 — Collez ici la réponse JSON de l'IA</div>
        <textarea class="jsonbox" id="import-json" placeholder='{"annee_N": {...}, "annee_N-1": {...}, ...}'></textarea>
        <div class="modal-actions"><button class="primary" id="parse-json">Analyser</button></div>

        <div id="dispatch-zone"></div>
      </div>
    </div>`;
  document.getElementById('close-import').addEventListener('click', ()=> root.innerHTML='');
  document.getElementById('copy-prompt').addEventListener('click', ()=>{
    navigator.clipboard.writeText(document.getElementById('import-prompt').value);
    toast("Prompt copié.");
  });
  document.getElementById('parse-json').addEventListener('click', handleParseJson);
}

let pendingImport = null;

function handleParseJson(){
  const raw = document.getElementById('import-json').value.trim();
  let parsed;
  try {
    const cleaned = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    parsed = JSON.parse(cleaned);
  } catch(e){
    toast("JSON invalide : "+e.message);
    return;
  }
  const yearMap = { annee_N:0, "annee_N-1":-1, "annee_N-2":-2, N:0, "N-1":-1, "N-2":-2 };
  const known = new Set(allFieldDefs().map(f=>f.key));
  const unclassified = [];
  const byYear = {0:{}, [-1]:{}, [-2]:{}};

  Object.keys(parsed).forEach(yk=>{
    const y = yearMap[yk];
    if(y===undefined) return;
    const obj = parsed[yk] || {};
    Object.keys(obj).forEach(k=>{
      if(k==='non_classes'){
        Object.entries(obj[k]||{}).forEach(([label,val])=>{
          const mapped = STATE.importMappings[label.toLowerCase().trim()];
          if(mapped) byYear[y][mapped] = val;
          else unclassified.push({ year:y, label, value: val });
        });
      } else if(known.has(k) || k.endsWith('_tva')){
        byYear[y][k] = obj[k];
      } else {
        const mapped = STATE.importMappings[k.toLowerCase().trim()];
        if(mapped) byYear[y][mapped] = obj[k];
        else unclassified.push({ year:y, label:k, value: obj[k] });
      }
    });
  });

  pendingImport = { byYear, unclassified, resolved:{} };
  renderDispatchZone();
}

function renderDispatchZone(){
  const zone = document.getElementById('dispatch-zone');
  const fields = allFieldDefs();
  if(pendingImport.unclassified.length===0){
    zone.innerHTML = `<div class="note">Tous les champs ont été reconnus automatiquement.</div>
      <div class="modal-actions"><button class="primary" id="apply-import">Appliquer l'import</button></div>`;
    document.getElementById('apply-import').addEventListener('click', applyImport);
    return;
  }
  zone.innerHTML = `
    <div class="step" style="margin-top:20px;">Étape 3 — ${pendingImport.unclassified.length} ligne(s) non reconnue(s) : choisissez leur destination</div>
    <div class="dispatch-row" style="font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase;">
      <div>Trouvé dans le bilan</div><div>Montant</div><div>Champ cible</div>
    </div>
    ${pendingImport.unclassified.map((u,i)=>`
      <div class="dispatch-row">
        <div>${escapeHtml(u.label)} <span style="color:var(--muted)">(${yearLabel(u.year)})</span></div>
        <div>${typeof u.value==='number' ? fmtEUR(u.value) : escapeHtml(String(u.value))}</div>
        <select class="f-edit" data-dispatch="${i}">
          <option value="">— ignorer —</option>
          ${fields.map(f=>`<option value="${f.key}">${f.label}</option>`).join('')}
        </select>
      </div>`).join('')}
    <div class="modal-actions"><button class="primary" id="apply-import">Appliquer l'import</button></div>`;

  zone.querySelectorAll('[data-dispatch]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const i = sel.dataset.dispatch;
      pendingImport.resolved[i] = sel.value || null;
    });
  });
  document.getElementById('apply-import').addEventListener('click', applyImport);
}

async function applyImport(){
  const { byYear, unclassified, resolved } = pendingImport;
  for(let i=0;i<unclassified.length;i++){
    const target = resolved[i];
    if(!target) continue;
    const u = unclassified[i];
    byYear[u.year][target] = u.value;
    STATE.importMappings[u.label.toLowerCase().trim()] = target;
    await sb.from('import_mappings').upsert({
      user_id: STATE.user.id, source_label: u.label, target_field: target,
    }, { onConflict: 'user_id,source_label' });
  }
  for(const y of [0,-1,-2]){
    if(Object.keys(byYear[y]).length===0) continue;
    const merged = { ...(STATE.current.bilans[y]||{}), ...byYear[y] };
    const { error } = await sb.from('bilans').upsert({
      project_id: STATE.current.project.id, annee_offset: y, data: merged, annee_label: yearLabel(y),
    }, { onConflict: 'project_id,annee_offset' });
    if(error){ toast("Erreur import "+yearLabel(y)+": "+error.message); continue; }
    STATE.current.bilans[y] = merged;
  }
  toast("Import appliqué.");
  document.getElementById('modal-root').innerHTML = '';
  if(STATE.activeTab==='bilans') renderTabs();
}

(async function boot(){
  renderAuthMode();
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await onAuthed(session); }
  else { showView('auth'); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ showView('auth'); }
  });
})();
</script>
