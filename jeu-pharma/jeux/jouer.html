<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jouer — Jeu Pharma</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/v2.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Jeux</a>
    <p class="jp-kicker">Session</p>
    <h1 class="jp-title" id="titre">Chargement…</h1>
    <p class="jp-sub" id="meta"></p>
    <div id="panel" class="jp-v2-banner">Préparation de la session…</div>
    <div class="jp-v2-actions" id="actions" hidden>
      <button type="button" class="jp-btn jp-btn-primary" id="btnStart">Démarrer / nouveau tirage</button>
    </div>
    <pre id="debug" class="jp-muted" style="white-space:pre-wrap;margin-top:1.5rem;font-size:0.85rem"></pre>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'jeu-jouer', homeHref: JpFab.PORTAIL_URL });
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const panel = document.getElementById('panel');
      const actions = document.getElementById('actions');
      const debug = document.getElementById('debug');
      if (!code) {
        panel.textContent = 'Code de jeu manquant.';
        return;
      }
      try {
        const { data: modele, error } = await JpApp.sbJeu()
          .from('modeles_jeu')
          .select('id, code_unique, type_jeu, titre, mode, configuration_json, en_pause, actif')
          .eq('code_unique', code)
          .eq('actif', true)
          .maybeSingle();
        if (error) throw error;
        if (!modele) throw new Error('Jeu introuvable');
        if (modele.en_pause) throw new Error('Ce jeu est en pause');
        document.getElementById('titre').textContent = modele.titre;
        document.getElementById('meta').textContent = modele.type_jeu + ' · ' + modele.mode + ' · ' + modele.code_unique;

        if (modele.type_jeu === 'ordonnance') {
          location.replace('../ordonnances/jouer.html?code=' + encodeURIComponent(code));
          return;
        }

        if (modele.type_jeu === 'quiz') {
          panel.textContent = 'Quiz d’entraînement : un tirage personnel est créé à partir des connaissances de votre parcours.';
          actions.hidden = false;
          document.getElementById('btnStart').addEventListener('click', async function () {
            try {
              const { data, error: e2 } = await JpApp.sbJeu().rpc('v2_nouveau_tirage_quiz', {
                p_modele_id: modele.id
              });
              if (e2) throw e2;
              panel.innerHTML = 'Tirage créé · tentative <code>' + JpUi.escapeHtml(data.tentative_id) + '</code>. '
                + 'Pool : ' + ((data.snapshot && data.snapshot.matrice_ids) || []).length + ' molécule(s).';
              debug.textContent = JSON.stringify(data.snapshot, null, 2);
              JpToast.ok('Tirage prêt');
            } catch (e) {
              JpToast.fromError(e);
            }
          });
          return;
        }

        panel.textContent = 'Type « ' + modele.type_jeu
          + ' » : modèle enregistré. L’écran de jeu dédié arrive ensuite ; les paramètres admin sont déjà pris en compte.';
        debug.textContent = JSON.stringify(modele.configuration_json || {}, null, 2);
      } catch (e) {
        panel.textContent = e.message || String(e);
        JpToast.fromError(e);
      }
    });
  </script>
</body>
</html>
