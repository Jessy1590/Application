<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jouer — Jeu Pharma</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/v2.css">
</head>
<body>
  <main class="jp-page jp-page-wide">
    <a class="jp-back" href="index.html">← Jeux</a>
    <p class="jp-kicker">Session</p>
    <h1 class="jp-title" id="titre">Chargement…</h1>
    <p class="jp-sub" id="meta"></p>
    <p class="jp-muted" id="hintScope">Seules les molécules et informations publiées dans votre parcours sont visibles.</p>
    <div id="root"><p class="jp-muted">Préparation…</p></div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/resolver.js"></script>
  <script src="../js/jeux-play.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'jeu-jouer', homeHref: JpFab.PORTAIL_URL });
      const code = new URLSearchParams(location.search).get('code');
      const root = document.getElementById('root');
      if (!code) {
        root.innerHTML = '<p class="jp-muted">Code de jeu manquant. <a href="index.html">Retour</a></p>';
        return;
      }
      try {
        await JpV2Resolver.ensureParcoursActif();
        const modele = await JpJeuxPlay.boot(root, code);
        document.getElementById('titre').textContent = modele.titre;
        document.getElementById('meta').textContent = modele.type_jeu + ' · ' + modele.mode + ' · ' + modele.code_unique;
      } catch (e) {
        JpToast.fromError(e);
        root.innerHTML = '<p class="jp-muted">' + JpUi.escapeHtml(e.message || String(e))
          + '</p><p><a href="../espace.html">Choisir le parcours Introduction</a></p>';
      }
    });
  </script>
</body>
</html>
