  <script src="js/lecon-player.js?v=083"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'lecon', homeHref: JpFab.PORTAIL_URL });
      const params = new URLSearchParams(location.search);
      const id = params.get('module');
      const preview = params.get('preview') === '1';
      const previewNiveau = params.get('niveau');
      const root = document.getElementById('root');
      if (!id) {
        root.innerHTML = '<p class="jp-muted">—</p>';
        return;
      }
      try {
        await JpLeconPlayer.boot(root, id, preview, previewNiveau);
      } catch (e) {
        JpToast.fromError(e);
        root.innerHTML = '<p class="jp-muted">' + JpUi.escapeHtml(e.message || String(e)) + '</p>';
      }
    });
  </script>
</body>
