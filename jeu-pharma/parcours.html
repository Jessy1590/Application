<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parcours</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css?v=028">
<link rel="stylesheet" href="css/player.css?v=028">
</head>
<body>
  <main class="jp-player-shell">
    <a class="jp-back" href="index.html">←</a>
    <h1 class="jp-player-brand">Parcours</h1>
    <ul class="jp-list-clean" id="list"></ul>
  </main>
  <nav class="jp-bottom-nav" aria-label="Navigation">
    <a href="parcours.html" aria-current="page">Parcours</a>
    <a href="mon-espace.html">Espace</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="jeux/index.html">Jeux</a>
  </nav>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/resolver.js?v=028"></script>
  <script src="js/parcours-ui.js?v=028"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'parcours-dispo', homeHref: JpFab.PORTAIL_URL });
      const list = document.getElementById('list');
      const esc = JpUi.escapeHtml;

      function card(p) {
        const accepte = p.statut === 'accepte';
        const maj = JpParcoursUi.majLabel(p.maj_at);
        const meta = [maj, p.nb_lecons ? p.nb_lecons + ' leçon' + (p.nb_lecons > 1 ? 's' : '') : '']
          .filter(Boolean).join(' · ');
        let inner = '<div class="jp-pc-head"><strong class="jp-pc-title">' + esc(p.libelle) + '</strong>';
        let action = '';
        if (accepte && !p.verrouille) {
          action = '<span class="jp-pc-go" aria-hidden="true">Ouvrir →</span>';
        } else if (p.statut === 'demande') {
          action = '<span class="jp-badge-soft wait">En attente</span>';
        } else if (p.verrouille) {
          action = '<span class="jp-badge-soft off">🔒 Verrouillé</span>';
        } else {
          action = '<button type="button" class="jp-btn jp-btn-primary jp-btn-touch" data-demande="' + esc(p.id) + '">Demander</button>';
        }
        inner += action + '</div>';
        if (p.description) inner += '<p class="jp-pc-desc">' + esc(p.description) + '</p>';
        if (accepte) {
          inner += '<div class="jp-pc-prog">' + JpParcoursUi.progressBar(p.pct, 'Progression ' + p.libelle)
            + '<span>' + JpParcoursUi.clampPct(p.pct) + ' %'
            + (p.nb_lecons ? ' · ' + (p.nb_valides || 0) + ' / ' + p.nb_lecons + ' leçons validées' : '') + '</span></div>';
        }
        if (p.verrouille && p.bloque_par) {
          inner += '<p class="jp-pc-lock">🔒 ' + esc(JpParcoursUi.messageBloque(p.bloque_par)) + '</p>';
        }
        if (meta) inner += '<p class="jp-pc-meta">' + esc(meta) + '</p>';
        const cls = 'jp-pc' + (accepte && !p.verrouille ? ' is-open' : '') + (p.verrouille ? ' is-locked' : '');
        // Clic direct sur le parcours : pas d’écran intermédiaire de choix
        if (accepte && !p.verrouille) {
          return '<li><a class="' + cls + '" href="espace.html?parcours=' + encodeURIComponent(p.id) + '">' + inner + '</a></li>';
        }
        return '<li><div class="' + cls + '">' + inner + '</div></li>';
      }

      try {
        const parcours = await JpV2Resolver.parcoursListe();
        if (!parcours.length) {
          list.innerHTML = '<li class="jp-muted">—</li>';
          return;
        }
        list.innerHTML = parcours.map(card).join('');
        list.querySelectorAll('[data-demande]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            try {
              btn.disabled = true;
              await JpV2Resolver.demanderParcours(btn.getAttribute('data-demande'));
              JpToast.ok('Demande envoyée');
              location.reload();
            } catch (e) {
              btn.disabled = false;
              JpToast.fromError(e);
            }
          });
        });
      } catch (e) {
        JpToast.fromError(e);
        list.innerHTML = '<li class="jp-muted">Erreur</li>';
      }
    });
  </script>
</body>
</html>
