<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parcours</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
  <main class="jp-player-shell">
    <a class="jp-back" href="index.html">←</a>
    <h1 class="jp-player-brand">Parcours</h1>
    <ul class="jp-list-clean" id="list"></ul>
  </main>
  <nav class="jp-bottom-nav" aria-label="Navigation">
    <a href="parcours.html" aria-current="page">Parcours</a>
    <a href="mon-espace.html">Espace</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="jeux/index.html">Jeux</a>
  </nav>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/resolver.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'parcours-dispo', homeHref: JpFab.PORTAIL_URL });
      const list = document.getElementById('list');
      try {
        const parcours = await JpV2Resolver.listParcours();
        const insc = await JpV2Resolver.mesInscriptions();
        const byId = Object.fromEntries(insc.map((i) => [i.parcours_id, i]));
        if (!parcours.length) {
          list.innerHTML = '<li class="jp-muted">—</li>';
          return;
        }
        list.innerHTML = parcours.map(function (p) {
          const i = byId[p.id];
          let action = '';
          if (!i || i.statut === 'refuse') {
            action = '<button type="button" class="jp-btn jp-btn-primary jp-btn-touch" data-demande="' + p.id + '">Demander</button>';
          } else if (i.statut === 'demande') {
            action = '<span class="jp-badge-soft wait">En attente</span>';
          } else {
            action = '<a class="jp-btn jp-btn-primary jp-btn-touch" href="espace.html?parcours=' + encodeURIComponent(p.id) + '">Ouvrir</a>';
          }
          return '<li class="jp-list-row"><strong>' + JpUi.escapeHtml(p.libelle) + '</strong>' + action + '</li>';
        }).join('');
        list.querySelectorAll('[data-demande]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            try {
              await JpV2Resolver.demanderParcours(btn.getAttribute('data-demande'));
              JpToast.ok('Demande envoyée');
              location.reload();
            } catch (e) {
              JpToast.fromError(e);
            }
          });
        });
      } catch (e) {
        JpToast.fromError(e);
        list.innerHTML = '<li class="jp-muted">Erreur</li>';
      }
    });
  </script>
</body>
</html>
