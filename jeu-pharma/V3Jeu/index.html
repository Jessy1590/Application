<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3 Jeu</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar">
  <button type="button" id="btnOpen" class="primary">+ Jeu</button>
  <form id="auth">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <button type="submit">Entrer</button>
  </form>
  <span id="who"></span>
  <button type="button" id="btnOut" hidden>Sortir</button>
</header>
<div id="sheet" class="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="panel-head">
      <h1 id="sheetTitle">Jeu</h1>
      <button type="button" id="btnClose" aria-label="Fermer">×</button>
    </header>
    <div class="panel-body">
      <ol class="stepper" id="stepper"></ol>
      <div id="step"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
