<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jeux V2</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../css/v2.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="../index.html">← Hub V2</a>
    <p class="jp-kicker">Jeux</p>
    <h1 class="jp-title">Activités du parcours</h1>
    <p class="jp-sub">Les jeux en pause n’apparaissent pas. Les quiz V1 restent disponibles sur le hub historique.</p>
    <div id="list"><p class="jp-muted">Chargement…</p></div>
    <p style="margin-top:1.5rem"><a href="../ordonnances/index.html">Ordonnances type →</a>
      · <a href="../../quiz/index.html">Quiz V1 →</a>
      · <a href="../../trous/index.html">Trous V1 →</a></p>
  </main>
  <script src="../../js/constants.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/logs.js"></script>
  <script src="../../js/bugs.js"></script>
  <script src="../../js/fab.js"></script>
  <script src="../../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'v2-jeux', homeHref: JpFab.PORTAIL_URL });
      const list = document.getElementById('list');
      try {
        const { data, error } = await JpApp.sbJeu()
          .from('modeles_jeu')
          .select('id, code_unique, type_jeu, titre, mode, created_at')
          .eq('actif', true)
          .eq('en_pause', false)
          .order('created_at', { ascending: false });
        if (error) throw error;
        const rows = data || [];
        if (!rows.length) {
          JpUi.emptyState(list, { title: 'Aucun jeu V2', text: 'Créez une ordonnance ou un quiz dans Admin V2.' });
          return;
        }
        list.innerHTML = '<div class="jp-hub-grid">' + rows.map(function (r) {
          const href = r.type_jeu === 'ordonnance'
            ? '../ordonnances/jouer.html?code=' + encodeURIComponent(r.code_unique)
            : '#';
          return '<a class="jp-tile" href="' + href + '"><h2>' + JpUi.escapeHtml(r.titre) + '</h2>'
            + '<p><code>' + JpUi.escapeHtml(r.code_unique) + '</code> · '
            + JpUi.escapeHtml(r.type_jeu) + '</p></a>';
        }).join('') + '</div>';
      } catch (e) {
        JpToast.fromError(e);
        list.innerHTML = '<p class="jp-muted">Erreur de chargement.</p>';
      }
    });
  </script>
</body>
</html>
