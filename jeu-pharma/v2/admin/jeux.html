<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jeux — Admin V2</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../../css/app.css">
<link rel="stylesheet" href="../css/v2.css">
</head>
<body>
  <main class="jp-page jp-page-wide">
    <a class="jp-back" href="index.html">← Admin V2</a>
    <p class="jp-kicker">Jeux V2</p>
    <h1 class="jp-title">Création de jeu</h1>
    <p class="jp-sub">Contexte parcours/modules. Ordonnance type : règles classe ou molécule fixe.</p>

    <form class="jp-quiz-admin" id="jeuForm" onsubmit="return false">
      <section class="jp-quiz-admin-panel">
        <div class="jp-quiz-admin-panel-body">
          <div class="jp-split jp-split-2">
            <div class="jp-field">
              <label for="jeuType">Type</label>
              <select id="jeuType">
                <option value="ordonnance">Ordonnance type</option>
                <option value="quiz">Quiz</option>
              </select>
            </div>
            <div class="jp-field">
              <label for="jeuMode">Mode</label>
              <select id="jeuMode">
                <option value="entrainement">Entraînement</option>
                <option value="evaluation">Évaluation</option>
              </select>
            </div>
          </div>
          <div class="jp-field">
            <label for="jeuTitre">Titre</label>
            <input id="jeuTitre" required maxlength="200" placeholder="Ex. Ordonnance type HTA">
          </div>
          <div class="jp-field">
            <label for="jeuParcours">Parcours</label>
            <select id="jeuParcours" required></select>
          </div>
          <div class="jp-field">
            <span class="jp-field-label">Modules (optionnel — restreint le pool)</span>
            <div id="jeuModules" class="jp-quiz-admin-champs-grid"></div>
          </div>
          <div class="jp-field">
            <span class="jp-field-label">Champs à restituer / interroger</span>
            <div class="jp-quiz-admin-champs-grid" id="champsGrid">
              <label class="jp-quiz-admin-champ"><input type="checkbox" name="jeuChamp" value="indications" checked> <span>Indications</span></label>
              <label class="jp-quiz-admin-champ"><input type="checkbox" name="jeuChamp" value="contre_indications" checked> <span>Contre-indications</span></label>
              <label class="jp-quiz-admin-champ"><input type="checkbox" name="jeuChamp" value="effets_indesirables" checked> <span>Effets indésirables</span></label>
              <label class="jp-quiz-admin-champ"><input type="checkbox" name="jeuChamp" value="precautions_emploi"> <span>Précautions</span></label>
              <label class="jp-quiz-admin-champ"><input type="checkbox" name="jeuChamp" value="interactions"> <span>Interactions</span></label>
              <label class="jp-quiz-admin-champ"><input type="checkbox" name="jeuChamp" value="classe_pharmacologique"> <span>Classe pharmacologique</span></label>
            </div>
          </div>
          <div class="jp-split jp-split-2">
            <div class="jp-field"><label for="jeuNbQ">Nb questions (quiz)</label><input id="jeuNbQ" type="number" min="1" max="50" value="10"></div>
            <div class="jp-field"><label for="jeuNbProp">Propositions</label><input id="jeuNbProp" type="number" min="2" max="6" value="3"></div>
          </div>
        </div>
      </section>

      <section class="jp-quiz-admin-panel">
        <h2 class="jp-quiz-admin-panel-title">Règles d’ordonnance</h2>
        <div class="jp-quiz-admin-panel-body">
          <div class="jp-split jp-split-2">
            <div class="jp-field">
              <label for="regleKind">Type de règle</label>
              <select id="regleKind">
                <option value="classe_therapeutique">Classe thérapeutique × N</option>
                <option value="classe_pharmacologique">Classe pharmacologique × N</option>
              </select>
            </div>
            <div class="jp-field">
              <label for="regleNombre">Nombre</label>
              <input id="regleNombre" type="number" min="1" max="20" value="2">
            </div>
          </div>
          <div class="jp-field">
            <label for="regleClasseTher">Classe thérapeutique</label>
            <select id="regleClasseTher"></select>
          </div>
          <div class="jp-field">
            <label for="regleClassePharma">Classe pharmacologique</label>
            <select id="regleClassePharma"></select>
          </div>
          <button type="button" class="jp-btn jp-btn-ghost" id="btnAddRegleClasse">Ajouter règle classe</button>
          <div class="jp-field" style="margin-top:1rem">
            <label for="regleMatriceId">Molécule fixe (UUID matrice)</label>
            <input id="regleMatriceId" placeholder="uuid matrice_medicaments">
          </div>
          <button type="button" class="jp-btn jp-btn-ghost" id="btnAddRegleMatrice">Ajouter molécule fixe</button>
          <div id="reglesList" style="margin-top:1rem"></div>
        </div>
      </section>

      <div class="jp-v2-actions">
        <button type="button" class="jp-btn jp-btn-primary" id="btnCreateJeu">Créer le jeu</button>
      </div>
      <div id="resultBox" class="jp-quiz-admin-result" hidden>
        <p class="jp-kicker">Code</p>
        <p id="resultCode" class="jp-quiz-admin-result-code"></p>
        <p id="resultMeta" class="jp-muted"></p>
        <a id="resultPlay" class="jp-btn jp-btn-primary" href="#">Jouer</a>
      </div>
    </form>

    <section style="margin-top:2rem">
      <h2 class="jp-title">Historique</h2>
      <div id="jeuxList"></div>
    </section>
  </main>
  <script src="../../js/constants.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/logs.js"></script>
  <script src="../../js/bugs.js"></script>
  <script src="../../js/fab.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { void JpV2Admin.bootJeux(); });</script>
</body>
</html>
