<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jouer — Trous</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Trous</a>
    <p class="jp-kicker">Trous</p>
    <h1 class="jp-title" id="partieTitle">Jouer</h1>
    <p class="jp-sub" id="partieMeta"></p>

    <div id="root">
      <p class="jp-muted">Chargement…</p>
    </div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/trous.js"></script>
  <script src="../js/print.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'trous-jouer', homeHref: JpFab.PORTAIL_URL });

      const params = new URLSearchParams(location.search);
      const code = (params.get('code') || params.get('id') || '').trim();
      const root = document.getElementById('root');

      if (!code) {
        JpUi.emptyState(root, {
          title: 'Code manquant',
          text: 'Ouvrez une partie depuis la liste.',
          actionHref: 'index.html',
          actionLabel: 'Retour',
        });
        return;
      }

      let partie = null;
      try {
        partie = await JpTrous.ouvrir(code);
      } catch (e) {
        JpToast.fromError(e);
        JpUi.emptyState(root, {
          title: 'Partie introuvable',
          text: e.message || String(e),
          actionHref: 'index.html',
          actionLabel: 'Retour',
        });
        return;
      }

      document.getElementById('partieTitle').textContent = partie.titre || 'Tableau à trous';
      document.getElementById('partieMeta').textContent =
        partie.code_unique + ' · ' + partie.mode + ' · ' + (partie.niveau_cible || '');

      const grille = partie.grille;
      const cols = (grille && grille.colonnes) || [];
      if (!cols.length || !(grille.lignes || []).length) {
        JpUi.emptyState(root, { title: 'Grille vide', text: 'Aucune ligne à compléter.' });
        return;
      }

      let lastEval = null;
      let scoreSaved = false;

      let html = '<div id="playForm"><div class="jp-table-wrap"><table class="jp-table jp-trous-table"><thead><tr><th>Médicament</th>';
      cols.forEach(function (c) {
        html += '<th>' + JpUi.escapeHtml(JpTrous.champLibelle(c)) + '</th>';
      });
      html += '</tr></thead><tbody>';

      (grille.lignes || []).forEach(function (ligne) {
        html += '<tr><td>' + JpUi.escapeHtml(ligne.label || '') + '</td>';
        (ligne.cells || []).forEach(function (cell) {
          if (cell.trou) {
            const name = 'cell_' + ligne.matrice_id + '_' + cell.champ_code;
            html += '<td class="jp-trou"><label class="jp-sr-only" for="' + name + '">'
              + JpUi.escapeHtml(JpTrous.champLibelle(cell.champ_code)) + '</label>'
              + '<input class="jp-trou-input" id="' + name + '" name="' + name + '" type="text" autocomplete="off"'
              + ' data-matrice="' + JpUi.escapeHtml(ligne.matrice_id) + '"'
              + ' data-champ="' + JpUi.escapeHtml(cell.champ_code) + '"></td>';
          } else {
            const shown = JpTrous.cellDisplay(cell);
            html += '<td>' + JpUi.escapeHtml(shown || '—') + '</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += '<div class="jp-field-actions jp-trous-actions">'
        + '<button type="button" class="jp-btn jp-btn-ghost" id="btnPrint">Imprimer</button>'
        + '<button type="button" class="jp-btn jp-btn-primary" id="btnReveal">Voir la réponse</button>'
        + '<button type="button" class="jp-btn jp-btn-ghost" id="btnScore">Indiquer un score</button>'
        + '</div></div>';
      html += '<div id="scoreBox" class="jp-panel jp-trous-score" hidden></div>';
      root.innerHTML = html;

      function collectReponses() {
        const inputs = root.querySelectorAll('.jp-trou-input');
        return Array.from(inputs).map(function (inp) {
          return {
            matrice_id: inp.getAttribute('data-matrice'),
            champ_code: inp.getAttribute('data-champ'),
            reponse: inp.value,
          };
        });
      }

      function applyReveal(details) {
        root.querySelectorAll('.jp-trous-attendu').forEach(function (el) { el.remove(); });
        (details || []).forEach(function (d) {
          const inp = root.querySelector(
            '.jp-trou-input[data-matrice="' + d.matrice_id + '"][data-champ="' + d.champ_code + '"]'
          );
          if (!inp) return;
          inp.classList.remove('jp-input-ok', 'jp-input-ko');
          inp.classList.add(d.correct ? 'jp-input-ok' : 'jp-input-ko');
          inp.readOnly = true;
          const td = inp.closest('td');
          if (!td) return;
          const hint = document.createElement('div');
          hint.className = 'jp-trous-attendu' + (d.correct ? ' jp-trous-attendu-ok' : ' jp-trous-attendu-ko');
          hint.textContent = d.correct
            ? 'Correct'
            : ('Attendu : ' + (d.bonne_valeur || '—'));
          td.appendChild(hint);
        });
      }

      function showScoreBox(result, saved) {
        const box = document.getElementById('scoreBox');
        box.hidden = false;
        box.innerHTML = '<p class="jp-kicker">' + (saved ? 'Score enregistré' : 'Score') + '</p>'
          + '<p class="jp-brand jp-trous-score-value">' + result.score_obtenu + ' / ' + result.score_max + '</p>';
      }

      async function ensureEval() {
        if (lastEval) return lastEval;
        lastEval = await JpTrous.evaluer(partie.id, collectReponses());
        applyReveal(lastEval.details);
        return lastEval;
      }

      document.getElementById('btnPrint').addEventListener('click', async function () {
        try {
          let displayName = '';
          const user = await JpApp.getUser();
          if (user) displayName = (await JpApp.getDisplayName(user.id)) || '';
          const docHtml = JpPrint.trousPrintDocument({
            code: partie.code_unique,
            titre: partie.titre,
            nom: displayName,
            colonnes: cols,
            lignes: grille.lignes || [],
          });
          JpPrint.printHtml(docHtml);
          void JpLogs.action('trous_print', { code: partie.code_unique, from: 'jouer' });
        } catch (e) {
          JpToast.fromError(e);
        }
      });

      document.getElementById('btnReveal').addEventListener('click', async function () {
        const btn = document.getElementById('btnReveal');
        btn.disabled = true;
        try {
          lastEval = null;
          const result = await ensureEval();
          showScoreBox(result, false);
          btn.textContent = 'Réponses affichées';
          JpToast.ok('Corrigé affiché');
        } catch (e) {
          JpToast.fromError(e);
          btn.disabled = false;
        }
      });

      document.getElementById('btnScore').addEventListener('click', async function () {
        const btn = document.getElementById('btnScore');
        btn.disabled = true;
        try {
          const result = await ensureEval();
          showScoreBox(result, scoreSaved);

          if (scoreSaved) {
            JpToast.warn('Score déjà enregistré pour cette session');
            btn.disabled = false;
            return;
          }

          const msg = 'Enregistrer le score '
            + result.score_obtenu + '/' + result.score_max
            + ' dans votre suivi ?';
          if (!confirm(msg)) {
            btn.disabled = false;
            return;
          }

          const saved = await JpTrous.soumettre(partie.id, collectReponses());
          scoreSaved = true;
          showScoreBox(saved, true);
          btn.textContent = 'Score enregistré';
          JpToast.ok('Score : ' + saved.score_obtenu + '/' + saved.score_max);
        } catch (e) {
          JpToast.fromError(e);
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
