<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jouer — Trous</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Trous</a>
    <p class="jp-kicker">Trous</p>
    <h1 class="jp-title" id="partieTitle">Jouer</h1>
    <p class="jp-sub" id="partieMeta"></p>

    <div id="root">
      <p class="jp-muted">Chargement…</p>
    </div>
  </main>

  <div id="scoreModal" class="jp-trous-score-modal" hidden>
    <div class="jp-trous-score-modal-backdrop" data-close-score-modal></div>
    <div class="jp-trous-score-modal-panel" role="dialog" aria-modal="true" aria-labelledby="scoreModalTitle">
      <div class="jp-trous-score-modal-head">
        <h2 id="scoreModalTitle">Indiquer un score</h2>
        <button type="button" class="jp-icon-btn" data-close-score-modal aria-label="Fermer">×</button>
      </div>
      <fieldset class="jp-trous-score-modes">
        <legend class="jp-sr-only">Mode de saisie</legend>
        <label class="jp-trous-score-mode">
          <input type="radio" name="scoreMode" value="general" checked>
          Résultat général
        </label>
        <label class="jp-trous-score-mode">
          <input type="radio" name="scoreMode" value="ligne">
          Par ligne
        </label>
        <label class="jp-trous-score-mode">
          <input type="radio" name="scoreMode" value="case">
          Par case
        </label>
      </fieldset>
      <div id="scoreModePanels"></div>
      <div class="jp-field-actions jp-trous-score-modal-actions">
        <button type="button" class="jp-btn jp-btn-ghost" data-close-score-modal>Annuler</button>
        <button type="button" class="jp-btn jp-btn-primary" id="btnScoreValidate">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/trous.js"></script>
  <script src="../js/print.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'trous-jouer', homeHref: JpFab.PORTAIL_URL });

      const params = new URLSearchParams(location.search);
      const code = (params.get('code') || params.get('id') || '').trim();
      const root = document.getElementById('root');
      const scoreModal = document.getElementById('scoreModal');
      const scoreModePanels = document.getElementById('scoreModePanels');

      if (!code) {
        JpUi.emptyState(root, {
          title: 'Code manquant',
          text: 'Ouvrez une partie depuis la liste.',
          actionHref: 'index.html',
          actionLabel: 'Retour',
        });
        return;
      }

      let partie = null;
      try {
        partie = await JpTrous.ouvrir(code);
      } catch (e) {
        JpToast.fromError(e);
        JpUi.emptyState(root, {
          title: 'Partie introuvable',
          text: e.message || String(e),
          actionHref: 'index.html',
          actionLabel: 'Retour',
        });
        return;
      }

      document.getElementById('partieTitle').textContent = partie.titre || 'Tableau à trous';
      document.getElementById('partieMeta').textContent =
        partie.code_unique + ' · ' + partie.mode + ' · ' + (partie.niveau_cible || '');

      const grille = partie.grille;
      const cols = (grille && grille.colonnes) || [];
      if (!cols.length || !(grille.lignes || []).length) {
        JpUi.emptyState(root, { title: 'Grille vide', text: 'Aucune ligne à compléter.' });
        return;
      }

      let scoreSaved = false;
      let corrigeData = null;

      const showMedCol = JpTrous.afficheColonneMedicament(grille);
      let html = '<div id="playForm"><div class="jp-table-wrap"><table class="jp-table jp-trous-table"><thead><tr>';
      if (showMedCol) html += '<th>Médicament</th>';
      cols.forEach(function (c) {
        html += '<th>' + JpUi.escapeHtml(JpTrous.champLibelle(c)) + '</th>';
      });
      html += '</tr></thead><tbody>';

      (grille.lignes || []).forEach(function (ligne) {
        const lid = JpTrous.ligneKey(ligne);
        html += '<tr>';
        if (showMedCol) html += '<td>' + JpUi.escapeHtml(ligne.label || '') + '</td>';
        (ligne.cells || []).forEach(function (cell) {
          if (cell.trou) {
            const name = 'cell_' + lid.replace(/[^a-zA-Z0-9_-]/g, '_') + '_' + cell.champ_code;
            html += '<td class="jp-trou"><label class="jp-sr-only" for="' + name + '">'
              + JpUi.escapeHtml(JpTrous.champLibelle(cell.champ_code)) + '</label>'
              + '<input class="jp-trou-input" id="' + name + '" name="' + name + '" type="text" autocomplete="off"'
              + ' data-ligne="' + JpUi.escapeHtml(lid) + '"'
              + ' data-matrice="' + JpUi.escapeHtml(ligne.matrice_id || '') + '"'
              + ' data-champ="' + JpUi.escapeHtml(cell.champ_code) + '"></td>';
          } else {
            const shown = JpTrous.cellDisplay(cell);
            html += '<td>' + JpUi.escapeHtml(shown || '—') + '</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += '<div class="jp-field-actions jp-trous-actions">'
        + '<button type="button" class="jp-btn jp-btn-ghost" id="btnPrint">Imprimer</button>'
        + '<button type="button" class="jp-btn jp-btn-primary" id="btnReveal">Voir la réponse</button>'
        + '<button type="button" class="jp-btn jp-btn-ghost" id="btnScore">Indiquer un score</button>'
        + '</div></div>';
      html += '<div id="scoreBox" class="jp-panel jp-trous-score" hidden></div>';
      root.innerHTML = html;

      function showScoreBox(result, saved) {
        const box = document.getElementById('scoreBox');
        box.hidden = false;
        box.innerHTML = '<p class="jp-kicker">' + (saved ? 'Score enregistré' : 'Score') + '</p>'
          + '<p class="jp-brand jp-trous-score-value">' + result.score_obtenu + ' / ' + result.score_max + '</p>';
      }

      async function ensureCorrige() {
        if (corrigeData) return corrigeData;
        corrigeData = await JpTrous.listerTrous(partie.id);
        return corrigeData;
      }

      function applyCorrige(trous) {
        root.querySelectorAll('.jp-trous-attendu').forEach(function (el) { el.remove(); });
        root.querySelectorAll('.jp-trou-input').forEach(function (inp) {
          inp.classList.remove('jp-input-ok', 'jp-input-ko');
          inp.readOnly = true;
        });
        (trous || []).forEach(function (d) {
          const lid = d.ligne_id || d.matrice_id;
          let inp = lid
            ? root.querySelector(
              '.jp-trou-input[data-ligne="' + lid + '"][data-champ="' + d.champ_code + '"]'
            )
            : null;
          if (!inp && d.matrice_id) {
            inp = root.querySelector(
              '.jp-trou-input[data-matrice="' + d.matrice_id + '"][data-champ="' + d.champ_code + '"]'
            );
          }
          if (!inp) return;
          const td = inp.closest('td');
          if (!td) return;
          const hint = document.createElement('div');
          hint.className = 'jp-trous-attendu';
          hint.textContent = 'Attendu : ' + (d.bonne_valeur || '—');
          td.appendChild(hint);
        });
      }

      function closeScoreModal() {
        scoreModal.hidden = true;
      }

      function selectedScoreMode() {
        const checked = scoreModal.querySelector('input[name="scoreMode"]:checked');
        return checked ? checked.value : 'general';
      }

      function renderScoreModePanels(data) {
        const mode = selectedScoreMode();
        const maxCases = data.score_max || (data.trous || []).length || 1;
        let panel = '';

        if (mode === 'general') {
          panel = '<div class="jp-trous-score-panel" data-panel="general">'
            + '<label class="jp-trous-score-field">Score obtenu'
            + '<input type="number" id="scoreGeneralObtenu" min="0" max="' + maxCases + '" step="1" value="0">'
            + '</label>'
            + '<label class="jp-trous-score-field">Score max'
            + '<input type="number" id="scoreGeneralMax" min="1" step="1" value="' + maxCases + '">'
            + '</label>'
            + '</div>';
        } else if (mode === 'ligne') {
          panel = '<div class="jp-trous-score-panel" data-panel="ligne"><p class="jp-muted">Cochez les lignes réussies.</p><ul class="jp-trous-score-list">';
          (data.lignes || []).forEach(function (ligne, i) {
            const lid = ligne.ligne_id || ligne.matrice_id || '';
            panel += '<li><label>'
              + '<input type="checkbox" class="jp-trous-score-ligne" data-index="' + i + '" data-ligne="'
              + JpUi.escapeHtml(lid) + '" data-matrice="'
              + JpUi.escapeHtml(ligne.matrice_id || '') + '">'
              + ' ' + JpUi.escapeHtml(ligne.label || ('Ligne ' + (i + 1)))
              + '</label></li>';
          });
          panel += '</ul></div>';
        } else {
          panel = '<div class="jp-trous-score-panel" data-panel="case"><p class="jp-muted">Cochez les cases correctes.</p><ul class="jp-trous-score-list">';
          (data.trous || []).forEach(function (trou, i) {
            const lid = trou.ligne_id || trou.matrice_id || '';
            panel += '<li><label>'
              + '<input type="checkbox" class="jp-trous-score-case" data-index="' + i + '"'
              + ' data-ligne="' + JpUi.escapeHtml(lid) + '"'
              + ' data-matrice="' + JpUi.escapeHtml(trou.matrice_id || '') + '"'
              + ' data-champ="' + JpUi.escapeHtml(trou.champ_code) + '">'
              + ' ' + JpUi.escapeHtml(trou.label || '')
              + ' — ' + JpUi.escapeHtml(JpTrous.champLibelle(trou.champ_code))
              + '</label></li>';
          });
          panel += '</ul></div>';
        }

        scoreModePanels.innerHTML = panel;
      }

      async function openScoreModal() {
        const data = await ensureCorrige();
        if (!data.score_max) {
          JpToast.warn('Aucun trou à scorer');
          return;
        }
        renderScoreModePanels(data);
        scoreModal.hidden = false;
      }

      function collectManuelPayload(data) {
        const mode = selectedScoreMode();

        if (mode === 'general') {
          const obtenu = Number(document.getElementById('scoreGeneralObtenu').value);
          const max = Number(document.getElementById('scoreGeneralMax').value);
          return {
            mode_saisie: 'general',
            score_obtenu: obtenu,
            score_max: max,
            details: { type: 'general' },
          };
        }

        if (mode === 'ligne') {
          const lignes = data.lignes || [];
          const detailsLignes = lignes.map(function (ligne, i) {
            const cb = scoreModePanels.querySelector(
              '.jp-trous-score-ligne[data-index="' + i + '"]'
            );
            return {
              ligne_id: ligne.ligne_id || ligne.matrice_id,
              matrice_id: ligne.matrice_id,
              label: ligne.label,
              correct: !!(cb && cb.checked),
            };
          });
          const score_obtenu = detailsLignes.filter(function (l) { return l.correct; }).length;
          return {
            mode_saisie: 'ligne',
            score_obtenu: score_obtenu,
            score_max: lignes.length,
            details: { type: 'ligne', lignes: detailsLignes },
          };
        }

        const trous = data.trous || [];
        const detailsCases = trous.map(function (trou, i) {
          const cb = scoreModePanels.querySelector(
            '.jp-trous-score-case[data-index="' + i + '"]'
          );
          return {
            ligne_id: trou.ligne_id || trou.matrice_id,
            matrice_id: trou.matrice_id,
            champ_code: trou.champ_code,
            correct: !!(cb && cb.checked),
          };
        });
        const score_obtenu = detailsCases.filter(function (c) { return c.correct; }).length;
        return {
          mode_saisie: 'case',
          score_obtenu: score_obtenu,
          score_max: trous.length,
          details: { type: 'case', cases: detailsCases },
        };
      }

      document.getElementById('btnPrint').addEventListener('click', async function () {
        try {
          let displayName = '';
          const user = await JpApp.getUser();
          if (user) displayName = (await JpApp.getDisplayName(user.id)) || '';
          const docHtml = JpPrint.trousPrintDocument({
            code: partie.code_unique,
            titre: partie.titre,
            nom: displayName,
            colonnes: cols,
            lignes: grille.lignes || [],
            identite_visible: grille.identite_visible || null,
            afficheColonneMedicament: showMedCol,
          });
          JpPrint.printHtml(docHtml);
          void JpLogs.action('trous_print', { code: partie.code_unique, from: 'jouer' });
        } catch (e) {
          JpToast.fromError(e);
        }
      });

      document.getElementById('btnReveal').addEventListener('click', async function () {
        const btn = document.getElementById('btnReveal');
        btn.disabled = true;
        try {
          const data = await ensureCorrige();
          applyCorrige(data.trous);
          btn.textContent = 'Réponses affichées';
          JpToast.ok('Corrigé affiché');
        } catch (e) {
          JpToast.fromError(e);
          btn.disabled = false;
        }
      });

      document.getElementById('btnScore').addEventListener('click', async function () {
        const btn = document.getElementById('btnScore');
        if (scoreSaved) {
          JpToast.warn('Score déjà enregistré pour cette session');
          return;
        }
        btn.disabled = true;
        try {
          await openScoreModal();
        } catch (e) {
          JpToast.fromError(e);
        } finally {
          btn.disabled = false;
        }
      });

      scoreModal.querySelectorAll('[data-close-score-modal]').forEach(function (el) {
        el.addEventListener('click', closeScoreModal);
      });

      scoreModal.querySelectorAll('input[name="scoreMode"]').forEach(function (radio) {
        radio.addEventListener('change', async function () {
          try {
            const data = await ensureCorrige();
            renderScoreModePanels(data);
          } catch (e) {
            JpToast.fromError(e);
          }
        });
      });

      document.getElementById('btnScoreValidate').addEventListener('click', async function () {
        const btn = document.getElementById('btnScoreValidate');
        if (scoreSaved) {
          JpToast.warn('Score déjà enregistré pour cette session');
          closeScoreModal();
          return;
        }
        btn.disabled = true;
        try {
          const data = await ensureCorrige();
          const payload = collectManuelPayload(data);
          const saved = await JpTrous.soumettreManuel(partie.id, payload);
          scoreSaved = true;
          closeScoreModal();
          showScoreBox(saved, true);
          const scoreBtn = document.getElementById('btnScore');
          if (scoreBtn) {
            scoreBtn.textContent = 'Score enregistré';
            scoreBtn.disabled = true;
          }
          JpToast.ok('Score : ' + saved.score_obtenu + '/' + saved.score_max);
        } catch (e) {
          JpToast.fromError(e);
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
