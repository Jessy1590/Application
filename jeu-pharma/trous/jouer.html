<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jouer — Trous</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Trous</a>
    <p class="jp-kicker">Trous</p>
    <h1 class="jp-title" id="partieTitle">Jouer</h1>
    <p class="jp-sub" id="partieMeta"></p>

    <div id="root">
      <p class="jp-muted">Chargement…</p>
    </div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/trous.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'trous-jouer', homeHref: JpFab.PORTAIL_URL });

      const params = new URLSearchParams(location.search);
      const code = (params.get('code') || params.get('id') || '').trim();
      const root = document.getElementById('root');

      if (!code) {
        JpUi.emptyState(root, {
          title: 'Code manquant',
          text: 'Ouvrez une partie depuis la liste.',
          actionHref: 'index.html',
          actionLabel: 'Retour',
        });
        return;
      }

      let partie = null;
      try {
        partie = await JpTrous.ouvrir(code);
      } catch (e) {
        JpToast.fromError(e);
        JpUi.emptyState(root, {
          title: 'Partie introuvable',
          text: e.message || String(e),
          actionHref: 'index.html',
          actionLabel: 'Retour',
        });
        return;
      }

      document.getElementById('partieTitle').textContent = partie.titre || 'Tableau à trous';
      document.getElementById('partieMeta').textContent =
        partie.code_unique + ' · ' + partie.mode + ' · ' + (partie.niveau_cible || '');

      const grille = partie.grille;
      const cols = (grille && grille.colonnes) || [];
      if (!cols.length || !(grille.lignes || []).length) {
        JpUi.emptyState(root, { title: 'Grille vide', text: 'Aucune ligne à compléter.' });
        return;
      }

      let html = '<form id="playForm"><div class="jp-table-wrap"><table class="jp-table jp-trous-table"><thead><tr><th>Médicament</th>';
      cols.forEach(function (c) {
        html += '<th>' + JpUi.escapeHtml(JpTrous.champLibelle(c)) + '</th>';
      });
      html += '</tr></thead><tbody>';

      (grille.lignes || []).forEach(function (ligne) {
        html += '<tr><td>' + JpUi.escapeHtml(ligne.label || '') + '</td>';
        (ligne.cells || []).forEach(function (cell) {
          if (cell.trou) {
            const name = 'cell_' + ligne.matrice_id + '_' + cell.champ_code;
            html += '<td class="jp-trou"><label class="jp-sr-only" for="' + name + '">'
              + JpUi.escapeHtml(JpTrous.champLibelle(cell.champ_code)) + '</label>'
              + '<input class="jp-trou-input" id="' + name + '" name="' + name + '" type="text" autocomplete="off"'
              + ' data-matrice="' + JpUi.escapeHtml(ligne.matrice_id) + '"'
              + ' data-champ="' + JpUi.escapeHtml(cell.champ_code) + '"></td>';
          } else {
            const shown = JpTrous.cellDisplay(cell);
            html += '<td>' + JpUi.escapeHtml(shown || '—') + '</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += '<div class="jp-field-actions" style="margin-top:1.25rem">'
        + '<button type="submit" class="jp-btn jp-btn-primary">Enregistrer</button>'
        + ' <a class="jp-btn jp-btn-ghost" href="imprimer.html?code='
        + encodeURIComponent(partie.code_unique) + '">Imprimer</a></div></form>';
      html += '<div id="scoreBox" class="jp-panel" hidden></div>';
      root.innerHTML = html;

      document.getElementById('playForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        const inputs = root.querySelectorAll('.jp-trou-input');
        const reponses = Array.from(inputs).map(function (inp) {
          return {
            matrice_id: inp.getAttribute('data-matrice'),
            champ_code: inp.getAttribute('data-champ'),
            reponse: inp.value,
          };
        });
        const btn = ev.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          const result = await JpTrous.soumettre(partie.id, reponses);
          const box = document.getElementById('scoreBox');
          box.hidden = false;
          box.innerHTML = '<p class="jp-kicker">Résultat</p>'
            + '<p class="jp-brand" style="font-size:1.5rem">' + result.score_obtenu + ' / ' + result.score_max + '</p>';

          if (partie.mode === 'entrainement' && Array.isArray(result.details)) {
            result.details.forEach(function (d) {
              const inp = root.querySelector(
                '.jp-trou-input[data-matrice="' + d.matrice_id + '"][data-champ="' + d.champ_code + '"]'
              );
              if (!inp) return;
              inp.classList.add(d.correct ? 'jp-input-ok' : 'jp-input-ko');
              if (!d.correct) {
                inp.title = 'Attendu : ' + (d.bonne_valeur || '');
              }
            });
          }

          JpToast.ok('Score : ' + result.score_obtenu + '/' + result.score_max);
          btn.textContent = 'Déjà enregistré';
        } catch (e) {
          JpToast.fromError(e);
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
