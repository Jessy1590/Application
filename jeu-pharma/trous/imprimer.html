<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Imprimer — Trous</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
  <main class="jp-page jp-page-wide">
    <a class="jp-back no-print" href="index.html">← Trous</a>
    <p class="jp-kicker no-print">Trous</p>
    <h1 class="jp-title no-print">Imprimer</h1>
    <p class="jp-sub no-print">Grille papier (trous en blanc à remplir).</p>

    <div class="jp-field-actions no-print" id="actions" hidden>
      <button type="button" class="jp-btn jp-btn-primary" id="btnPrint">Imprimer</button>
    </div>

    <div id="preview" class="jp-print-preview">
      <p class="jp-muted">Chargement…</p>
    </div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/profil.js"></script>
  <script src="../js/trous.js"></script>
  <script src="../js/print.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'trous-print', homeHref: JpFab.PORTAIL_URL });

      const params = new URLSearchParams(location.search);
      const code = (params.get('code') || '').trim().toUpperCase();
      const preview = document.getElementById('preview');

      if (!code) {
        JpUi.emptyState(preview, {
          title: 'Code manquant',
          text: 'Ajoutez ?code=TT-XXXXX à l’URL.',
          actionHref: 'index.html',
          actionLabel: 'Retour',
        });
        return;
      }

      let partie = null;
      let displayName = '';
      try {
        partie = await JpTrous.getByCode(code);
        if (!partie) throw new Error('Partie introuvable ou inactive');
        const user = await JpApp.getUser();
        if (user) displayName = (await JpApp.getDisplayName(user.id)) || '';
      } catch (e) {
        JpToast.fromError(e);
        JpUi.emptyState(preview, { title: 'Impossible de charger', text: e.message || String(e) });
        return;
      }

      const snap = partie.snapshot_grille || {};
      const cols = snap.colonnes || [];
      const lignes = snap.lignes || [];
      const dateStr = new Date().toLocaleString('fr-FR');

      if (!cols.length || !lignes.length) {
        JpUi.emptyState(preview, { title: 'Grille vide', text: 'Aucune ligne à imprimer.' });
        return;
      }

      const showMedCol = JpTrous.afficheColonneMedicament(snap);
      let table = '<table class="jp-table jp-trous-table"><thead><tr>';
      if (showMedCol) table += '<th>Médicament</th>';
      cols.forEach(function (c) {
        table += '<th>' + JpUi.escapeHtml(JpTrous.champLibelle(c)) + '</th>';
      });
      table += '</tr></thead><tbody>';
      lignes.forEach(function (ligne) {
        table += '<tr>';
        if (showMedCol) table += '<td>' + JpUi.escapeHtml(ligne.label || '') + '</td>';
        (ligne.cells || []).forEach(function (cell) {
          if (cell.trou) {
            table += '<td class="jp-trou">&nbsp;</td>';
          } else {
            const val = JpTrous.cellDisplay(cell);
            table += '<td>' + JpUi.escapeHtml(val || '—') + '</td>';
          }
        });
        table += '</tr>';
      });
      table += '</tbody></table>';

      preview.innerHTML =
        '<div class="jp-print-header" style="display:block">'
        + '<h1>' + JpUi.escapeHtml(partie.titre || 'Tableau à trous') + '</h1>'
        + '<div class="jp-print-meta">Code : <strong>' + JpUi.escapeHtml(partie.code_unique) + '</strong>'
        + (displayName ? ' · Nom : ' + JpUi.escapeHtml(displayName) : '')
        + ' · ' + JpUi.escapeHtml(dateStr) + '</div></div>'
        + '<div class="jp-table-wrap">' + table + '</div>';

      document.getElementById('actions').hidden = false;
      document.getElementById('btnPrint').addEventListener('click', function () {
        try {
          const docHtml = JpPrint.trousPrintDocument({
            code: partie.code_unique,
            titre: partie.titre,
            nom: displayName,
            date: dateStr,
            colonnes: cols,
            lignes: lignes,
            identite_visible: snap.identite_visible || null,
            afficheColonneMedicament: showMedCol,
          });
          JpPrint.printHtml(docHtml);
          void JpLogs.action('trous_print', { code: partie.code_unique });
        } catch (e) {
          JpToast.fromError(e);
        }
      });
    });
  </script>
</body>
</html>
