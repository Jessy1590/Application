<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ordonnances type — V2</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css?v=059">
<link rel="stylesheet" href="../css/v2.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="../index.html">← Hub</a>
    <p class="jp-kicker">Ordonnance type</p>
    <h1 class="jp-title">Ordonnances</h1>
    <p class="jp-sub">Saisissez un code JP-xxxxx ou choisissez une session.</p>
    <form id="codeForm" class="jp-form" style="margin-bottom:2rem">
      <div class="jp-field">
        <label for="code">Code</label>
        <div class="jp-toolbar" style="margin:0">
          <input id="code" type="text" maxlength="10" placeholder="JP-XXXXX" required style="text-transform:uppercase;flex:1">
          <button type="submit" class="jp-btn jp-btn-primary">Ouvrir</button>
        </div>
      </div>
    </form>
    <div id="listWrap"><p class="jp-muted">Chargement…</p></div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js?v=059"></script>
  <script src="../js/fab.js?v=059"></script>
  <script src="../js/ui.js?v=059"></script>
  <script src="../js/ordonnances.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'ordonnances', homeHref: JpFab.PORTAIL_URL });
      document.getElementById('codeForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        const code = document.getElementById('code').value.trim().toUpperCase();
        if (!/^JP-[A-Z0-9]{4,5}$/.test(code)) {
          JpToast.warn('Format : JP-XXXX ou JP-XXXXX');
          return;
        }
        location.href = 'jouer.html?code=' + encodeURIComponent(code);
      });
      const wrap = document.getElementById('listWrap');
      try {
        const rows = await JpV2Ordonnances.listActives();
        if (!rows.length) {
          JpUi.emptyState(wrap, { title: 'Aucune ordonnance', text: 'Créez-en une dans Admin V2 → Jeux.' });
          return;
        }
        wrap.innerHTML = '<div class="jp-hub-grid">' + rows.map(function (r) {
          return '<a class="jp-tile" href="jouer.html?code=' + encodeURIComponent(r.code_unique) + '">'
            + '<h2>' + JpUi.escapeHtml(r.titre) + '</h2>'
            + '<p><code>' + JpUi.escapeHtml(r.code_unique) + '</code></p></a>';
        }).join('') + '</div>';
      } catch (e) {
        JpToast.fromError(e);
        JpUi.emptyState(wrap, { title: 'Erreur', text: e.message || String(e) });
      }
    });
  </script>
</body>
</html>
