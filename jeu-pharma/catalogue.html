<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Catalogue — Jeu Pharma</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Hub</a>
    <p class="jp-kicker">Catalogue</p>
    <h1 class="jp-title">Catalogue</h1>
    <p class="jp-sub">Fiches publiées issues des cours.</p>

    <div class="jp-toolbar" id="jpToolbar" hidden>
      <input type="search" id="jpQ" placeholder="Rechercher (nom, DCI…)" aria-label="Rechercher">
      <select id="jpSecteur" aria-label="Secteur">
        <option value="">Tous les secteurs</option>
      </select>
    </div>

    <div id="jpList"></div>
  </main>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/medicaments.js"></script>
  <script>
    (function () {
      const esc = JpUi.escapeHtml;
      let all = [];

      function uniqueSecteurs(rows) {
        const map = new Map();
        rows.forEach((r) => {
          if (r.secteur_therapeutique_id && r.secteur_therapeutique) {
            map.set(r.secteur_therapeutique_id, r.secteur_therapeutique);
          }
        });
        return [...map.entries()].sort((a, b) => a[1].localeCompare(b[1], 'fr'));
      }

      function formatMulti(arr) {
        if (!Array.isArray(arr) || !arr.length) return '—';
        return arr.map((x) => x.valeur || x).join(', ');
      }

      function filtered() {
        const q = String(document.getElementById('jpQ').value || '').trim().toLowerCase();
        const sid = document.getElementById('jpSecteur').value;
        return all.filter((r) => {
          if (sid && r.secteur_therapeutique_id !== sid) return false;
          if (!q) return true;
          const blob = [
            r.nom_commercial,
            r.dci,
            r.secteur_therapeutique,
            r.classe_therapeutique,
            r.classe_pharmacologique,
          ].filter(Boolean).join(' ').toLowerCase();
          return blob.includes(q);
        });
      }

      function render() {
        const host = document.getElementById('jpList');
        const rows = filtered();
        if (!all.length) {
          document.getElementById('jpToolbar').hidden = true;
          JpUi.emptyState(host, {
            title: 'Aucun médicament pour l’instant',
            text: 'Ajoutez les médicaments vus en cours depuis l’admin (saisie ou CSV).',
          });
          return;
        }
        document.getElementById('jpToolbar').hidden = false;
        if (!rows.length) {
          JpUi.emptyState(host, {
            title: 'Aucun résultat',
            text: 'Modifiez la recherche ou le filtre secteur.',
          });
          return;
        }
        host.innerHTML = `
          <div class="jp-table-wrap">
            <table class="jp-table">
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>DCI</th>
                  <th>Secteur</th>
                  <th>Classe pharma.</th>
                  <th>Indications</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((r) => `
                  <tr>
                    <td>${esc(r.nom_commercial || '—')}</td>
                    <td>${esc(r.dci || '—')}</td>
                    <td>${esc(r.secteur_therapeutique || '—')}</td>
                    <td>${esc(r.classe_pharmacologique || '—')}</td>
                    <td>${esc(formatMulti(r.indications))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      async function load() {
        try {
          all = await JpMedicaments.list({ publieOnly: true });
          const sel = document.getElementById('jpSecteur');
          const secteurs = uniqueSecteurs(all);
          sel.innerHTML = '<option value="">Tous les secteurs</option>' +
            secteurs.map(([id, lab]) =>
              `<option value="${esc(id)}">${esc(lab)}</option>`
            ).join('');
          render();
        } catch (e) {
          JpToast.fromError(e);
          void JpLogs.error('catalogue_list', { message: e?.message });
          JpUi.emptyState(document.getElementById('jpList'), {
            title: 'Catalogue indisponible',
            text: e?.message || 'Erreur de chargement',
          });
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        JpUi.bootPage({ module: 'catalogue', homeHref: JpFab.PORTAIL_URL });
        load();
        document.getElementById('jpQ').addEventListener('input', () => {
          clearTimeout(window.__jpCatT);
          window.__jpCatT = setTimeout(render, 180);
        });
        document.getElementById('jpSecteur').addEventListener('change', render);
      });
    })();
  </script>
</body>
</html>
