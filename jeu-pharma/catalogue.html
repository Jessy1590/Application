<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Catalogue V2</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
  <main class="jp-player-shell" style="max-width:56rem">
    <a class="jp-back" href="index.html">←</a>
    <h1 class="jp-player-brand">Catalogue</h1>
    <p id="scopeNote" class="jp-muted" hidden></p>
    <div class="jp-field">
      <input id="q" type="search" placeholder="Recherche" autocomplete="off">
    </div>
    <p id="count" class="jp-muted"></p>
    <div id="list" class="jp-table-wrap"><p class="jp-muted">Chargement…</p></div>

    <div id="ficheModal" class="jp-scope-modal" hidden role="dialog" aria-modal="true">
      <div class="jp-scope-modal-card" style="width:min(100%,36rem);max-height:min(90dvh,40rem);overflow:auto">
        <div class="jp-sheet-head">
          <h2 class="jp-scope-modal-title" id="ficheTitle">Fiche</h2>
          <button type="button" class="jp-icon-btn" id="ficheClose" aria-label="Fermer">×</button>
        </div>
        <div id="ficheBody"></div>
      </div>
    </div>
  </main>
  <nav class="jp-bottom-nav" aria-label="Navigation">
    <a href="parcours.html">Parcours</a>
    <a href="mon-espace.html">Espace</a>
    <a href="catalogue.html" aria-current="page">Catalogue</a>
    <a href="jeux/index.html">Jeux</a>
  </nav>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/resolver.js?v=048"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'catalogue', homeHref: JpFab.PORTAIL_URL });
      let all = [];
      const list = document.getElementById('list');
      const modal = document.getElementById('ficheModal');

      function champLibelle(code) {
        const c = (JpConstants.CHAMP_CODES || []).find(function (x) { return x.code === code; });
        return c ? c.libelle : code;
      }

      function render(rows) {
        document.getElementById('count').textContent = rows.length + ' médicament';
        if (!rows.length) {
          list.innerHTML = '<p class="jp-muted">Aucune fiche pour votre parcours / modules débloqués.</p>';
          return;
        }
        list.innerHTML = '<table class="jp-table"><thead><tr><th>DCI</th><th>Noms</th><th>Connaissances</th><th></th></tr></thead><tbody>'
          + rows.map(function (r) {
            return '<tr><td>' + JpUi.escapeHtml(r.dci || '') + '</td><td>'
              + JpUi.escapeHtml(r.noms || '') + '</td><td>' + (r.nb_connaissances || 0)
              + '</td><td><button type="button" class="jp-link-btn" data-id="'
              + JpUi.escapeHtml(r.id) + '">Ouvrir</button></td></tr>';
          }).join('') + '</tbody></table>';
        list.querySelectorAll('[data-id]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            try {
              const fiche = await JpV2Resolver.ficheResolue(btn.getAttribute('data-id'));
              if (!fiche) {
                JpToast.warn('Fiche inaccessible');
                return;
              }
              document.getElementById('ficheTitle').textContent = fiche.dci || 'Fiche';
              const champs = fiche.champs || {};
              let html = '<p class="jp-muted">' + JpUi.escapeHtml(
                (fiche.noms_commerciaux || []).map(function (n) { return n.valeur; }).join(', ')
              ) + '</p><dl class="jp-v2-champs-revealed">';
              Object.keys(champs).forEach(function (code) {
                const vals = (champs[code] || []).map(function (it) { return it.valeur; }).join(' · ');
                html += '<dt>' + JpUi.escapeHtml(champLibelle(code)) + '</dt><dd>'
                  + JpUi.escapeHtml(vals || '—') + '</dd>';
              });
              html += '</dl><p class="jp-muted" style="margin-top:1rem">Les champs non publiés dans votre parcours sont masqués.</p>';
              document.getElementById('ficheBody').innerHTML = html;
              modal.hidden = false;
            } catch (e) {
              JpToast.fromError(e);
            }
          });
        });
      }

      function filter() {
        const q = (document.getElementById('q').value || '').trim().toLowerCase();
        if (!q) return render(all);
        render(all.filter(function (r) {
          return String(r.dci || '').toLowerCase().indexOf(q) >= 0
            || String(r.noms || '').toLowerCase().indexOf(q) >= 0;
        }));
      }

      try {
        await JpV2Resolver.ensureParcoursActif();
        const prog = await JpV2Resolver.progression();
        const note = document.getElementById('scopeNote');
        if (prog?.parcours) {
          note.hidden = false;
          note.textContent = prog.parcours.libelle;
        } else {
          note.hidden = false;
          note.innerHTML = '<a href="parcours.html">Demander un parcours</a>';
        }
        all = await JpV2Resolver.listerMedicaments();
        render(all);
      } catch (e) {
        JpToast.fromError(e);
        list.innerHTML = '<p class="jp-muted">Erreur de chargement. <a href="espace.html">Choisir un parcours</a>.</p>';
      }
      document.getElementById('q').addEventListener('input', filter);
      document.getElementById('ficheClose').addEventListener('click', function () { modal.hidden = true; });
      modal.addEventListener('click', function (ev) { if (ev.target === modal) modal.hidden = true; });
    });
  </script>
</body>
</html>
