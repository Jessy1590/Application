<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Création jeu — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page jp-page-wide">
    <a class="jp-back" href="index.html">← Admin</a>
    <p class="jp-kicker">Admin</p>
    <h1 class="jp-title">Création jeu</h1>
    <p class="jp-sub">Créer et gérer les quiz et tableaux à trous.</p>

    <div class="jp-jeu-type" role="tablist" aria-label="Type de jeu">
      <button type="button" class="jp-jeu-type-btn" role="tab" data-jeu-type="historique" aria-selected="false">Historique</button>
      <button type="button" class="jp-jeu-type-btn is-active" role="tab" data-jeu-type="quiz" aria-selected="true">Quiz</button>
      <button type="button" class="jp-jeu-type-btn" role="tab" data-jeu-type="trous" aria-selected="false">Tableau à trous</button>
    </div>

    <!-- Panel Historique -->
    <div id="panelHistorique" role="tabpanel" hidden>
      <section class="jp-jeux-histo" aria-labelledby="histoTitle">
        <div class="jp-jeux-histo-head">
          <h2 id="histoTitle" class="jp-jeux-histo-title">Parties</h2>
          <div class="jp-jeux-histo-filters" role="group" aria-label="Filtrer les parties">
            <button type="button" class="jp-jeux-histo-filter is-active" data-histo-filter="tous">Tous</button>
            <button type="button" class="jp-jeux-histo-filter" data-histo-filter="en_cours">En cours</button>
            <button type="button" class="jp-jeux-histo-filter" data-histo-filter="termines">Terminés</button>
            <button type="button" class="jp-jeux-histo-filter" data-histo-filter="archives">Archivés</button>
          </div>
        </div>
        <div class="jp-jeux-histo-type-filters" role="group" aria-label="Type de partie">
          <button type="button" class="jp-jeux-histo-filter is-active" data-histo-kind="tous">Quiz + Trous</button>
          <button type="button" class="jp-jeux-histo-filter" data-histo-kind="quiz">Quiz</button>
          <button type="button" class="jp-jeux-histo-filter" data-histo-kind="trous">Trous</button>
        </div>
        <div id="listWrap" class="jp-table-wrap">
          <p class="jp-muted">Chargement…</p>
        </div>
      </section>
    </div>

    <!-- Panel Quiz -->
    <div id="panelQuiz" role="tabpanel">
      <form id="quizForm" class="jp-quiz-admin" novalidate>
        <section class="jp-quiz-admin-panel" aria-labelledby="quizIdentiteTitle">
          <h2 id="quizIdentiteTitle" class="jp-quiz-admin-panel-title">Identité</h2>
          <div class="jp-quiz-admin-panel-body">
            <div class="jp-field">
              <label for="quizTitre">Titre</label>
              <input id="quizTitre" name="titre" type="text" required maxlength="200" placeholder="Ex. Cardiologie — classes">
            </div>
            <div class="jp-split jp-split-2">
              <div class="jp-field">
                <label for="quizSecteur">Secteur (optionnel)</label>
                <select id="quizSecteur" name="secteur">
                  <option value="">Tous</option>
                </select>
              </div>
              <div class="jp-field">
                <label for="quizNiveau">Niveau cible</label>
                <select id="quizNiveau" name="niveau" required></select>
              </div>
            </div>
            <div class="jp-field">
              <label for="quizMode">Mode</label>
              <select id="quizMode" name="mode">
                <option value="entrainement">Entraînement</option>
                <option value="evaluation">Évaluation</option>
              </select>
            </div>
          </div>
        </section>

        <section class="jp-quiz-admin-panel" aria-labelledby="quizQuestionsTitle">
          <h2 id="quizQuestionsTitle" class="jp-quiz-admin-panel-title">Questions</h2>
          <div class="jp-quiz-admin-panel-body">
            <div class="jp-split jp-split-2">
              <div class="jp-field">
                <label for="quizNbQ">Nombre de questions</label>
                <input id="quizNbQ" name="nbQ" type="number" min="1" max="50" value="10" required>
              </div>
              <div class="jp-field">
                <label for="quizNbProp">Propositions</label>
                <input id="quizNbProp" name="nbProp" type="number" min="2" max="6" value="3" required>
              </div>
            </div>
          </div>
        </section>

        <section class="jp-quiz-admin-panel jp-quiz-admin-panel-champs" aria-labelledby="quizChampsTitle">
          <div class="jp-quiz-admin-panel-head">
            <h2 id="quizChampsTitle" class="jp-quiz-admin-panel-title">Champs interrogés</h2>
            <div class="jp-quiz-admin-champs-actions">
              <button type="button" class="jp-btn jp-btn-ghost" id="quizBtnChampsTous">Tous</button>
              <button type="button" class="jp-btn jp-btn-ghost" id="quizBtnChampsAucun">Aucun</button>
            </div>
          </div>
          <div class="jp-quiz-admin-panel-body">
            <div id="quizChampsList" class="jp-quiz-admin-champs-grid" role="group" aria-label="Champs interrogés"></div>
            <p class="jp-muted jp-quiz-admin-champs-hint">Au moins un champ requis.</p>
          </div>
        </section>
      </form>
    </div>

    <!-- Panel Trous -->
    <div id="panelTrous" role="tabpanel" hidden>
      <form id="trousForm" class="jp-quiz-admin" novalidate>
        <section class="jp-quiz-admin-panel" aria-labelledby="trousIdentiteTitle">
          <h2 id="trousIdentiteTitle" class="jp-quiz-admin-panel-title">Identité</h2>
          <div class="jp-quiz-admin-panel-body">
            <div class="jp-field">
              <label for="trousTitre">Titre</label>
              <input id="trousTitre" type="text" required maxlength="200" placeholder="Ex. Cardiologie — révision">
            </div>
            <div class="jp-split jp-split-2">
              <div class="jp-field">
                <label for="trousNiveau">Niveau cible</label>
                <select id="trousNiveau" required></select>
              </div>
              <div class="jp-field">
                <label for="trousMode">Mode</label>
                <select id="trousMode">
                  <option value="entrainement">Entraînement</option>
                  <option value="evaluation">Évaluation</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <section class="jp-quiz-admin-panel jp-quiz-admin-panel-champs" aria-labelledby="trousColonnesTitle">
          <div class="jp-quiz-admin-panel-head">
            <h2 id="trousColonnesTitle" class="jp-quiz-admin-panel-title">Colonnes</h2>
            <div class="jp-quiz-admin-champs-actions">
              <button type="button" class="jp-btn jp-btn-ghost" id="trousBtnColsAll">Tous</button>
              <button type="button" class="jp-btn jp-btn-ghost" id="trousBtnColsNone">Aucun</button>
            </div>
          </div>
          <div class="jp-quiz-admin-panel-body">
            <div id="trousColonnesList" class="jp-quiz-admin-champs-grid" role="group" aria-label="Colonnes"></div>
            <p class="jp-muted jp-quiz-admin-champs-hint">Au moins une colonne requise.</p>
          </div>
        </section>

        <section class="jp-quiz-admin-panel" aria-labelledby="trousTrousTitle">
          <h2 id="trousTrousTitle" class="jp-quiz-admin-panel-title">Trous</h2>
          <div class="jp-quiz-admin-panel-body">
            <div class="jp-field">
              <label for="trousModeTrous">Placement des trous</label>
              <select id="trousModeTrous">
                <option value="ALEATOIRE">Aléatoire</option>
                <option value="MANUEL">Manuel (cliquer les cellules)</option>
              </select>
            </div>
            <div class="jp-field" id="trousDensiteField">
              <label for="trousDensite">Densité des trous (aléatoire)</label>
              <input id="trousDensite" type="range" min="20" max="80" value="40">
              <span id="trousDensiteLabel" class="jp-muted">40 %</span>
            </div>
          </div>
        </section>

        <section class="jp-quiz-admin-panel" aria-labelledby="trousMedsTitle">
          <h2 id="trousMedsTitle" class="jp-quiz-admin-panel-title">Médicaments</h2>
          <div class="jp-quiz-admin-panel-body">
            <div class="jp-field">
              <label for="trousSourceMeds">Source</label>
              <select id="trousSourceMeds">
                <option value="secteur">Par secteur</option>
                <option value="ids">Sélection manuelle</option>
              </select>
            </div>
            <div class="jp-field" id="trousSecteurField">
              <label for="trousSecteur">Secteur</label>
              <select id="trousSecteur">
                <option value="">— choisir —</option>
              </select>
            </div>
            <div class="jp-field" id="trousIdsField" hidden>
              <label for="trousMedsFilter">Filtrer les fiches publiées</label>
              <input id="trousMedsFilter" type="search" placeholder="Nom commercial ou DCI…" autocomplete="off">
              <div class="jp-trous-admin-meds-toolbar">
                <button type="button" class="jp-btn jp-btn-ghost" id="trousBtnMedsAllVisible">Tout cocher (visibles)</button>
                <button type="button" class="jp-btn jp-btn-ghost" id="trousBtnMedsNone">Aucun</button>
                <span id="trousMedsCount" class="jp-muted"></span>
              </div>
              <div id="trousMedsList" class="jp-trous-admin-meds-list" role="group" aria-label="Médicaments publiés"></div>
            </div>
            <div class="jp-field">
              <label for="trousMaxLignes">Nombre max de lignes</label>
              <input id="trousMaxLignes" type="number" min="1" max="100" value="10" required>
            </div>
            <div class="jp-field-actions">
              <button type="button" class="jp-btn jp-btn-ghost" id="trousBtnPreview">Prévisualiser la grille</button>
            </div>
          </div>
        </section>
      </form>

      <div id="trousPreviewWrap" class="jp-quiz-admin-panel" hidden>
        <h2 class="jp-quiz-admin-panel-title">Aperçu</h2>
        <div class="jp-quiz-admin-panel-body">
          <p class="jp-muted" id="trousPreviewHint"></p>
          <div id="trousPreviewGrid" class="jp-table-wrap"></div>
        </div>
      </div>
    </div>

    <div id="createActions" class="jp-jeux-create-actions">
      <div class="jp-quiz-admin-submit">
        <button type="button" class="jp-btn jp-btn-primary" id="btnCreateJeu">Créer le jeu</button>
      </div>

      <div id="resultBox" class="jp-quiz-admin-result" hidden>
        <p class="jp-kicker">Code</p>
        <p id="resultCode" class="jp-quiz-admin-result-code"></p>
        <p id="resultMeta" class="jp-muted"></p>
        <div class="jp-quiz-admin-result-actions">
          <a id="resultPlay" class="jp-btn jp-btn-primary" href="#">Jouer</a>
          <a id="resultPrint" class="jp-btn jp-quiz-admin-btn-print" href="#">Imprimer</a>
        </div>
      </div>
    </div>
  </main>

  <div id="scoresModal" class="jp-scope-modal" hidden role="dialog" aria-modal="true" aria-labelledby="scoresModalTitle">
    <div class="jp-scope-modal-card jp-scores-modal-card">
      <div class="jp-sheet-head">
        <h2 class="jp-scope-modal-title" id="scoresModalTitle">Scores</h2>
        <button type="button" class="jp-icon-btn" id="scoresModalClose" aria-label="Fermer">×</button>
      </div>
      <div id="scoresModalBody"></div>
    </div>
  </div>

  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/profil.js"></script>
  <script src="../js/entites.js"></script>
  <script src="../js/medicaments.js"></script>
  <script src="../js/quizz.js"></script>
  <script src="../js/trous.js"></script>
  <script src="../js/admin-jeux.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      void JpAdminJeux.boot();
    });
  </script>
</body>
</html>
