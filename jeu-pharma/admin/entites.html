<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entités — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Admin</a>
    <p class="jp-kicker">Admin</p>
    <h1 class="jp-title">Entités</h1>
    <p class="jp-sub">Parcourir un type et ajuster les niveaux connus.</p>

    <div class="jp-toolbar">
      <select id="jpType" aria-label="Type d’entité"></select>
      <input type="search" id="jpQ" placeholder="Filtrer…" aria-label="Filtrer">
      <button type="button" class="jp-btn jp-btn-ghost" id="jpBtnRefresh">Actualiser</button>
    </div>

    <div class="jp-panel" style="margin-top:0;padding-top:0;border:0">
      <p class="jp-field-label">Niveaux à appliquer à la sélection</p>
      <div class="jp-niveaux" id="jpBulkNiv"></div>
      <div class="jp-field-actions">
        <button type="button" class="jp-link-btn" id="jpNivAll">Tous</button>
        <button type="button" class="jp-link-btn" id="jpNivNone">Aucun</button>
        <button type="button" class="jp-btn jp-btn-primary" id="jpBtnApply">Appliquer aux cases cochées</button>
      </div>
      <p class="jp-niveaux-warn" id="jpWarnEmpty" hidden>Aucun profil coché — les valeurs sélectionnées seront invisibles aux quiz filtrés.</p>
    </div>

    <div id="jpList" class="jp-table-wrap"></div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/entites.js"></script>
  <script>
    (function () {
      const esc = JpUi.escapeHtml;
      let rows = [];

      function currentTable() {
        return document.getElementById('jpType').value;
      }

      function readBulkNiveaux() {
        return [...document.querySelectorAll('#jpBulkNiv input:checked')].map((c) => c.value);
      }

      function refreshWarn() {
        document.getElementById('jpWarnEmpty').hidden = readBulkNiveaux().length > 0;
      }

      function renderTypeSelect() {
        const sel = document.getElementById('jpType');
        sel.innerHTML = JpConstants.ENTITY_TABLES.map((t) =>
          `<option value="${esc(t.table)}">${esc(t.libelle)}</option>`
        ).join('');
      }

      function renderBulkNiv() {
        document.getElementById('jpBulkNiv').innerHTML = JpConstants.NIVEAUX.map((n) => `
          <label>
            <input type="checkbox" value="${esc(n.code)}" checked>
            ${esc(n.libelle)}
          </label>
        `).join('');
        refreshWarn();
      }

      function renderList() {
        const host = document.getElementById('jpList');
        const q = String(document.getElementById('jpQ').value || '').trim().toLowerCase();
        const filtered = q
          ? rows.filter((r) => String(r.valeur || '').toLowerCase().includes(q))
          : rows;
        if (!filtered.length) {
          JpUi.emptyState(host, {
            title: 'Aucune entité',
            text: 'Créez des valeurs via les fiches médicaments ou l’import CSV.',
          });
          return;
        }
        const nivLib = Object.fromEntries(JpConstants.NIVEAUX.map((n) => [n.code, n.libelle]));
        host.innerHTML = `
          <table class="jp-table">
            <thead>
              <tr>
                <th><input type="checkbox" id="jpCheckAll" aria-label="Tout sélectionner"></th>
                <th>Valeur</th>
                <th>Niveaux</th>
                <th>Actif</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map((r) => `
                <tr>
                  <td><input type="checkbox" class="jp-row-check" value="${esc(r.id)}"></td>
                  <td>${esc(r.valeur)}</td>
                  <td>${esc((r.niveaux_connus || []).map((c) => nivLib[c] || c).join(', ') || '—')}</td>
                  <td>${r.actif ? 'oui' : 'non'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        document.getElementById('jpCheckAll')?.addEventListener('change', (e) => {
          document.querySelectorAll('.jp-row-check').forEach((cb) => {
            cb.checked = e.target.checked;
          });
        });
      }

      async function load() {
        try {
          rows = await JpEntites.list(currentTable(), { actif: null, limit: 500 });
          renderList();
        } catch (e) {
          JpToast.fromError(e);
          void JpLogs.error('entites_list', { message: e?.message });
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        JpUi.bootPage({ module: 'admin-entites', homeHref: JpFab.PORTAIL_URL });
        renderTypeSelect();
        renderBulkNiv();
        load();

        document.getElementById('jpType').addEventListener('change', load);
        document.getElementById('jpBtnRefresh').addEventListener('click', load);
        document.getElementById('jpQ').addEventListener('input', () => {
          clearTimeout(window.__jpEntT);
          window.__jpEntT = setTimeout(renderList, 180);
        });
        document.getElementById('jpBulkNiv').addEventListener('change', refreshWarn);
        document.getElementById('jpNivAll').addEventListener('click', () => {
          document.querySelectorAll('#jpBulkNiv input').forEach((c) => { c.checked = true; });
          refreshWarn();
        });
        document.getElementById('jpNivNone').addEventListener('click', () => {
          document.querySelectorAll('#jpBulkNiv input').forEach((c) => { c.checked = false; });
          refreshWarn();
        });
        document.getElementById('jpBtnApply').addEventListener('click', async () => {
          const ids = [...document.querySelectorAll('.jp-row-check:checked')].map((c) => c.value);
          if (!ids.length) {
            JpToast.warn('Cochez au moins une ligne');
            return;
          }
          const niveaux = readBulkNiveaux();
          try {
            await JpEntites.updateNiveauxBulk(currentTable(), ids, niveaux);
            void JpLogs.action('entites_niveaux_bulk', {
              table: currentTable(),
              count: ids.length,
            });
            JpToast.ok('Niveaux mis à jour (' + ids.length + ')');
            await load();
          } catch (e) {
            JpToast.fromError(e);
            void JpLogs.error('entites_niveaux_bulk', { message: e?.message });
          }
        });
      });
    })();
  </script>
</body>
</html>
