<body>
  <main class="jp-page jp-page-wide" id="accRoot">
    <a class="jp-back" href="index.html">← Admin</a>
    <h1 class="jp-title">Accès<span id="helpAcces"></span></h1>
    <p class="jp-sub">Accordez ou refusez les demandes, puis suivez l’avancement de chaque personne dans son parcours.</p>

    <div class="jp-field">
      <label for="accSearch" class="jp-field-label">Recherche</label>

    <div id="accTabs" class="jp-jx-tabs" role="tablist" aria-label="Accès"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      JpUi.bootPage({ module: 'admin-acces', homeHref: JpFab.PORTAIL_URL });
      document.getElementById('helpAcces').appendChild(JpModal.helpButton('Accès', [
        'Demandes : les joueurs demandent un parcours ; accordez ou refusez ici.',
        'Accès accordés : liste des personnes autorisées avec leur avancement (jeux terminés / jeux actifs, leçons terminées, moyenne).',
        '« Détail » montre le meilleur score par jeu et l’état de chaque leçon. « Retirer l’accès » conserve les scores.',

      ]));
      void JpAdminAcces.boot();
    });
