<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès parcours</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/v2.css">
<link rel="stylesheet" href="../css/studio.css">
</head>
<body>
  <main class="jp-page jp-page-wide">
    <a class="jp-back" href="index.html">←</a>
    <h1 class="jp-title">Accès<span id="helpAcces"></span></h1>
    <div id="list"><p class="jp-muted">…</p></div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/ui-modal.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'admin-acces', homeHref: JpFab.PORTAIL_URL });
      document.getElementById('helpAcces').appendChild(
        JpModal.helpButton('Accès', ['Les joueurs demandent un parcours ; accordez ou refusez ici.'])
      );
      async function refresh() {
        const { data, error } = await JpApp.sbJeu().rpc('v2_lister_demandes_parcours');
        if (error) throw error;
        const rows = Array.isArray(data) ? data : [];
        const list = document.getElementById('list');
        if (!rows.length) {
          list.innerHTML = '<p class="jp-muted">Aucune demande</p>';
          return;
        }
        list.innerHTML = '<table class="jp-table"><thead><tr><th>Joueur</th><th>Parcours</th><th></th></tr></thead><tbody>'
          + rows.map(function (r) {
            return '<tr><td>' + JpUi.escapeHtml(r.display_name || r.user_id) + '</td><td>'
              + JpUi.escapeHtml(r.libelle) + '</td><td>'
              + '<button type="button" class="jp-btn jp-btn-primary" data-ok="' + r.id + '">Accorder</button> '
              + '<button type="button" class="jp-btn jp-btn-ghost" data-no="' + r.id + '">Refuser</button></td></tr>';
          }).join('') + '</tbody></table>';
        list.querySelectorAll('[data-ok]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            try {
              await JpApp.sbJeu().rpc('v2_traiter_demande_parcours', { p_id: btn.getAttribute('data-ok'), p_statut: 'accepte' });
              JpToast.ok('Accordé');
              await refresh();
            } catch (e) { JpToast.fromError(e); }
          });
        });
        list.querySelectorAll('[data-no]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            try {
              await JpApp.sbJeu().rpc('v2_traiter_demande_parcours', { p_id: btn.getAttribute('data-no'), p_statut: 'refuse' });
              JpToast.ok('Refusé');
              await refresh();
            } catch (e) { JpToast.fromError(e); }
          });
        });
      }
      try { await refresh(); } catch (e) { JpToast.fromError(e); }
    });
  </script>
</body>
</html>
