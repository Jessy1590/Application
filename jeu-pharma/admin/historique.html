<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Historique — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Admin</a>
    <p class="jp-kicker">Admin</p>
    <h1 class="jp-title">Historique</h1>
    <p class="jp-sub">Modifications de contenu (audit).</p>

    <div class="jp-toolbar">
      <select id="jpTable" aria-label="Table">
        <option value="">Toutes les tables</option>
      </select>
      <select id="jpOp" aria-label="Opération">
        <option value="">Toutes opérations</option>
        <option value="insert">insert</option>
        <option value="update">update</option>
        <option value="delete">delete</option>
      </select>
      <button type="button" class="jp-btn jp-btn-ghost" id="jpRefresh">Actualiser</button>
    </div>

    <div id="jpList" class="jp-table-wrap"></div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/medicaments.js"></script>
  <script>
    (function () {
      const esc = JpUi.escapeHtml;

      function fmtDate(iso) {
        if (!iso) return '—';
        try {
          return new Date(iso).toLocaleString('fr-FR');
        } catch (_) {
          return String(iso);
        }
      }

      function summarize(etat) {
        if (!etat || typeof etat !== 'object') return '—';
        if (etat.valeur) return String(etat.valeur).slice(0, 80);
        if (etat.statut) return 'statut=' + etat.statut;
        if (etat.nom_commercial_id || etat.dci_id) {
          return 'fiche ' + String(etat.id || '').slice(0, 8);
        }
        return JSON.stringify(etat).slice(0, 80);
      }

      function render(rows) {
        const host = document.getElementById('jpList');
        if (!rows.length) {
          JpUi.emptyState(host, {
            title: 'Aucun historique',
            text: 'Les modifications de contenu apparaîtront ici.',
          });
          return;
        }
        host.innerHTML = `
          <table class="jp-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Table</th>
                <th>Op.</th>
                <th>Résumé</th>
                <th>État</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r) => `
                <tr>
                  <td>${esc(fmtDate(r.created_at))}</td>
                  <td>${esc(r.table_name)}</td>
                  <td><span class="jp-badge">${esc(r.operation)}</span></td>
                  <td>${esc(summarize(r.nouvel_etat || r.ancien_etat))}</td>
                  <td>${esc(r.etat)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      async function load() {
        try {
          const rows = await JpMedicaments.listHistorique({
            table_name: document.getElementById('jpTable').value || null,
            operation: document.getElementById('jpOp').value || null,
            limit: 150,
          });
          render(rows);
        } catch (e) {
          JpToast.fromError(e);
          void JpLogs.error('historique_list', { message: e?.message });
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        JpUi.bootPage({ module: 'admin-historique', homeHref: JpFab.PORTAIL_URL });
        const tables = [
          'matrice_medicaments',
          ...JpConstants.ENTITY_TABLES.map((t) => t.table),
        ];
        const sel = document.getElementById('jpTable');
        sel.innerHTML += tables.map((t) =>
          `<option value="${esc(t)}">${esc(t)}</option>`
        ).join('');
        load();
        sel.addEventListener('change', load);
        document.getElementById('jpOp').addEventListener('change', load);
        document.getElementById('jpRefresh').addEventListener('click', load);
      });
    })();
  </script>
</body>
</html>
