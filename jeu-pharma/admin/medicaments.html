<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Médicaments — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page jp-page-wide">
    <a class="jp-back" href="index.html">← Admin</a>
    <p class="jp-kicker">Admin</p>
    <h1 class="jp-title">Médicaments</h1>
    <p class="jp-sub">Liste filtrable + édition côte à côte (plein écran). Contenu issu des cours.</p>

    <div class="jp-med-filters" role="search" aria-label="Filtres catalogue">
      <label>Recherche
        <input type="search" id="jpFilterQ" placeholder="Nom, DCI, secteur, classe…" autocomplete="off">
      </label>
      <label>Statut
        <select id="jpFilterStatut">
          <option value="">Tous</option>
          <option value="brouillon">Brouillon</option>
          <option value="publie">Publié</option>
          <option value="archive">Archivé</option>
        </select>
      </label>
      <label>Secteur
        <select id="jpFilterSecteur">
          <option value="">Tous</option>
        </select>
      </label>
      <label>Classe thérapeutique
        <select id="jpFilterClasseTh">
          <option value="">Toutes</option>
        </select>
      </label>
      <label>Classe pharmaco.
        <select id="jpFilterClassePh">
          <option value="">Toutes</option>
        </select>
      </label>
      <div class="jp-med-filters-actions">
        <label style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--jp-text);display:inline-flex;align-items:center;gap:0.4rem;margin:0">
          <input type="checkbox" id="jpFilterIncomplet"> Incomplètes
        </label>
        <button type="button" class="jp-btn jp-btn-ghost" id="jpBtnResetFiltres">Réinitialiser</button>
        <button type="button" class="jp-btn jp-btn-primary" id="jpBtnNew">Nouvelle fiche</button>
      </div>
    </div>

    <div class="jp-med-workspace" id="jpWorkspace">
      <aside class="jp-med-listpane" aria-label="Liste des fiches">
        <div class="jp-med-listmeta">
          <span id="jpListCount">—</span>
          <a class="jp-link-btn" href="import-export.html">Import CSV</a>
        </div>
        <div id="jpList" class="jp-table-wrap"></div>
      </aside>

      <section id="jpEditor" class="jp-med-editor" hidden aria-label="Édition fiche">
        <div class="jp-med-editor-head">
          <h2 class="jp-title" id="jpEditorTitle">Nouvelle fiche</h2>
          <div class="jp-field" style="margin:0;min-width:9rem">
            <label class="jp-sr-only" for="jpStatut">Statut</label>
            <select id="jpStatut" name="statut" aria-label="Statut de la fiche">
              <option value="brouillon">Brouillon</option>
              <option value="publie">Publié</option>
              <option value="archive">Archivé</option>
            </select>
          </div>
        </div>
        <div class="jp-med-editor-body">
          <div class="jp-bdm-panel" id="jpBdmPanel" aria-label="Recherche BDPM">
            <p class="jp-bdm-title">Ajouter depuis la BDPM</p>
            <label class="jp-bdm-search-label" for="jpBdmQ">Recherche
              <input type="search" id="jpBdmQ" placeholder="Nom, DCI, CIP…" autocomplete="off">
            </label>
            <div id="jpBdmResults" class="jp-bdm-results" hidden role="listbox" aria-label="Résultats BDPM"></div>
            <p class="jp-bdm-licence">Source BDPM ANSM — Licence Ouverte</p>
          </div>
          <form id="jpForm" class="jp-form" novalidate>
            <div id="jpFields"></div>
          </form>
        </div>
        <div class="jp-med-editor-foot">
          <button type="button" class="jp-btn jp-btn-ghost" id="jpBtnCancel">Fermer</button>
          <button type="submit" form="jpForm" class="jp-btn jp-btn-primary" id="jpBtnSave">Enregistrer</button>
        </div>
      </section>
    </div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/bdm.js"></script>
  <script src="../js/entites.js"></script>
  <script src="../js/medicaments.js"></script>
  <script>
    (function () {
      const esc = JpUi.escapeHtml;
      let editingId = null;
      let allRows = [];
      let filtered = [];

      const NIVEAU_SHORT = {
        apprenti: 'App',
        pharmacien: 'Ph',
        preparatrice: 'Prép',
        etu_3a: '3A',
        etu_4a: '4A',
        etu_6a: '6A',
      };

      const SECTIONS = [
        {
          id: 'identite',
          title: 'Identité',
          codes: ['nom_commercial', 'dci', 'secteur_therapeutique', 'voies_administration'],
        },
        {
          id: 'classes',
          title: 'Classes & pharmacologie',
          codes: ['classe_therapeutique', 'classe_pharmacologique', 'detail_pharmacologie', 'posologie_generale'],
        },
        {
          id: 'indications',
          title: 'Indications & sécurité',
          codes: ['indications', 'contre_indications', 'effets_indesirables', 'precautions_emploi'],
        },
        {
          id: 'autres',
          title: 'Interactions, surveillance, grossesse',
          codes: ['interactions', 'surveillances', 'grossesse_allaitement'],
        },
      ];

      function allNiveauxCodes() {
        return (JpConstants.NIVEAUX || []).map((n) => n.code);
      }

      function champByCode(code) {
        return (JpConstants.CHAMP_CODES || []).find((c) => c.code === code);
      }

      function niveauxHtml(name, selected) {
        const sel = new Set(selected || []);
        const boxes = JpConstants.NIVEAUX.map((n) => {
          const short = NIVEAU_SHORT[n.code] || n.code;
          return `
            <label title="${esc(n.libelle)}">
              <input type="checkbox" name="${esc(name)}" value="${esc(n.code)}" ${sel.has(n.code) ? 'checked' : ''}>
              ${esc(short)}
            </label>
          `;
        }).join('');
        return `
          <div class="jp-med-niveaux-compact" data-niveaux="${esc(name)}">${boxes}</div>
          <div class="jp-field-actions">
            <button type="button" class="jp-link-btn" data-niv-all="${esc(name)}">Tous</button>
            <button type="button" class="jp-link-btn" data-niv-none="${esc(name)}">Aucun</button>
          </div>
          <p class="jp-niveaux-warn" hidden data-warn="${esc(name)}">Aucun profil — invisible aux quiz filtrés.</p>
        `;
      }

      function fieldCardHtml(c) {
        const span = c.card === 'N' || c.code === 'detail_pharmacologie' || c.code === 'posologie_generale' || c.code === 'grossesse_allaitement'
          ? ' jp-field-span-2'
          : '';
        if (c.card === 1) {
          return `
            <div class="jp-med-field-card${span}" data-champ="${esc(c.code)}" data-card="1">
              <label for="val_${esc(c.code)}">${esc(c.libelle)}</label>
              <input type="text" id="val_${esc(c.code)}" name="val_${esc(c.code)}" list="dl_${esc(c.code)}" autocomplete="off" data-entity-id="">
              <datalist id="dl_${esc(c.code)}"></datalist>
              <span class="jp-field-label">Niveaux</span>
              ${niveauxHtml('niv_' + c.code, allNiveauxCodes())}
            </div>
          `;
        }
        return `
          <div class="jp-med-field-card${span}" data-champ="${esc(c.code)}" data-card="N">
            <label for="val_${esc(c.code)}">${esc(c.libelle)} <span class="jp-muted">(une valeur / ligne)</span></label>
            <textarea id="val_${esc(c.code)}" name="val_${esc(c.code)}" rows="3"></textarea>
            <span class="jp-field-label">Niveaux (toutes les lignes)</span>
            ${niveauxHtml('niv_' + c.code, allNiveauxCodes())}
          </div>
        `;
      }

      function buildFields() {
        const host = document.getElementById('jpFields');
        const used = new Set();
        const parts = [];
        for (const sec of SECTIONS) {
          const cards = [];
          for (const code of sec.codes) {
            const c = champByCode(code);
            if (!c || used.has(code)) continue;
            used.add(code);
            cards.push(fieldCardHtml(c));
          }
          if (!cards.length) continue;
          parts.push(`
            <section class="jp-med-section" data-section="${esc(sec.id)}">
              <h3 class="jp-med-section-title">${esc(sec.title)}</h3>
              <div class="jp-med-grid">${cards.join('')}</div>
            </section>
          `);
        }
        for (const c of JpConstants.CHAMP_CODES) {
          if (used.has(c.code)) continue;
          parts.push(`
            <section class="jp-med-section">
              <h3 class="jp-med-section-title">${esc(c.libelle)}</h3>
              <div class="jp-med-grid">${fieldCardHtml(c)}</div>
            </section>
          `);
        }
        host.innerHTML = parts.join('');
        host.addEventListener('click', onNivClick);
        host.addEventListener('change', refreshWarns);
        host.querySelectorAll('input[data-entity-id]').forEach((inp) => {
          inp.addEventListener('input', () => { inp.dataset.entityId = ''; });
        });
      }

      function onNivClick(e) {
        const all = e.target.getAttribute('data-niv-all');
        const none = e.target.getAttribute('data-niv-none');
        const name = all || none;
        if (!name) return;
        e.preventDefault();
        document.querySelectorAll(`input[name="${name}"]`).forEach((cb) => {
          cb.checked = !!all;
        });
        refreshWarns();
      }

      function refreshWarns() {
        document.querySelectorAll('[data-warn]').forEach((el) => {
          const name = el.getAttribute('data-warn');
          const any = [...document.querySelectorAll(`input[name="${name}"]:checked`)].length > 0;
          el.hidden = any;
        });
      }

      function readNiveaux(name) {
        return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((c) => c.value);
      }

      function setNiveaux(name, codes) {
        const set = new Set(codes || []);
        document.querySelectorAll(`input[name="${name}"]`).forEach((cb) => {
          cb.checked = set.has(cb.value);
        });
      }

      function uniqueSorted(values) {
        return [...new Set(values.filter(Boolean))].sort((a, b) =>
          String(a).localeCompare(String(b), 'fr', { sensitivity: 'base' })
        );
      }

      function fillSelect(sel, values, allLabel) {
        const current = sel.value;
        sel.innerHTML = `<option value="">${esc(allLabel)}</option>`
          + values.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
        if (current && values.includes(current)) sel.value = current;
        else sel.value = '';
      }

      function syncFilterOptions() {
        fillSelect(
          document.getElementById('jpFilterSecteur'),
          uniqueSorted(allRows.map((r) => r.secteur_therapeutique)),
          'Tous'
        );
        fillSelect(
          document.getElementById('jpFilterClasseTh'),
          uniqueSorted(allRows.map((r) => r.classe_therapeutique)),
          'Toutes'
        );
        fillSelect(
          document.getElementById('jpFilterClassePh'),
          uniqueSorted(allRows.map((r) => r.classe_pharmacologique)),
          'Toutes'
        );
      }

      function isIncomplet(r) {
        return !r.nom_commercial || !r.dci || !r.secteur_therapeutique;
      }

      function applyFilters() {
        const q = document.getElementById('jpFilterQ').value.trim().toLowerCase();
        const statut = document.getElementById('jpFilterStatut').value;
        const secteur = document.getElementById('jpFilterSecteur').value;
        const clTh = document.getElementById('jpFilterClasseTh').value;
        const clPh = document.getElementById('jpFilterClassePh').value;
        const incompletes = document.getElementById('jpFilterIncomplet').checked;

        filtered = allRows.filter((r) => {
          if (statut && r.statut !== statut) return false;
          if (secteur && r.secteur_therapeutique !== secteur) return false;
          if (clTh && r.classe_therapeutique !== clTh) return false;
          if (clPh && r.classe_pharmacologique !== clPh) return false;
          if (incompletes && !isIncomplet(r)) return false;
          if (q) {
            const blob = [
              r.nom_commercial,
              r.dci,
              r.secteur_therapeutique,
              r.classe_therapeutique,
              r.classe_pharmacologique,
              r.detail_pharmacologie,
            ]
              .filter(Boolean)
              .join(' ')
              .toLowerCase();
            if (!blob.includes(q)) return false;
          }
          return true;
        });
        renderList(filtered);
      }

      async function loadDatalists() {
        for (const c of JpConstants.CHAMP_CODES.filter((x) => x.card === 1)) {
          const dl = document.getElementById('dl_' + c.code);
          if (!dl) continue;
          try {
            const rows = await JpEntites.list(c.table, { actif: true, limit: 500 });
            dl.innerHTML = rows.map((r) => `<option value="${esc(r.valeur)}"></option>`).join('');
          } catch (_) { /* ignore */ }
        }
      }

      function setEditingMode(on) {
        document.getElementById('jpWorkspace').classList.toggle('is-editing', !!on);
        document.getElementById('jpEditor').hidden = !on;
      }

      function resetForm() {
        editingId = null;
        document.getElementById('jpEditorTitle').textContent = 'Nouvelle fiche';
        document.getElementById('jpStatut').value = 'brouillon';
        for (const c of JpConstants.CHAMP_CODES) {
          const input = document.getElementById('val_' + c.code);
          if (input) {
            input.value = '';
            if (c.card === 1) input.dataset.entityId = '';
          }
          setNiveaux('niv_' + c.code, allNiveauxCodes());
        }
        refreshWarns();
      }

      function openEditor(row) {
        setEditingMode(true);
        if (!row) {
          resetForm();
          highlightRow(null);
          document.getElementById('val_nom_commercial')?.focus();
          return;
        }
        editingId = row.id;
        document.getElementById('jpEditorTitle').textContent =
          row.nom_commercial || row.dci || 'Modifier la fiche';
        document.getElementById('jpStatut').value = row.statut || 'brouillon';
        for (const c of JpConstants.CHAMP_CODES) {
          const input = document.getElementById('val_' + c.code);
          if (!input) continue;
          if (c.card === 1) {
            input.value = row[c.code] || '';
            input.dataset.entityId = row[c.fk] || '';
            const nivKey =
              c.code === 'nom_commercial' ? 'nom_commercial_niveaux'
              : c.code === 'dci' ? 'dci_niveaux'
              : c.code === 'secteur_therapeutique' ? 'secteur_niveaux'
              : c.code === 'classe_therapeutique' ? 'classe_therapeutique_niveaux'
              : c.code === 'classe_pharmacologique' ? 'classe_pharmacologique_niveaux'
              : null;
            setNiveaux('niv_' + c.code, nivKey ? (row[nivKey] || []) : allNiveauxCodes());
          } else {
            const arr = Array.isArray(row[c.code]) ? row[c.code] : [];
            input.value = arr.map((x) => x.valeur || x).join('\n');
            setNiveaux('niv_' + c.code, allNiveauxCodes());
          }
        }
        refreshWarns();
        highlightRow(row.id);
      }

      function closeEditor() {
        setEditingMode(false);
        editingId = null;
        highlightRow(null);
      }

      function highlightRow(id) {
        document.querySelectorAll('#jpList tbody tr').forEach((tr) => {
          tr.classList.toggle('is-selected', tr.getAttribute('data-id') === id);
        });
      }

      function collectPayload() {
        const singular = {};
        const multi = {};
        for (const c of JpConstants.CHAMP_CODES) {
          const niveaux = readNiveaux('niv_' + c.code);
          const raw = document.getElementById('val_' + c.code)?.value;
          if (raw == null) continue;
          if (c.card === 1) {
            const v = String(raw || '').trim();
            const input = document.getElementById('val_' + c.code);
            if (v) {
              singular[c.code] = {
                valeur: v,
                niveaux_connus: niveaux,
                id: input.dataset.entityId || undefined,
              };
            }
          } else {
            const lines = String(raw || '')
              .split(/\n/)
              .map((s) => s.trim())
              .filter(Boolean);
            multi[c.code] = lines.map((valeur) => ({ valeur, niveaux_connus: niveaux }));
          }
        }
        return {
          statut: document.getElementById('jpStatut').value,
          singular,
          multi,
        };
      }

      function renderList(rows) {
        const host = document.getElementById('jpList');
        const count = document.getElementById('jpListCount');
        count.textContent = rows.length + ' / ' + allRows.length + ' fiche'
          + (allRows.length > 1 ? 's' : '');

        if (!rows.length) {
          JpUi.emptyState(host, {
            title: allRows.length ? 'Aucun résultat' : 'Aucune fiche',
            text: allRows.length
              ? 'Élargissez ou réinitialisez les filtres.'
              : 'Ajoutez les médicaments vus en cours, ou importez un CSV.',
            actionHref: allRows.length ? null : 'import-export.html',
            actionLabel: allRows.length ? null : 'Import CSV',
          });
          return;
        }
        host.innerHTML = `
          <table class="jp-table">
            <thead>
              <tr>
                <th>Nom</th>
                <th>DCI</th>
                <th>Secteur</th>
                <th>Cl. thér.</th>
                <th>Cl. pharma</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r) => `
                <tr data-id="${esc(r.id)}" class="${r.id === editingId ? 'is-selected' : ''}" tabindex="0">
                  <td class="jp-med-cell-wrap">${esc(r.nom_commercial || '—')}</td>
                  <td class="jp-med-cell-wrap">${esc(r.dci || '—')}</td>
                  <td class="jp-med-cell-wrap">${esc(r.secteur_therapeutique || '—')}</td>
                  <td class="jp-med-cell-wrap">${esc(r.classe_therapeutique || '—')}</td>
                  <td class="jp-med-cell-wrap">${esc(r.classe_pharmacologique || '—')}</td>
                  <td><span class="jp-badge jp-badge-${esc(r.statut)}">${esc(r.statut)}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      async function refreshAll() {
        try {
          allRows = await JpMedicaments.list({});
          syncFilterOptions();
          applyFilters();
        } catch (e) {
          JpToast.fromError(e);
          void JpLogs.error('medicaments_list', { message: e?.message });
        }
      }

      function bindFilters() {
        const ids = [
          'jpFilterQ', 'jpFilterStatut', 'jpFilterSecteur',
          'jpFilterClasseTh', 'jpFilterClassePh', 'jpFilterIncomplet',
        ];
        ids.forEach((id) => {
          const el = document.getElementById(id);
          const ev = el.type === 'search' || el.type === 'text' ? 'input' : 'change';
          el.addEventListener(ev, () => {
            if (ev === 'input') {
              clearTimeout(window.__jpMedT);
              window.__jpMedT = setTimeout(applyFilters, 180);
            } else {
              applyFilters();
            }
          });
        });
        document.getElementById('jpBtnResetFiltres').addEventListener('click', () => {
          document.getElementById('jpFilterQ').value = '';
          document.getElementById('jpFilterStatut').value = '';
          document.getElementById('jpFilterSecteur').value = '';
          document.getElementById('jpFilterClasseTh').value = '';
          document.getElementById('jpFilterClassePh').value = '';
          document.getElementById('jpFilterIncomplet').checked = false;
          applyFilters();
        });
      }

      let bdmRows = [];
      let bdmReq = 0;

      function clearBdmResults() {
        bdmRows = [];
        const host = document.getElementById('jpBdmResults');
        host.innerHTML = '';
        host.hidden = true;
      }

      function renderBdmResults(rows) {
        const host = document.getElementById('jpBdmResults');
        bdmRows = rows || [];
        if (!bdmRows.length) {
          host.innerHTML = '<p class="jp-bdm-empty">Aucun résultat</p>';
          host.hidden = false;
          return;
        }
        host.innerHTML = bdmRows.map((r, i) => `
          <button type="button" class="jp-bdm-result" role="option" data-bdm-idx="${i}">
            <span class="jp-bdm-result-name">${esc(r.denomination || '—')}</span>
            <span class="jp-bdm-result-meta">${esc(r.substances || '—')}</span>
            <span class="jp-bdm-result-forme">${esc(r.forme_pharmaceutique || '')}</span>
          </button>
        `).join('');
        host.hidden = false;
      }

      function applyBdmPrefill(row) {
        const pre = JpBdm.pickToPrefill(row);
        const nom = document.getElementById('val_nom_commercial');
        const dci = document.getElementById('val_dci');
        if (nom) {
          nom.value = pre.nom_commercial;
          nom.dataset.entityId = '';
        }
        if (dci) {
          dci.value = pre.dci;
          dci.dataset.entityId = '';
        }
        clearBdmResults();
        document.getElementById('jpBdmQ').value = '';
        JpToast.ok('Prérempli — compléter le reste depuis le cours');
      }

      function bindBdmSearch() {
        const input = document.getElementById('jpBdmQ');
        const results = document.getElementById('jpBdmResults');
        input.addEventListener('input', () => {
          clearTimeout(window.__jpBdmT);
          const q = input.value.trim();
          if (q.length < 2) {
            clearBdmResults();
            return;
          }
          window.__jpBdmT = setTimeout(async () => {
            const req = ++bdmReq;
            try {
              const rows = await JpBdm.searchProducts(q, 20);
              if (req !== bdmReq) return;
              renderBdmResults(rows);
            } catch (e) {
              if (req !== bdmReq) return;
              clearBdmResults();
              JpToast.fromError(e);
              void JpLogs.error('bdm_search', { message: e?.message });
            }
          }, 280);
        });
        results.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-bdm-idx]');
          if (!btn) return;
          const idx = Number(btn.getAttribute('data-bdm-idx'));
          const row = bdmRows[idx];
          if (row) applyBdmPrefill(row);
        });
      }

      document.addEventListener('DOMContentLoaded', async function () {
        JpUi.bootPage({ module: 'admin-medicaments', homeHref: JpFab.PORTAIL_URL });
        buildFields();
        bindFilters();
        bindBdmSearch();
        await loadDatalists();
        await refreshAll();

        document.getElementById('jpBtnNew').addEventListener('click', () => openEditor(null));
        document.getElementById('jpBtnCancel').addEventListener('click', closeEditor);
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !document.getElementById('jpEditor').hidden) {
            closeEditor();
          }
        });

        document.getElementById('jpList').addEventListener('click', (e) => {
          const tr = e.target.closest('tr[data-id]');
          if (!tr) return;
          const row = allRows.find((r) => r.id === tr.getAttribute('data-id'));
          if (row) openEditor(row);
        });
        document.getElementById('jpList').addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          const tr = e.target.closest('tr[data-id]');
          if (!tr) return;
          e.preventDefault();
          const row = allRows.find((r) => r.id === tr.getAttribute('data-id'));
          if (row) openEditor(row);
        });

        document.getElementById('jpForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = document.getElementById('jpBtnSave');
          btn.disabled = true;
          try {
            const saved = await JpMedicaments.save(collectPayload(), editingId);
            JpToast.ok('Fiche enregistrée');
            await refreshAll();
            await loadDatalists();
            const row = allRows.find((r) => r.id === (saved?.id || editingId));
            if (row) openEditor(row);
            else closeEditor();
          } catch (err) {
            JpToast.fromError(err);
            void JpLogs.error('medicament_save', { message: err?.message });
          } finally {
            btn.disabled = false;
          }
        });
      });
    })();
  </script>
</body>
</html>
