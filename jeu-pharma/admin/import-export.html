<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/v2.css">
<link rel="stylesheet" href="../css/studio.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="referentiel.html">←</a>
    <h1 class="jp-title">CSV<span id="helpCsv"></span></h1>
    <div class="jp-field">
      <label for="file">Import connaissances (CSV : matrice_id;champ_code;texte)</label>
      <input id="file" type="file" accept=".csv,text/csv">
    </div>
    <button type="button" class="jp-btn jp-btn-primary" id="btnImport">Importer</button>
    <pre id="log" class="jp-muted" style="margin-top:1rem;white-space:pre-wrap"></pre>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/ui-modal.js"></script>
  <script src="../js/fab.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      JpUi.bootPage({ module: 'admin-csv', homeHref: 'index.html' });
      document.getElementById('helpCsv').appendChild(
        JpModal.helpButton('CSV', ['Import manuel de lignes connaissance (statut a_valider).', 'Colonnes : matrice_id;champ_code;texte'])
      );
      document.getElementById('btnImport').addEventListener('click', async function () {
        const f = document.getElementById('file').files?.[0];
        const log = document.getElementById('log');
        if (!f) return JpToast.warn('Fichier requis');
        const text = await f.text();
        const lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
        let ok = 0, ko = 0;
        const user = await JpApp.getUser();
        for (let i = 0; i < lines.length; i++) {
          if (i === 0 && /matrice_id/i.test(lines[i])) continue;
          const parts = lines[i].split(';');
          if (parts.length < 3) { ko++; continue; }
          const row = {
            matrice_id: parts[0].trim(),
            champ_code: parts[1].trim(),
            texte: parts.slice(2).join(';').trim(),
            texte_norm: parts.slice(2).join(';').trim().toLowerCase(),
            statut: 'a_valider',
            created_by: user?.id || null,
          };
          const { error } = await JpApp.sbJeu().from('connaissances').insert(row);
          if (error) ko++; else ok++;
        }
        log.textContent = 'OK ' + ok + ' · erreurs ' + ko;
        JpToast.ok('Import terminé');
      });
    });
  </script>
</body>
</html>
