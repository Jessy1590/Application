<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sources — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/v2.css?v=028">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Admin</a>
    <p class="jp-kicker">Sources</p>
    <h1 class="jp-title">Sources de contenu</h1>
    <section class="jp-quiz-admin-panel" style="margin-bottom:1.5rem">
      <div class="jp-quiz-admin-panel-body">
        <div class="jp-split jp-split-2">
          <div class="jp-field"><label for="srcCode">Code</label><input id="srcCode" required></div>
          <div class="jp-field"><label for="srcLibelle">Libellé</label><input id="srcLibelle" required></div>
        </div>
        <div class="jp-field">
          <label for="srcType">Type</label>
          <select id="srcType">
            <option value="cours">Cours</option>
            <option value="rcp">RCP</option>
            <option value="referentiel">Référentiel</option>
            <option value="migration_v1">Migration V1</option>
          </select>
        </div>
        <div class="jp-field"><label for="srcDesc">Description</label><textarea id="srcDesc" rows="2"></textarea></div>
        <div class="jp-v2-actions">
          <button type="button" class="jp-btn jp-btn-primary" id="btnCreate">Créer la source</button>
          <button type="button" class="jp-btn jp-btn-ghost" id="btnBackfill">Relancer backfill V1 → connaissances</button>
        </div>
      </div>
    </section>
    <div id="list"></div>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { void JpV2Admin.bootSources(); });</script>
</body>
</html>
