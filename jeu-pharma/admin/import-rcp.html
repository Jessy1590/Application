<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Import RCP — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/v2.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Admin</a>
    <p class="jp-kicker">Import RCP</p>
    <h1 class="jp-title">Sas de validation</h1>
    <p class="jp-sub">Les items importés restent en <strong>a_valider</strong>. Aucune publication automatique vers les parcours apprenants.</p>

    <div class="jp-v2-banner">
      Collez un JSON d’items <code>{ matrice_id, champ_code, texte, entite_id? }</code>.
      Après import : valider dans Référentiel, puis publier dans un module Parcours.
    </div>

    <div class="jp-field"><label for="srcCode">Code source</label><input id="srcCode" value="rcp_manuel"></div>
    <div class="jp-field"><label for="srcLibelle">Libellé source</label><input id="srcLibelle" value="Import RCP manuel"></div>
    <div class="jp-field"><label for="versionLabel">Version</label><input id="versionLabel" placeholder="ex. 2026-10-11"></div>
    <div class="jp-field"><label for="refExt">Référence externe</label><input id="refExt" placeholder="CIS / URL / lot"></div>
    <div class="jp-field"><label for="payload">Items JSON (tableau)</label>
      <textarea id="payload" rows="12" placeholder='[{"matrice_id":"...","champ_code":"indications","texte":"HTA"}]'></textarea>
    </div>
    <button type="button" class="jp-btn jp-btn-primary" id="btnImport">Importer dans le sas</button>
    <pre id="result" class="jp-muted" style="margin-top:1rem;white-space:pre-wrap"></pre>
  </main>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/import-rcp.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      JpUi.bootPage({ module: 'admin-import-rcp', homeHref: 'index.html' });
      document.getElementById('versionLabel').value = new Date().toISOString().slice(0, 10);
      document.getElementById('btnImport').addEventListener('click', async function () {
        try {
          const items = JSON.parse(document.getElementById('payload').value || '[]');
          if (!Array.isArray(items)) throw new Error('Le JSON doit être un tableau');
          const res = await JpV2ImportRcp.importerVersSas({
            source_code: document.getElementById('srcCode').value,
            source_libelle: document.getElementById('srcLibelle').value,
            version_label: document.getElementById('versionLabel').value,
            reference_externe: document.getElementById('refExt').value,
            items: items,
          });
          document.getElementById('result').textContent = JSON.stringify(res, null, 2);
          JpToast.ok('Import terminé : ' + res.inserted + ' créées, ' + res.skipped + ' ignorées');
        } catch (e) {
          JpToast.fromError(e);
          document.getElementById('result').textContent = e.message || String(e);
        }
      });
    });
  </script>
</body>
</html>
