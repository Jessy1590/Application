<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Suivi — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page" id="jpSuiviRoot">
    <a class="jp-back" href="index.html">← Admin</a>
    <p class="jp-kicker">Admin</p>
    <h1 class="jp-title">Suivi</h1>
    <p class="jp-sub">Scores, réussite et activité (quiz, tableau à trous et fiche aléatoire).</p>

    <div class="jp-filters" role="search">
      <label>Période
        <select id="jpSuiviPeriod">
          <option value="7">7 jours</option>
          <option value="30" selected>30 jours</option>
          <option value="90">90 jours</option>
          <option value="all">Tout</option>
        </select>
      </label>
      <label>Type
        <select id="jpSuiviType">
          <option value="tous" selected>Tous</option>
          <option value="quiz">Quiz</option>
          <option value="trous">Trous</option>
          <option value="fiche">Fiche aléatoire</option>
        </select>
      </label>
      <label>Activité
        <select id="jpSuiviItem">
          <option value="">Toutes les activités</option>
        </select>
      </label>
      <label>Réussite par
        <select id="jpSuiviGroup">
          <option value="item" selected>Activité</option>
          <option value="secteur">Secteur</option>
        </select>
      </label>
    </div>
    <p class="jp-meta" id="jpSuiviMeta" aria-live="polite"></p>

    <div id="jpSuiviEmpty" class="jp-empty" hidden>
      <strong>Aucune donnée</strong>
      <p>Pas de tentatives sur la période filtrée.</p>
    </div>

    <div id="jpSuiviCharts" class="jp-charts" hidden>
      <section class="jp-chart-block" aria-labelledby="jpChartScoreTitle">
        <h2 id="jpChartScoreTitle" class="jp-chart-title">Score moyen</h2>
        <div class="jp-chart-wrap">
          <canvas id="jpChartScore" aria-label="Évolution du score moyen"></canvas>
        </div>
      </section>
      <section class="jp-chart-block" aria-labelledby="jpChartSuccessTitle">
        <h2 id="jpChartSuccessTitle" class="jp-chart-title">Taux de réussite</h2>
        <div class="jp-chart-wrap">
          <canvas id="jpChartSuccess" aria-label="Taux de réussite par activité ou secteur"></canvas>
        </div>
      </section>
      <section class="jp-chart-block" aria-labelledby="jpChartActivityTitle">
        <h2 id="jpChartActivityTitle" class="jp-chart-title">Activité</h2>
        <div class="jp-chart-wrap">
          <canvas id="jpChartActivity" aria-label="Tentatives et utilisateurs actifs"></canvas>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/charts-admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      JpUi.bootPage({ module: 'admin-suivi', homeHref: JpFab.PORTAIL_URL });
      JpChartsAdmin.mount(document.getElementById('jpSuiviRoot'));
    });
  </script>
</body>
</html>
