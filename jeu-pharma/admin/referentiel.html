<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Référentiel — Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID, { requireAdmin: true });</script>
<link rel="stylesheet" href="../css/app.css?v=059">
<link rel="stylesheet" href="../css/v2.css?v=071">
<link rel="stylesheet" href="../IA/ia.css?v=046">
</head>
<body>
  <main class="jp-page jp-page-wide jp-catalogue jp-admin-catalogue">
    <a class="jp-back" href="index.html">← Admin</a>
    <h1 class="jp-title">Référentiel<span id="helpRef"></span></h1>

    <div class="jp-admin-cat-actions">
      <button type="button" class="jp-btn jp-btn-primary" id="btnNew">Nouvelle fiche</button>
      <button type="button" class="jp-btn jp-btn-ia" id="btnIa" title="Proposer une fiche depuis le RCP (BDPM)">IA</button>
      <button type="button" class="jp-btn jp-btn-ghost" id="btnComparaison" title="Comparer les molécules d’un parcours / chapitre / leçon">Comparaison</button>
      <button type="button" class="jp-btn jp-btn-ghost" id="btnValider">Valider fiches</button>
      <span class="jp-admin-cat-validation-count jp-muted" id="valCount" aria-live="polite"></span>
    </div>

    <div class="jp-catalogue-toolbar" id="toolbar" hidden>
      <input type="search" id="q" class="jp-catalogue-search" placeholder="Nom, DCI, classe…  ( / )" aria-label="Rechercher" autocomplete="off">
      <div class="jp-catalogue-actions">
        <span class="jp-catalogue-count" id="refCount" aria-live="polite"></span>
        <label class="jp-admin-cat-statut">
          <span class="jp-sr-only">Statut</span>
          <select id="fStatut" aria-label="Statut">
            <option value="">Statut</option>
            <option value="brouillon">Brouillon</option>
            <option value="publie">Publié</option>
            <option value="archive">Archivé</option>
          </select>
        </label>
        <label class="jp-admin-cat-statut">
          <span class="jp-sr-only">Validation</span>
          <select id="fValidation" aria-label="Validation">
            <option value="">Validation</option>
            <option value="a_valider">À valider</option>
            <option value="validee">Validées</option>
          </select>
        </label>
        <button type="button" class="jp-btn jp-btn-ghost" id="btnResetVal" title="Remettre à valider (filtre actuel)" disabled>Remettre à 0</button>
        <div class="jp-catalogue-prefs-wrap">
          <button type="button" class="jp-btn jp-btn-ghost jp-catalogue-icon-btn" id="prefsBtn" aria-expanded="false" aria-controls="prefsPanel">
            <span class="jp-catalogue-btn-label">Filtres</span>
          </button>
          <div class="jp-catalogue-prefs" id="prefsPanel" hidden role="dialog" aria-label="Filtres">
            <div class="jp-catalogue-prefs-section">
              <h2 class="jp-catalogue-prefs-title">Tri</h2>
              <select id="fSort" aria-label="Trier par">
                <option value="dci">DCI</option>
                <option value="nom">Premier nom commercial</option>
                <option value="secteur">Secteur</option>
                <option value="updated_at">Dernière modif.</option>
              </select>
            </div>
            <div class="jp-catalogue-prefs-section">
              <h2 class="jp-catalogue-prefs-title">Filtres</h2>
              <label class="jp-catalogue-col"><input type="checkbox" id="fIncomplet"><span>Incomplètes</span></label>
              <label class="jp-catalogue-field">Champ vide
                <select id="fIncompletChamp" disabled></select>
              </label>
              <label class="jp-catalogue-field">Secteur <select id="fSecteur"></select></label>
              <label class="jp-catalogue-field">Classe thérapeutique <select id="fClasseTh"></select></label>
              <label class="jp-catalogue-field">Classe pharmacologique <select id="fClassePh"></select></label>
              <label class="jp-catalogue-field">Lié à (type) <select id="fLieType"></select></label>
              <label class="jp-catalogue-field">Lié à (valeur)
                <div class="jp-ac-wrap">
                  <input type="search" id="fLieEntity" autocomplete="off" placeholder="Rechercher…" disabled>
                  <ul id="sug_lie" class="jp-ac-list" hidden role="listbox"></ul>
                </div>
                <input type="hidden" id="fLieEntityId" value="">
                <button type="button" class="jp-link-btn" id="fLieClear" hidden>Effacer</button>
              </label>
            </div>
            <div class="jp-catalogue-prefs-section">
              <h2 class="jp-catalogue-prefs-title">Colonnes</h2>
              <div class="jp-catalogue-cols" id="cols" role="group"></div>
            </div>
            <div class="jp-catalogue-prefs-foot">
              <button type="button" class="jp-btn jp-btn-ghost" id="prefsReset">Réinitialiser</button>
              <button type="button" class="jp-btn jp-btn-primary" id="prefsClose">Fermer</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="jp-med-workspace">
      <aside class="jp-med-listpane" aria-label="Fiches">
        <div id="list" class="jp-table-wrap"><p class="jp-muted">Chargement…</p></div>
      </aside>
    </div>
  </main>

  <div id="editorModal" class="jp-catalogue-fiche-modal" hidden>
    <div class="jp-catalogue-fiche-modal-backdrop" aria-hidden="true"></div>
    <section id="editor" class="jp-catalogue-fiche-modal-panel jp-med-editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <div class="jp-med-editor-head">
        <h2 class="jp-title" id="editorTitle">Nouvelle fiche</h2>
        <div class="jp-med-editor-head-meta">
          <span id="edValBadge"></span>
          <div class="jp-field jp-med-editor-status">
            <label class="jp-sr-only" for="fStatutEd">Statut</label>
            <select id="fStatutEd" aria-label="Statut de la fiche">
              <option value="brouillon">Brouillon</option>
              <option value="publie">Publié</option>
              <option value="archive">Archivé</option>
            </select>
          </div>
        </div>
      </div>
      <div class="jp-med-editor-body">
        <div class="jp-bdm-panel" aria-label="BDPM">
          <p class="jp-bdm-title">BDPM</p>
          <label class="jp-bdm-search-label" for="bdmQ">Recherche
            <input type="search" id="bdmQ" placeholder="Nom, DCI, CIP…" autocomplete="off">
          </label>
          <div id="bdmResults" class="jp-bdm-results" hidden role="listbox"></div>
          <p class="jp-bdm-licence">Source BDPM ANSM — Licence Ouverte</p>
        </div>
        <form id="form" class="jp-form" novalidate>
          <div id="fields"></div>
        </form>
      </div>
      <div class="jp-med-editor-foot">
        <button type="button" class="jp-btn jp-btn-ghost" id="btnCancel">Annuler</button>
        <button type="button" class="jp-btn jp-btn-ghost" id="btnSaveVal">Enregistrer et valider</button>
        <button type="submit" form="form" class="jp-btn jp-btn-primary" id="btnSave">Enregistrer</button>
      </div>
    </section>
  </div>

  <div id="valModal" class="jp-validation-modal" hidden role="dialog" aria-modal="true" aria-labelledby="valTitle">
    <div class="jp-validation-modal-backdrop" aria-hidden="true"></div>
    <section class="jp-validation-modal-panel">
      <header class="jp-validation-head">
        <h2 class="jp-title" id="valTitle" style="margin:0">Valider</h2>
        <p class="jp-validation-progress" id="valProgress" aria-live="polite">—</p>
      </header>
      <div class="jp-validation-body" id="valBody"></div>
      <footer class="jp-validation-foot">
        <button type="button" class="jp-btn jp-btn-ghost" data-close-validation>Fermer</button>
        <div class="jp-validation-actions">
          <button type="button" class="jp-btn jp-btn-ghost jp-validation-btn-edit" id="valEdit">Modifier</button>
          <button type="button" class="jp-btn jp-btn-primary jp-validation-btn-ok" id="valOk">Validé</button>
        </div>
      </footer>
    </section>
  </div>

  <script src="../js/constants.js?v=046"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js?v=059"></script>
  <script src="../js/fab.js?v=059"></script>
  <script src="../js/ui.js?v=059"></script>
  <script src="../js/ui-modal.js"></script>
  <script src="../js/typeahead.js?v=068"></script>
  <script src="../js/bdm.js?v=046"></script>
  <script src="../js/entites.js"></script>
  <script src="../js/medicaments.js"></script>
  <script src="../IA/gemini-client.js"></script>
  <script src="../IA/referentiel-matrice.js?v=066"></script>
  <script src="../js/referentiel-comparaison.js?v=071"></script>
  <script src="../js/referentiel-admin.js?v=069"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      JpReferentielAdmin.boot().catch(function (e) { JpToast.fromError(e); });
    });
  </script>
</body>
</html>
