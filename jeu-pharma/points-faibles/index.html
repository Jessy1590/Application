<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mes points faibles — Jeu Pharma</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="../espace.html">← Mon espace</a>
    <p class="jp-kicker">Révision</p>
    <h1 class="jp-title">Mes points faibles</h1>
    <p class="jp-sub">Fiches et champs les plus ratés d’après vos quiz, tableaux à trous et notes de fiche aléatoire.</p>

    <div id="summary" class="jp-panel" hidden>
      <p id="summaryText" class="jp-sub" style="margin:0"></p>
    </div>

    <div id="root">
      <p class="jp-muted">Chargement…</p>
    </div>
  </main>

  <div id="scoreModal" class="jp-trous-score-modal" hidden>
    <div class="jp-trous-score-modal-backdrop" data-close-score-modal></div>
    <div class="jp-trous-score-modal-panel" role="dialog" aria-modal="true" aria-labelledby="scoreModalTitle">
      <div class="jp-trous-score-modal-head">
        <h2 id="scoreModalTitle">Mettre un score</h2>
        <button type="button" class="jp-icon-btn" data-close-score-modal aria-label="Fermer">×</button>
      </div>
      <form id="scoreForm">
        <label class="jp-trous-score-field" for="scoreNote">Note sur 10
          <input id="scoreNote" type="number" inputmode="numeric" min="0" max="10" step="1" autocomplete="off">
        </label>
        <div class="jp-field-actions jp-trous-score-modal-actions">
          <button type="button" class="jp-btn jp-btn-ghost" data-close-score-modal>Annuler</button>
          <button type="submit" class="jp-btn jp-btn-primary" id="btnScoreValidate">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/constants.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/logs.js"></script>
  <script src="../js/bugs.js"></script>
  <script src="../js/fab.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/profil.js"></script>
  <script src="../js/medicaments.js"></script>
  <script src="../js/niveaux.js"></script>
  <script src="../js/fiche-aleatoire.js"></script>
  <script src="../js/points-faibles.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'points-faibles', homeHref: JpFab.PORTAIL_URL });

      const root = document.getElementById('root');
      const summary = document.getElementById('summary');
      const summaryText = document.getElementById('summaryText');
      const scoreModal = document.getElementById('scoreModal');
      const scoreForm = document.getElementById('scoreForm');
      const scoreNote = document.getElementById('scoreNote');

      let mode = 'liste';
      let pool = [];
      let index = 0;
      let current = null;
      let revealed = false;
      let scores = [];
      let dernierScore = null;
      let agg = null;

      function libelleFiche(row) {
        const dci = row.dci ? String(row.dci) : '';
        const noms = JpMedicaments.formatNoms(row) || '';
        if (dci && noms) return dci + ' · ' + noms;
        return dci || noms || '—';
      }

      function renderListe() {
        mode = 'liste';
        if (!agg || (!agg.matrices.length && !agg.champs.length)) {
          JpUi.emptyState(root, {
            title: 'Aucun point faible',
            text: 'Jouez à un quiz, un tableau à trous ou une fiche aléatoire pour alimenter cette liste.',
            actionHref: '../espace.html',
            actionLabel: 'Mon espace',
          });
          return;
        }

        let html = '';
        if (pool.length) {
          html += '<div class="jp-field-actions" style="margin-bottom:1rem">'
            + '<button type="button" class="jp-btn jp-btn-primary" id="btnStart">Réviser les fiches</button>'
            + '</div>';
        }

        if (agg.matrices.length) {
          html += '<h2 class="jp-title" style="font-size:1.15rem;margin:0 0 0.5rem">Fiches</h2>';
          html += '<div class="jp-table-wrap"><table class="jp-table"><thead><tr>'
            + '<th>Médicament</th><th>Échecs</th></tr></thead><tbody>';
          const byId = new Map(pool.map(function (r) { return [String(r.id), r]; }));
          agg.matrices.slice(0, 30).forEach(function (m) {
            const row = byId.get(String(m.id));
            const label = row ? libelleFiche(row) : ('Fiche ' + String(m.id).slice(0, 8) + '…');
            html += '<tr><td>' + JpUi.escapeHtml(label) + '</td>'
              + '<td><strong>' + JpUi.escapeHtml(String(m.erreurs)) + '</strong></td></tr>';
          });
          html += '</tbody></table></div>';
        }

        if (agg.champs.length) {
          html += '<h2 class="jp-title" style="font-size:1.15rem;margin:1.5rem 0 0.5rem">Champs</h2>';
          html += '<div class="jp-table-wrap"><table class="jp-table"><thead><tr>'
            + '<th>Champ</th><th>Échecs</th></tr></thead><tbody>';
          agg.champs.slice(0, 20).forEach(function (c) {
            html += '<tr><td>' + JpUi.escapeHtml(c.libelle) + '</td>'
              + '<td><strong>' + JpUi.escapeHtml(String(c.erreurs)) + '</strong></td></tr>';
          });
          html += '</tbody></table></div>';
        }

        root.innerHTML = html;
        const btn = document.getElementById('btnStart');
        if (btn) {
          btn.addEventListener('click', function () {
            index = 0;
            montrer();
          });
        }
      }

      function renderSession() {
        mode = 'session';
        if (!current) {
          JpUi.emptyState(root, {
            title: 'Session terminée',
            text: 'Toutes les fiches de la liste ont été parcourues.',
            actionHref: '#',
            actionLabel: 'Retour à la liste',
          });
          const a = root.querySelector('a.jp-btn, a');
          if (a) {
            a.addEventListener('click', function (ev) {
              ev.preventDefault();
              renderListe();
            });
          }
          return;
        }

        const champs = JpFicheAleatoire.champsActifs();
        let html = '<p class="jp-muted" style="margin:0 0 0.75rem">'
          + 'Fiche ' + (index + 1) + ' / ' + pool.length
          + (current._erreurs ? ' · ' + current._erreurs + ' échec(s) recensés' : '')
          + '</p>';
        html += '<div class="jp-table-wrap"><table class="jp-table"><tbody>';
        champs.forEach(function (c) {
          const show = JpFicheAleatoire.estIdentite(c.code) || revealed;
          const texte = show ? (JpFicheAleatoire.texteChamp(current, c) || '—') : '';
          html += '<tr><th scope="row">' + JpUi.escapeHtml(c.libelle) + '</th><td>'
            + (show ? JpUi.escapeHtml(texte) : '') + '</td></tr>';
        });
        html += '</tbody></table></div>';
        html += '<div class="jp-field-actions jp-trous-actions">'
          + '<button type="button" class="jp-btn jp-btn-primary" id="btnReveal">Voir les réponses</button>'
          + '<button type="button" class="jp-btn jp-btn-ghost" id="btnScore">Mettre un score</button>'
          + '<button type="button" class="jp-btn jp-btn-ghost" id="btnNext">Suivante</button>'
          + '<button type="button" class="jp-btn jp-btn-ghost" id="btnBackList">Liste</button>'
          + '</div>';
        if (dernierScore && dernierScore.matrice_id === current.id) {
          html += '<div class="jp-panel">'
            + '<p class="jp-kicker">Score enregistré</p>'
            + '<p class="jp-brand jp-trous-score-value">'
            + JpUi.escapeHtml(String(dernierScore.score_obtenu)) + ' / '
            + JpUi.escapeHtml(String(dernierScore.score_max)) + '</p></div>';
        }
        root.innerHTML = html;

        document.getElementById('btnReveal').addEventListener('click', function () {
          if (revealed) return;
          revealed = true;
          renderSession();
        });
        document.getElementById('btnScore').addEventListener('click', openScoreModal);
        document.getElementById('btnNext').addEventListener('click', function () {
          index += 1;
          montrer();
        });
        document.getElementById('btnBackList').addEventListener('click', renderListe);
      }

      function montrer() {
        if (index < 0 || index >= pool.length) {
          current = null;
          renderSession();
          return;
        }
        current = pool[index];
        revealed = false;
        dernierScore = null;
        renderSession();
      }

      function openScoreModal() {
        if (!current) return;
        scoreNote.value = '';
        scoreModal.hidden = false;
        scoreNote.focus();
      }

      function closeScoreModal() {
        scoreModal.hidden = true;
      }

      scoreModal.querySelectorAll('[data-close-score-modal]').forEach(function (el) {
        el.addEventListener('click', closeScoreModal);
      });
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape' && !scoreModal.hidden) closeScoreModal();
      });

      scoreForm.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        if (!current) return;
        const raw = scoreNote.value.trim();
        if (raw === '') {
          JpToast.warn('Indiquez une note');
          return;
        }
        if (!/^\d+$/.test(raw) || Number(raw) > JpFicheAleatoire.SCORE_MAX) {
          JpToast.warn('Note entière entre 0 et 10');
          return;
        }
        const btn = document.getElementById('btnScoreValidate');
        btn.disabled = true;
        try {
          const saved = await JpFicheAleatoire.enregistrer(current.id, Number(raw));
          scores.push(saved);
          dernierScore = saved;
          closeScoreModal();
          renderSession();
          JpToast.ok('Score enregistré : ' + saved.score_obtenu + '/' + saved.score_max);
        } catch (e) {
          JpToast.fromError(e);
        } finally {
          btn.disabled = false;
        }
      });

      try {
        agg = await JpPointsFaibles.agreger();
        scores = await JpFicheAleatoire.mesScores();
        pool = await JpPointsFaibles.poolRevision(agg);
        summary.hidden = false;
        summaryText.textContent = agg.totalErreurs
          ? (agg.matrices.length + ' fiche(s) et ' + agg.champs.length
            + ' champ(s) avec échecs recensés (' + agg.totalErreurs + ' occurrences).')
          : 'Aucune erreur recensée pour le moment.';
        void JpLogs?.action?.('points_faibles_ouvrir', {
          matrices: agg.matrices.length,
          champs: agg.champs.length,
        });
        renderListe();
      } catch (e) {
        JpToast.fromError(e);
        JpUi.emptyState(root, {
          title: 'Indisponible',
          text: e.message || String(e),
        });
      }
    });
  </script>
</body>
</html>
