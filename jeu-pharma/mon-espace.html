<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon espace</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
  <main class="jp-player-shell">
    <a class="jp-back" href="index.html">←</a>
    <h1 class="jp-player-brand">Mon espace</h1>
    <h2 class="jp-title" style="font-size:1.1rem;margin:0 0 0.65rem">Parcours</h2>
    <ul class="jp-list-clean" id="insc"></ul>
    <h2 class="jp-title" style="font-size:1.1rem;margin:1.5rem 0 0.65rem">Scores</h2>
    <ul class="jp-list-clean" id="scores"></ul>
  </main>
  <nav class="jp-bottom-nav" aria-label="Navigation">
    <a href="parcours.html">Parcours</a>
    <a href="mon-espace.html" aria-current="page">Espace</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="jeux/index.html">Jeux</a>
  </nav>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/resolver.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'mon-espace', homeHref: JpFab.PORTAIL_URL });
      try {
        const data = await JpV2Resolver.monEspace();
        const insc = (data.inscriptions || []).filter(function (i) { return i.statut === 'accepte'; });
        document.getElementById('insc').innerHTML = insc.map(function (i) {
          return '<li class="jp-list-row"><strong>' + JpUi.escapeHtml(i.libelle) + '</strong>'
            + '<a class="jp-btn jp-btn-ghost jp-btn-touch" href="espace.html?parcours=' + encodeURIComponent(i.parcours_id) + '">Ouvrir</a></li>';
        }).join('') || '<li class="jp-muted">—</li>';
        const scores = data.scores || [];
        document.getElementById('scores').innerHTML = scores.map(function (s) {
          return '<li class="jp-list-row"><strong>' + JpUi.escapeHtml(s.titre || s.code_unique || '') + '</strong>'
            + '<span class="jp-badge-soft">' + (s.score_obtenu ?? '—') + ' / ' + (s.score_max ?? '—') + '</span></li>';
        }).join('') || '<li class="jp-muted">—</li>';
      } catch (e) {
        JpToast.fromError(e);
      }
    });
  </script>
</body>
</html>
