<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon parcours — Jeu Pharma</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css">
</head>
<body>
  <main class="jp-page">
    <a class="jp-back" href="index.html">← Hub</a>
    <p class="jp-kicker">Espace</p>
    <h1 class="jp-title">Mon parcours</h1>
    <p class="jp-sub">Thèmes et sous-parcours se débloquent progressivement. Seules les connaissances publiées y sont visibles.</p>

    <div class="jp-field">
      <label for="selParcours">Parcours actif</label>
      <select id="selParcours"></select>
    </div>
    <p id="parcoursDesc" class="jp-muted" style="margin:0.5rem 0 1rem"></p>
    <button type="button" class="jp-btn jp-btn-primary" id="btnSaveParcours">Enregistrer</button>

    <section style="margin-top:2rem" aria-labelledby="modTitle">
      <h2 id="modTitle" class="jp-title">Arborescence</h2>
      <div id="modules" class="jp-v2-tree"><p class="jp-muted">Chargement…</p></div>
    </section>
  </main>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/resolver.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'espace', homeHref: JpFab.PORTAIL_URL });
      const sel = document.getElementById('selParcours');
      const modsEl = document.getElementById('modules');

      function statutBadge(s) {
        if (s === 'groupe') return '<span class="jp-v2-badge">Thème</span>';
        if (s === 'termine') return '<span class="jp-v2-badge is-done">Terminé</span>';
        if (s === 'verrouille') return '<span class="jp-v2-badge is-lock">Verrouillé</span>';
        return '<span class="jp-v2-badge">Débloqué</span>';
      }

      function renderTree(mods) {
        const byParent = {};
        const roots = [];
        mods.forEach(function (m) {
          if (m.parent_id) {
            (byParent[m.parent_id] = byParent[m.parent_id] || []).push(m);
          } else {
            roots.push(m);
          }
        });
        roots.sort(function (a, b) { return a.ordre - b.ordre; });

        function renderNode(m, depth) {
          const kids = (byParent[m.id] || []).slice().sort(function (a, b) { return a.ordre - b.ordre; });
          const locked = m.statut === 'verrouille';
          const isGroup = !!m.est_groupe || m.statut === 'groupe';
          let html = '<article class="jp-v2-module' + (locked ? ' is-locked' : '')
            + (isGroup ? ' is-group' : '') + '" style="margin-left:' + (depth * 1.1) + 'rem">'
            + '<div style="display:flex;justify-content:space-between;gap:0.5rem;align-items:center">'
            + '<h3 style="margin:0">' + JpUi.escapeHtml(m.titre) + '</h3>'
            + statutBadge(m.statut) + '</div>'
            + (m.resume ? '<p class="jp-muted" style="margin:0.5rem 0 0">' + JpUi.escapeHtml(m.resume) + '</p>' : '')
            + (m.objectifs ? '<p style="margin:0.35rem 0 0"><strong>Objectifs :</strong> '
              + JpUi.escapeHtml(m.objectifs) + '</p>' : '')
            + (!locked && !isGroup
              ? '<p style="margin:0.65rem 0 0"><a href="catalogue.html">Voir le catalogue</a></p>'
              : '')
            + '</article>';
          kids.forEach(function (k) { html += renderNode(k, depth + 1); });
          return html;
        }

        if (!roots.length) {
          modsEl.innerHTML = '<p class="jp-muted">Aucun module publié pour ce parcours.</p>';
          return;
        }
        modsEl.innerHTML = roots.map(function (r) { return renderNode(r, 0); }).join('');
      }

      let parcoursList = [];

      function syncDesc() {
        const p = parcoursList.find(function (x) { return x.id === sel.value; });
        const el = document.getElementById('parcoursDesc');
        el.textContent = p?.description || '';
      }

      async function refresh() {
        syncDesc();
        const prog = await JpV2Resolver.progression(sel.value || null);
        renderTree(prog.modules || []);
      }

      try {
        parcoursList = await JpV2Resolver.listParcours();
        const profil = await JpV2Resolver.getProfilV2();
        parcoursList.forEach(function (p) {
          const o = document.createElement('option');
          o.value = p.id;
          o.textContent = p.libelle + (p.code === 'introduction' ? ' · recommandé' : '');
          sel.appendChild(o);
        });
        if (profil?.parcours_id) {
          sel.value = profil.parcours_id;
        } else {
          const ensured = await JpV2Resolver.ensureParcoursActif();
          const intro = parcoursList.find(function (p) { return p.code === 'introduction'; });
          sel.value = ensured?.parcours_id || (intro || parcoursList[0] || {}).id || '';
        }
        await refresh();
      } catch (e) {
        JpToast.fromError(e);
        modsEl.innerHTML = '<p class="jp-muted">Impossible de charger.</p>';
      }

      document.getElementById('btnSaveParcours').addEventListener('click', async function () {
        try {
          await JpV2Resolver.setParcoursActif(sel.value || null);
          JpToast.ok('Parcours enregistré');
          await refresh();
        } catch (e) {
          JpToast.fromError(e);
        }
      });
      sel.addEventListener('change', function () { void refresh(); });
    });
  </script>
</body>
</html>
