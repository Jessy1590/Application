<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parcours</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css?v=059">
<link rel="stylesheet" href="css/v2.css?v=028">
<link rel="stylesheet" href="css/player.css?v=029">
</head>
<body>
  <main class="jp-player-shell">
    <a class="jp-back" href="parcours.html">←</a>
    <header class="jp-pc-hero" id="hero" hidden></header>
    <div id="modules"></div>
  </main>
  <nav class="jp-bottom-nav" aria-label="Navigation">
    <a href="parcours.html" aria-current="page">Parcours</a>
    <a href="mon-espace.html">Espace</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="jeux/index.html">Jeux</a>
  </nav>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js?v=059"></script>
  <script src="js/fab.js?v=059"></script>
  <script src="js/ui.js?v=059"></script>
  <script src="js/resolver.js?v=050"></script>
  <script src="js/parcours-ui.js?v=028"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'espace', homeHref: JpFab.PORTAIL_URL });
      const esc = JpUi.escapeHtml;
      const P = JpParcoursUi;
      const modsEl = document.getElementById('modules');
      const hero = document.getElementById('hero');

      function leafRow(m, depth) {
        const locked = m.statut === 'verrouille';
        const done = m.statut === 'termine';
        const pct = P.clampPct(m.pct);
        const maj = P.majLabel(m.maj_at);
        let state;
        if (locked) state = '<span class="jp-lc-state is-lock" aria-hidden="true">🔒</span>';
        else if (done) state = '<span class="jp-lc-state is-done" aria-hidden="true">✓</span>';
        else state = '<span class="jp-lc-state is-run" aria-hidden="true">' + pct + '<small>%</small></span>';
        let body = '<div class="jp-lc-main"><strong>' + esc(m.titre) + '</strong>';
        if (maj) body += '<small class="jp-lc-maj">' + esc(maj) + '</small>';
        if (locked && m.bloque_par) body += '<small class="jp-lc-lock">' + esc(P.messageBloque(m.bloque_par)) + '</small>';
        else if (!done && pct > 0) body += P.progressBar(pct, 'Avancement ' + m.titre);
        body += '</div>';
        const action = locked
          ? '<span class="jp-badge-soft off">Verrouillée</span>'
          : '<a class="jp-btn ' + (done ? 'jp-btn-ghost' : 'jp-btn-primary') + ' jp-btn-touch" href="lecon.html?module='
            + encodeURIComponent(m.id) + '">' + (done ? 'Revoir' : (pct > 0 ? 'Continuer' : 'Ouvrir')) + '</a>';
        return '<div class="jp-lc' + (locked ? ' is-locked' : '') + (done ? ' is-done' : '') + '" data-depth="' + depth + '">'
          + state + body + action + '</div>';
      }

      function renderTree(mods) {
        const ids = new Set(mods.map(function (m) { return m.id; }));
        const byParent = {};
        mods.forEach(function (m) {
          const p = m.parent_id && ids.has(m.parent_id) ? m.parent_id : '';
          (byParent[p] = byParent[p] || []).push(m);
        });
        function node(m, depth) {
          const kids = (byParent[m.id] || []).slice().sort(function (a, b) { return a.ordre - b.ordre; });
          if (!m.est_groupe) return leafRow(m, depth);
          const d = m.detail || {};
          const locked = m.statut === 'verrouille' || m.verrouille;
          let head = '<header class="jp-chap-head"><h2>' + esc(m.titre) + '</h2>'
            + '<span class="jp-chap-count">' + (d.nb_valides || 0) + ' / ' + (d.nb_lecons || 0) + ' · ' + P.clampPct(m.pct) + ' %</span></header>';
          if (locked && m.bloque_par) head += '<p class="jp-chap-lock">🔒 ' + esc(P.messageBloque(m.bloque_par)) + '</p>';
          else head += P.progressBar(m.pct, 'Avancement ' + m.titre);
          return '<section class="jp-chap' + (locked ? ' is-locked' : '') + (m.valide ? ' is-done' : '')
            + '" id="jp-chap-' + esc(m.id) + '" data-chapitre-id="' + esc(m.id) + '">'
            + head + '<div class="jp-chap-body">' + kids.map(function (k) { return node(k, depth + 1); }).join('') + '</div></section>';
        }
        const roots = (byParent[''] || []).slice().sort(function (a, b) { return a.ordre - b.ordre; });
        modsEl.innerHTML = roots.length ? roots.map(function (r) { return node(r, 0); }).join('') : '<p class="jp-muted">—</p>';
        const chapQ = new URLSearchParams(location.search).get('chapitre');
        if (chapQ) {
          const el = document.getElementById('jp-chap-' + chapQ);
          if (el) {
            el.classList.add('is-focus');
            requestAnimationFrame(function () {
              el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
          }
        }
      }

      function renderHero(parcours, libelleFallback) {
        const p = parcours || {};
        const maj = P.majLabel(p.maj_at);
        hero.hidden = false;
        hero.innerHTML = '<div class="jp-pc-hero-main"><h1 class="jp-player-brand">' + esc(p.libelle || libelleFallback || 'Parcours') + '</h1>'
          + (maj ? '<p class="jp-pc-meta">' + esc(maj) + '</p>' : '')
          + (p.description ? '<p class="jp-pc-desc">' + esc(p.description) + '</p>' : '')
          + '<p class="jp-pc-meta">' + (p.nb_valides || 0) + ' / ' + (p.nb_lecons || 0) + ' leçons validées</p></div>'
          + P.ring(p.pct, { size: 84 });
        if (p.verrouille && p.bloque_par) {
          hero.insertAdjacentHTML('afterend', '<p class="jp-lock-banner">🔒 ' + esc(P.messageBloque(p.bloque_par)) + '</p>');
        }
      }

      try {
        const [inscAll, profil] = await Promise.all([
          JpV2Resolver.mesInscriptions(),
          JpV2Resolver.getProfilV2(),
        ]);
        const insc = inscAll.filter(function (i) { return i.statut === 'accepte'; });
        if (!insc.length) {
          modsEl.innerHTML = '<p class="jp-muted"><a href="parcours.html">Demander un parcours</a></p>';
          return;
        }
        // Le parcours cliqué (?parcours=) est ouvert directement ; sinon parcours actif du profil, sinon le premier
        const q = new URLSearchParams(location.search).get('parcours');
        let id = insc[0].parcours_id;
        if (q && insc.some(function (i) { return i.parcours_id === q; })) id = q;
        else if (profil && profil.parcours_id && insc.some(function (i) { return i.parcours_id === profil.parcours_id; })) id = profil.parcours_id;
        if (!profil || profil.parcours_id !== id) {
          await JpV2Resolver.setParcoursActif(id, { inscriptions: insc });
        }
        const prog = await JpV2Resolver.progression(id);
        const meta = insc.find(function (i) { return i.parcours_id === id; });
        document.title = (meta && meta.libelle ? meta.libelle : 'Parcours') + ' — Jeu Pharma';
        renderHero(prog.parcours, meta && meta.libelle);
        renderTree(prog.modules || []);
      } catch (e) {
        JpToast.fromError(e);
        modsEl.innerHTML = '<p class="jp-muted">—</p>';
      }
    });
  </script>
</body>
</html>
