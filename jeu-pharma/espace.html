<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parcours</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' __SUPABASE_HTTP__ __SUPABASE_WSS__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>body{display:none}</style>
<script src="../protect.js"></script>
<script>initialiserSite(JpApp.SITE_ID);</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
  <main class="jp-player-shell">
    <a class="jp-back" href="parcours.html">←</a>
    <h1 class="jp-player-brand" id="title">—</h1>
    <select id="selParcours" class="jp-field" style="margin-bottom:1rem;width:100%"></select>
    <div id="modules"></div>
  </main>
  <nav class="jp-bottom-nav" aria-label="Navigation">
    <a href="parcours.html" aria-current="page">Parcours</a>
    <a href="mon-espace.html">Espace</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="jeux/index.html">Jeux</a>
  </nav>
  <script src="js/constants.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/bugs.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/resolver.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      JpUi.bootPage({ module: 'espace', homeHref: JpFab.PORTAIL_URL });
      const sel = document.getElementById('selParcours');
      const modsEl = document.getElementById('modules');

      function renderTree(mods) {
        const byParent = {};
        const roots = [];
        mods.forEach(function (m) {
          if (m.parent_id) (byParent[m.parent_id] = byParent[m.parent_id] || []).push(m);
          else roots.push(m);
        });
        roots.sort(function (a, b) { return a.ordre - b.ordre; });
        function node(m, depth) {
          const kids = (byParent[m.id] || []).slice().sort(function (a, b) { return a.ordre - b.ordre; });
          const locked = m.statut === 'verrouille';
          const isGroup = !!m.est_groupe || m.statut === 'groupe';
          let html = '<div class="jp-list-row" style="margin-left:' + (depth * 0.75) + 'rem;margin-bottom:0.5rem">'
            + '<strong>' + JpUi.escapeHtml(m.titre) + '</strong>';
          if (!locked && !isGroup) {
            html += '<a class="jp-btn jp-btn-primary jp-btn-touch" href="lecon.html?module=' + encodeURIComponent(m.id) + '">Ouvrir</a>';
          } else if (locked) {
            html += '<span class="jp-badge-soft off">🔒</span>';
          }
          html += '</div>';
          kids.forEach(function (k) { html += node(k, depth + 1); });
          return html;
        }
        modsEl.innerHTML = roots.length ? roots.map(function (r) { return node(r, 0); }).join('') : '<p class="jp-muted">—</p>';
      }

      async function refresh() {
        const p = (await JpV2Resolver.mesInscriptions()).find(function (x) { return x.parcours_id === sel.value; });
        document.getElementById('title').textContent = p?.libelle || 'Parcours';
        const prog = await JpV2Resolver.progression(sel.value || null);
        renderTree(prog.modules || []);
      }

      try {
        const insc = (await JpV2Resolver.mesInscriptions()).filter(function (i) { return i.statut === 'accepte'; });
        if (!insc.length) {
          modsEl.innerHTML = '<p class="jp-muted"><a href="parcours.html">Demander un parcours</a></p>';
          sel.hidden = true;
          return;
        }
        insc.forEach(function (i) {
          const o = document.createElement('option');
          o.value = i.parcours_id;
          o.textContent = i.libelle;
          sel.appendChild(o);
        });
        const q = new URLSearchParams(location.search).get('parcours');
        const profil = await JpV2Resolver.getProfilV2();
        if (q && insc.some(function (i) { return i.parcours_id === q; })) sel.value = q;
        else if (profil?.parcours_id && insc.some(function (i) { return i.parcours_id === profil.parcours_id; })) sel.value = profil.parcours_id;
        else sel.value = insc[0].parcours_id;
        await JpV2Resolver.setParcoursActif(sel.value);
        await refresh();
      } catch (e) {
        JpToast.fromError(e);
        modsEl.innerHTML = '<p class="jp-muted">—</p>';
      }

      sel.addEventListener('change', async function () {
        try {
          await JpV2Resolver.setParcoursActif(sel.value);
          await refresh();
        } catch (e) { JpToast.fromError(e); }
      });
    });
  </script>
</body>
</html>
