</head>
<body>
  <div id="hubToast" class="hub-toast" hidden></div>

  <header class="hub-header">
    <div>
      <p class="hub-eyebrow">Pharmacie</p>
      <h1>Phie Evreux</h1>
      <p class="hub-sub">Choisissez une application</p>
    </div>
    <button type="button" class="hub-gear" id="hubGearBtn" hidden title="Administration" aria-label="Administration">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main class="hub-grid">
    <a class="hub-card" href="app/anciennelocation/">
      <p class="hub-card-kicker">App</p>
      <h2>Ancienne Location</h2>
      <p class="hub-card-desc">Suivi locations existant (comptes, appels, fiches).</p>
      <span class="hub-card-arrow" aria-hidden="true">→</span>
    </a>
    <a class="hub-card" href="app/location/">
      <p class="hub-card-kicker">App</p>
      <h2>Location</h2>
      <p class="hub-card-desc">Création, suivi et contact — nouvelle application.</p>
      <span class="hub-card-arrow" aria-hidden="true">→</span>
    </a>
    <a class="hub-card" href="app/log/" id="hubCardLog" hidden>
      <p class="hub-card-kicker">Admin</p>
      <h2>Log</h2>
      <p class="hub-card-desc">Journal d’activité du site (admin portail).</p>
      <span class="hub-card-arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <div class="hub-admin-sheet" id="hubAdminSheet" hidden>
    <div class="hub-admin-backdrop" data-close-admin></div>
    <div class="hub-admin-panel" role="dialog" aria-labelledby="hubAdminTitle">
      <div class="hub-admin-head">
        <h2 id="hubAdminTitle">Administration</h2>
        <button type="button" class="phie-icon-btn" data-close-admin aria-label="Fermer">✕</button>
      </div>
      <div class="hub-admin-tabs">
        <button type="button" class="hub-admin-tab active" data-admin-tab="equipe">Équipe</button>
        <button type="button" class="hub-admin-tab" data-admin-tab="invite">Inviter</button>
        <button type="button" class="hub-admin-tab" data-admin-tab="bugs">Bugs</button>
      </div>

      <div class="hub-admin-pane" id="adminPane-equipe">
        <div id="hubEquipeList" class="hub-equipe-list"></div>
      </div>

      <div class="hub-admin-pane" id="adminPane-invite" hidden>
        <form id="hubInviteForm" class="hub-form" autocomplete="off">
          <label>Nom affiché
            <input name="display_name" placeholder="Prénom Nom">
          </label>
          <label>E-mail
            <input name="email" type="email" required autocomplete="off">
          </label>
          <label>Mot de passe temporaire
            <input name="password" type="password" required minlength="8" autocomplete="new-password">
          </label>
          <button type="submit" class="hub-btn hub-btn-primary" id="hubInviteBtn">Créer le compte</button>
          <p class="hub-msg" id="hubInviteMsg" hidden></p>
        </form>
      </div>

      <div class="hub-admin-pane" id="adminPane-bugs" hidden>
        <button type="button" class="hub-btn hub-btn-primary" id="hubOpenBugsBtn">Ouvrir la gestion des bugs</button>
      </div>
    </div>
  </div>

  <script src="shared/supabase-apps.js"></script>
  <script src="shared/theme.js"></script>
  <script src="shared/equipe.js"></script>
  <script src="shared/invite.js"></script>
  <script src="shared/bugs.js"></script>
  <script src="shared/logs.js"></script>
  <script src="shared/fab.js"></script>
  <script src="hub.js"></script>
</body>
</html>
