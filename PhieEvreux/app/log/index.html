<script>
(function () {
  try {
    var t = localStorage.getItem('phieevreux-theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#f4f5f8' : '#0a0a0f');
    }
  } catch (e) {}
})();
</script>

</head>
<body class="log-page">
  <header class="log-top">
    <div>
      <p class="log-eyebrow">Phie Evreux</p>
      <h1>Journal d’activité</h1>
      <p class="log-sub">Réservé aux administrateurs portail</p>
    </div>
    <div class="log-top-actions">
      <button type="button" class="log-btn log-btn-ghost" id="logThemeBtn" title="Thème" aria-label="Basculer le thème">◐</button>
      <a class="log-btn log-btn-ghost" href="../../index.html">← Hub</a>
    </div>
  </header>

  <main class="log-main">
    <form class="log-filters" id="logFilters" autocomplete="off">
      <label>App
        <select name="app">
          <option value="">Toutes</option>
          <option value="hub">Hub</option>
          <option value="location">Location</option>
          <option value="anciennelocation">Ancienne Location</option>
          <option value="log">Log</option>
        </select>
      </label>
      <label>Module
        <input name="module" placeholder="création, suivi…">
      </label>
      <label>Action
        <input name="action" placeholder="session, navigate…">
      </label>
      <label>Utilisateur
        <input name="user" placeholder="nom ou uuid">
      </label>
      <label>Niveau
        <select name="level">
          <option value="">Tous</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
        </select>
      </label>
      <div class="log-filters-actions">
        <button type="submit" class="log-btn">Filtrer</button>
        <button type="button" class="log-btn log-btn-ghost" id="logRefresh">Actualiser</button>
      </div>
    </form>

    <p class="log-msg" id="logMsg" hidden></p>
    <p class="log-count" id="logCount"></p>
    <div class="log-table-wrap">
      <table class="log-table" id="logTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Utilisateur</th>
            <th>App</th>
            <th>Module</th>
            <th>Action</th>
            <th>Niveau</th>
            <th>Détail</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="7" class="log-muted">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="log-pager">
      <button type="button" class="log-btn log-btn-ghost" id="logPrev" disabled>← Précédent</button>
      <button type="button" class="log-btn log-btn-ghost" id="logNext" disabled>Suivant →</button>
    </div>
  </main>

  <script src="../../shared/supabase-apps.js"></script>
  <script src="../../shared/theme.js"></script>
  <script src="../../shared/equipe.js"></script>
  <script src="../../shared/logs.js"></script>
  <script src="../../shared/bugs.js"></script>
  <script src="../../shared/fab.js"></script>
  <script src="log.js"></script>
</body>
</html>
