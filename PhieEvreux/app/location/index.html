<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Location — Phie Evreux</title>
<meta name="theme-color" content="#0a0a0f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://kpjflntnotftpzffjbud.supabase.co wss://kpjflntnotftpzffjbud.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
<script>
(function () {
  try {
    var t = localStorage.getItem('phieevreux-theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#f4f5f8' : '#0a0a0f');
    }
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../../protect.js"></script>

<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="../../shared/fab.css">
</head>
<body>
  <header class="loc-top">
    <div>
      <p class="loc-eyebrow">Phie Evreux</p>
      <h1>Location</h1>
    </div>
    <div class="loc-top-actions">
      <button type="button" class="loc-theme-btn" id="locThemeBtn" title="Thème" aria-label="Basculer le thème">◐</button>
    </div>
  </header>

  <main class="loc-tiles" id="locHome">
    <button type="button" class="loc-tile" data-view="creation">
      <span class="loc-tile-kicker">Module</span>
      <strong>Création</strong>
      <span class="loc-tile-desc">Nouvelle fiche location</span>
    </button>
    <button type="button" class="loc-tile" data-view="suivi">
      <span class="loc-tile-kicker">Module</span>
      <strong>Suivi</strong>
      <span class="loc-tile-desc">Fiches et prolongations</span>
    </button>
    <button type="button" class="loc-tile" data-view="contact">
      <span class="loc-tile-kicker">Module</span>
      <strong>Contact</strong>
      <span class="loc-tile-desc">Patients à contacter</span>
    </button>
    <button type="button" class="loc-tile" data-view="facture">
      <span class="loc-tile-kicker">Module</span>
      <strong>Facture</strong>
      <span class="loc-tile-desc">Vérification dossier prestataire</span>
    </button>
    <button type="button" class="loc-tile" data-view="parametres" id="locTileParametres" hidden>
      <span class="loc-tile-kicker">Module</span>
      <strong>Paramètres</strong>
      <span class="loc-tile-desc">Règles, prestataires, seuils</span>
    </button>
  </main>

  <section class="loc-panel" id="locPanel" hidden>
    <button type="button" class="loc-back" id="locBackBtn">← Accueil Location</button>
    <h2 id="locPanelTitle">—</h2>
    <div id="locViewContent"></div>
  </section>

  <script src="../../shared/supabase-apps.js"></script>
  <script src="../../shared/theme.js"></script>
  <script src="../../shared/equipe.js"></script>
  <script src="../../shared/bugs.js"></script>
  <script src="../../shared/fab.js"></script>
  <script src="modules/rules-engine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fields.js"></script>
  <script src="js/impression.js"></script>
  <script src="js/creation.js"></script>
  <script src="js/suivi.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/facture.js"></script>
  <script src="js/admin-location.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
